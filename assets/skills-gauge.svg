<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" height="auto">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00ff88"/><stop offset="100%" stop-color="#00ddaa"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00ffff"/><stop offset="100%" stop-color="#0088ff"/>
    </linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff6600"/><stop offset="100%" stop-color="#ff003c"/>
    </linearGradient>
    <linearGradient id="g4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9d00ff"/><stop offset="100%" stop-color="#6600ff"/>
    </linearGradient>
    <linearGradient id="g5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffff00"/><stop offset="100%" stop-color="#ff9900"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      @keyframes fill-1 { 0% { stroke-dashoffset: 251.3; } 100% { stroke-dashoffset: 25.1; } }
      @keyframes fill-2 { 0% { stroke-dashoffset: 251.3; } 100% { stroke-dashoffset: 50.3; } }
      @keyframes fill-3 { 0% { stroke-dashoffset: 251.3; } 100% { stroke-dashoffset: 75.4; } }
      @keyframes fill-4 { 0% { stroke-dashoffset: 251.3; } 100% { stroke-dashoffset: 100.5; } }
      @keyframes fill-5 { 0% { stroke-dashoffset: 251.3; } 100% { stroke-dashoffset: 125.7; } }
      @keyframes fade { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
      @keyframes count-up {
        0% { stroke-dasharray: 0 100; }
        100% { stroke-dasharray: 90 100; }
      }
      .bar-fill { fill: none; stroke-width: 18; stroke-linecap: round; }
      .bar-bg { fill: none; stroke: #112; stroke-width: 18; stroke-linecap: round; }
      .gauge-1 { stroke: url(#g1); stroke-dasharray: 251.3; stroke-dashoffset: 251.3; animation: fill-1 2s ease-out 0.3s forwards; }
      .gauge-2 { stroke: url(#g2); stroke-dasharray: 251.3; stroke-dashoffset: 251.3; animation: fill-2 2s ease-out 0.5s forwards; }
      .gauge-3 { stroke: url(#g3); stroke-dasharray: 251.3; stroke-dashoffset: 251.3; animation: fill-3 2s ease-out 0.7s forwards; }
      .gauge-4 { stroke: url(#g4); stroke-dasharray: 251.3; stroke-dashoffset: 251.3; animation: fill-4 2s ease-out 0.9s forwards; }
      .gauge-5 { stroke: url(#g5); stroke-dasharray: 251.3; stroke-dashoffset: 251.3; animation: fill-5 2s ease-out 1.1s forwards; }
      .animate { animation: fade 3s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="960" height="420" fill="#050510" rx="8"/>
  <rect x="2" y="2" width="956" height="416" rx="8" fill="none" stroke="#00ff88" stroke-width="0.5" opacity="0.3"/>

  <text x="480" y="35" font-family="monospace" font-size="13" fill="#00ff88" text-anchor="middle" letter-spacing="4" opacity="0.7">⚡ SYSTEM CAPABILITIES</text>
  <line x1="40" y1="45" x2="920" y2="45" stroke="#00ff88" stroke-width="0.5" opacity="0.2"/>

  <!-- Linux gauge -->
  <g transform="translate(100, 270)">
    <circle class="bar-bg" cx="0" cy="0" r="40"/>
    <path class="bar-fill gauge-1" d="M0,-40 A40,40 0 1,1 0.01,-40 Z"/>
    <text x="0" y="5" font-family="monospace" font-size="18" fill="#00ff88" text-anchor="middle" font-weight="bold">90%</text>
    <text x="0" y="55" font-family="monospace" font-size="13" fill="#00ff88" text-anchor="middle">🐧 LINUX</text>
    <circle cx="0" cy="0" r="48" fill="none" stroke="#00ff88" stroke-width="0.3" opacity="0.2"/>
  </g>

  <!-- Networking -->
  <g transform="translate(300, 270)">
    <circle class="bar-bg" cx="0" cy="0" r="40"/>
    <path class="bar-fill gauge-2" d="M0,-40 A40,40 0 1,1 0.01,-40 Z"/>
    <text x="0" y="5" font-family="monospace" font-size="18" fill="#00ffff" text-anchor="middle" font-weight="bold">80%</text>
    <text x="0" y="55" font-family="monospace" font-size="13" fill="#00ffff" text-anchor="middle">🌐 NETWORK</text>
    <circle cx="0" cy="0" r="48" fill="none" stroke="#00ffff" stroke-width="0.3" opacity="0.2"/>
  </g>

  <!-- Security -->
  <g transform="translate(500, 270)">
    <circle class="bar-bg" cx="0" cy="0" r="40"/>
    <path class="bar-fill gauge-3" d="M0,-40 A40,40 0 1,1 0.01,-40 Z"/>
    <text x="0" y="5" font-family="monospace" font-size="18" fill="#ff6600" text-anchor="middle" font-weight="bold">70%</text>
    <text x="0" y="55" font-family="monospace" font-size="13" fill="#ff6600" text-anchor="middle">🔐 SECURITY</text>
    <circle cx="0" cy="0" r="48" fill="none" stroke="#ff6600" stroke-width="0.3" opacity="0.2"/>
  </g>

  <!-- AI -->
  <g transform="translate(700, 270)">
    <circle class="bar-bg" cx="0" cy="0" r="40"/>
    <path class="bar-fill gauge-4" d="M0,-40 A40,40 0 1,1 0.01,-40 Z"/>
    <text x="0" y="5" font-family="monospace" font-size="18" fill="#9d00ff" text-anchor="middle" font-weight="bold">60%</text>
    <text x="0" y="55" font-family="monospace" font-size="13" fill="#9d00ff" text-anchor="middle">🤖 AI</text>
    <circle cx="0" cy="0" r="48" fill="none" stroke="#9d00ff" stroke-width="0.3" opacity="0.2"/>
  </g>

  <!-- Cloud -->
  <g transform="translate(870, 270)">
    <circle class="bar-bg" cx="0" cy="0" r="40"/>
    <path class="bar-fill gauge-5" d="M0,-40 A40,40 0 1,1 0.01,-40 Z"/>
    <text x="0" y="5" font-family="monospace" font-size="18" fill="#ff9900" text-anchor="middle" font-weight="bold">50%</text>
    <text x="0" y="55" font-family="monospace" font-size="13" fill="#ff9900" text-anchor="middle">☁️ CLOUD</text>
    <circle cx="0" cy="0" r="48" fill="none" stroke="#ff9900" stroke-width="0.3" opacity="0.2"/>
  </g>

  <!-- Bottom stats bar -->
  <rect x="40" y="350" width="880" height="40" rx="4" fill="#080818" stroke="#00ff88" stroke-width="0.5" opacity="0.3"/>
  <text x="60" y="374" font-family="monospace" font-size="10" fill="#00ff88" opacity="0.6">SKILL VERIFICATION</text>
  <circle cx="270" cy="374" r="3" fill="#00ff88" class="animate"/>
  <text x="280" y="377" font-family="monospace" font-size="9" fill="#666">CORE :: <tspan fill="#00ff88">ESTABLISHED</tspan></text>
  <circle cx="470" cy="374" r="3" fill="#00ffff" class="animate"/>
  <text x="480" y="377" font-family="monospace" font-size="9" fill="#666">ADVANCED :: <tspan fill="#00ffff">IN PROGRESS</tspan></text>
  <circle cx="680" cy="374" r="3" fill="#9d00ff" class="animate"/>
  <text x="690" y="377" font-family="monospace" font-size="9" fill="#666">EXPLORING :: <tspan fill="#9d00ff">ACTIVE</tspan></text>

  <!-- Scan line -->
  <rect width="960" height="2" fill="#00ff88" opacity="0.05" class="animate"/>
</svg>