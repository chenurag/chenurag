    <line x1="0" y1="0" x2="1100" y2="0" stroke="#00ff88" stroke-width="2" class="rl"/>

    <!-- Node 1: Fundamentals --><g transform="translate(50, 0)">
      <circle cx="0" cy="0" r="4" fill="#00ff88" class="np" filter="url(#g)"/><circle cx="0" cy="0" r="4" fill="none" stroke="#00ff88" class="gr"/>
      <rect x="-30" y="12" width="130" height="30" rx="4" fill="#0a0a1e" stroke="#00ff88" stroke-width="0.6"/>
