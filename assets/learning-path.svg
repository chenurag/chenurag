<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="100%" height="auto">
  <defs><filter id="g"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      @keyframes revealLine{0%{stroke-dashoffset:2000}100%{stroke-dashoffset:0}}
      @keyframes nodePulse{0%,100%{r:4;opacity:0.7}50%{r:7;opacity:1}}
      @keyframes glowRing{0%{r:4;opacity:0.6}100%{r:18;opacity:0}}
      @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
      @keyframes breathe{0%,100%{opacity:0.4}50%{opacity:0.8}}
      @keyframes scan{0%{transform:translateX(-1200px)}100%{transform:translateX(1200px)}}
      @keyframes flick{0%,100%{opacity:0.96}2%{opacity:0.2}4%{opacity:0.96}}
      .rl{stroke-dasharray:2000;stroke-dashoffset:2000;animation:revealLine 2.5s ease-out 0.3s both}
      .rl2{stroke-dasharray:2000;stroke-dashoffset:2000;animation:revealLine 2.5s ease-out 0.6s both}
      .np{animation:nodePulse 2s ease-in-out infinite;transform-origin:0 0}
      .gr{animation:glowRing 2s ease-out infinite;transform-origin:0 0}
      .blk{animation:blink 0.8s step-end infinite}.br{animation:breathe 4s ease-in-out infinite}
      .sc{animation:scan 4s linear infinite}.fk{animation:flick 7s infinite}
    </style>
  </defs>
  <rect width="1200" height="200" fill="#02020c" rx="8"/>
  <rect x="1" y="1" width="1198" height="198" rx="8" fill="none" stroke="#00ff88" stroke-width="0.5" opacity="0.12"/>
  <rect class="sc" width="1200" height="1" fill="#00ff88" opacity="0.04"/>
  <rect class="fk" width="1200" height="200" fill="#000" opacity="0.01" pointer-events="none"/>
  <text x="600" y="22" font-family="monospace" font-size="10" fill="#00ff88" text-anchor="middle" letter-spacing="2" opacity="0.6">🗺️ LEARNING PATHWAY — SKILL ACQUISITION JOURNEY</text>

  <!-- Path spine -->
  <g transform="translate(50, 100)">
