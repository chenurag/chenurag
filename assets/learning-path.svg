  <!-- Current position indicator -->
  <g transform="translate(300, 130)">
    <rect x="-60" y="0" width="120" height="18" rx="4" fill="#0a1a0a" stroke="#00ff88" stroke-width="0.8" class="p1"/>
    <text x="0" y="13" font-family="monospace" font-size="8" fill="#00ff88" text-anchor="middle" class="blk">◀ YOU ARE HERE</text>
