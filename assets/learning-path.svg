      <circle cx="0" cy="0" r="4" fill="#00ffff" class="np" filter="url(#g)"/><circle cx="0" cy="0" r="4" fill="none" stroke="#00ffff" class="gr"/>
      <rect x="-30" y="12" width="130" height="30" rx="4" fill="#0a0a1e" stroke="#00ffff" stroke-width="0.6"/>
