<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 180" width="100%" role="img" aria-labelledby="title desc">
  <title id="title">Connection terminal</title>
  <desc id="desc">A terminal-style panel inviting collaboration and open source connections.</desc>
  <defs><linearGradient id="c" x1="0" x2="1"><stop stop-color="#ff3d81"/><stop offset=".5" stop-color="#9b5cff"/><stop offset="1" stop-color="#24d7ff"/></linearGradient><style>.b{animation:blink 1.1s steps(2) infinite}@keyframes blink{50%{opacity:0}}</style></defs>
  <rect width="1200" height="180" rx="12" fill="#090716"/><rect x="1" y="1" width="1198" height="178" rx="12" fill="none" stroke="#9b5cff" opacity=".35"/>
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace">
    <circle cx="28" cy="26" r="5" fill="#ff5f57"/><circle cx="46" cy="26" r="5" fill="#febc2e"/><circle cx="64" cy="26" r="5" fill="#28c840"/>
    <text x="95" y="30" fill="#786c93" font-size="12">shadowbeast@github:~</text>
    <text x="55" y="80" fill="#dbd2ee" font-size="17"><tspan fill="#24d7ff">$</tspan> echo "build securely. learn openly. ship boldly."</text>
    <text x="55" y="117" fill="#9b5cff" font-size="15">status:</text><text x="135" y="117" fill="#a9f7c5" font-size="15"> accepting thoughtful collaborations</text>
    <text x="55" y="148" fill="#ff73a5" font-size="15">connect:</text><text x="135" y="148" fill="#d9c8ff" font-size="15"> github.com/chenurag</text><rect class="b" x="355" y="133" width="9" height="18" rx="1" fill="url(#c)"/>
  </g>
</svg>
