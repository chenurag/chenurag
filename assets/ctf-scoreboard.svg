<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="100%" height="auto">
  <defs>
    <filter id="g"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      @keyframes scoreUp{0%{stroke-dashoffset:100}100%{stroke-dashoffset:var(--s)}}
      @keyframes pulse{0%,100%{opacity:0.5;filter:drop-shadow(0 0 4px)}50%{opacity:1;filter:drop-shadow(0 0 14px)}}
      @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
      @keyframes breathe{0%,100%{opacity:0.4}50%{opacity:0.8}}
      @keyframes scan{0%{transform:translateX(-1200px)}100%{transform:translateX(1200px)}}
      @keyframes flick{0%,100%{opacity:0.96}2%{opacity:0.2}4%{opacity:0.96}}
      @keyframes rise{0%{height:0}100%{height:var(--h)}}
      
      .p1{animation:pulse 2s ease-in-out infinite}
      .blk{animation:blink 0.8s step-end infinite}
      .br{animation:breathe 4s ease-in-out infinite}
      .sc{animation:scan 4s linear infinite}
      .fk{animation:flick 7s infinite}
      .s1{--s:15;stroke-dasharray:100;stroke-dashoffset:100;animation:scoreUp 2s ease-out 0.3s forwards}
      .s2{--s:35;stroke-dasharray:100;stroke-dashoffset:100;animation:scoreUp 2s ease-out 0.5s forwards}
      .s3{--s:55;stroke-dasharray:100;stroke-dashoffset:100;animation:scoreUp 2s ease-out 0.7s forwards}
      .s4{--s:70;stroke-dasharray:100;stroke-dashoffset:100;animation:scoreUp 2s ease-out 0.9s forwards}
      .s5{--s:85;stroke-dasharray:100;stroke-dashoffset:100;animation:scoreUp 2s ease-out 1.1s forwards}
      .r1{--h:20px;animation:rise 1.5s ease-out 0.3s both}
      .r2{--h:35px;animation:rise 1.5s ease-out 0.5s both}
      .r3{--h:50px;animation:rise 1.5s ease-out 0.7s both}
      .r4{--h:65px;animation:rise 1.5s ease-out 0.9s both}
      .r5{--h:80px;animation:rise 1.5s ease-out 1.1s both}
    </style>
  </defs>

  <rect width="1200" height="240" fill="#02020c" rx="8"/>
  <rect x="1" y="1" width="1198" height="238" rx="8" fill="none" stroke="#00ff88" stroke-width="0.5" opacity="0.12"/>
  <rect class="sc" width="1200" height="1" fill="#00ff88" opacity="0.04"/>
  <rect class="fk" width="1200" height="240" fill="#000" opacity="0.01" pointer-events="none"/>

  <text x="600" y="22" font-family="monospace" font-size="10" fill="#00ff88" text-anchor="middle" letter-spacing="2" opacity="0.6">🏆 CTF SCOREBOARD — COMPETITIVE RANKINGS</text>

  <!-- Score rings -->
  <g transform="translate(30, 50)">
    <!-- TryHackMe -->
    <g transform="translate(110, 60)">
      <circle cx="0" cy="0" r="42" fill="none" stroke="#112" stroke-width="10"/>
      <circle cx="0" cy="0" r="42" fill="none" stroke="#ff003c" stroke-width="10" class="s1" stroke-linecap="round" transform="rotate(-90)"/>
      <text x="0" y="6" font-family="monospace" font-size="16" fill="#ff6666" text-anchor="middle" font-weight="bold">15%</text>
      <text x="0" y="60" font-family="monospace" font-size="9" fill="#ff6666" text-anchor="middle" font-weight="bold">TRYHACKME</text>
      <circle cx="40" cy="-40" r="3" fill="#ff003c" class="p1" filter="url(#g)"/>
    </g>
    <!-- HackTheBox -->
    <g transform="translate(300, 60)">
      <circle cx="0" cy="0" r="42" fill="none" stroke="#112" stroke-width="10"/>
      <circle cx="0" cy="0" r="42" fill="none" stroke="#00ff88" stroke-width="10" class="s2" stroke-linecap="round" transform="rotate(-90)"/>
      <text x="0" y="6" font-family="monospace" font-size="16" fill="#00ff88" text-anchor="middle" font-weight="bold">35%</text>
      <text x="0" y="60" font-family="monospace" font-size="9" fill="#00ff88" text-anchor="middle" font-weight="bold">HACKTHEBOX</text>
      <circle cx="40" cy="-40" r="3" fill="#00ff88" class="p1" filter="url(#g)"/>
    </g>
    <!-- VulnHub -->
    <g transform="translate(490, 60)">
      <circle cx="0" cy="0" r="42" fill="none" stroke="#112" stroke-width="10"/>
      <circle cx="0" cy="0" r="42" fill="none" stroke="#00ffff" stroke-width="10" class="s3" stroke-linecap="round" transform="rotate(-90)"/>
      <text x="0" y="6" font-family="monospace" font-size="16" fill="#00ffff" text-anchor="middle" font-weight="bold">55%</text>
      <text x="0" y="60" font-family="monospace" font-size="9" fill="#00ffff" text-anchor="middle" font-weight="bold">VULNHUB</text>
      <circle cx="40" cy="-40" r="3" fill="#00ffff" class="p1" filter="url(#g)"/>
    </g>
    <!-- PicoCTF -->
    <g transform="translate(680, 60)">
      <circle cx="0" cy="0" r="42" fill="none" stroke="#112" stroke-width="10"/>
      <circle cx="0" cy="0" r="42" fill="none" stroke="#9d00ff" stroke-width="10" class="s4" stroke-linecap="round" transform="rotate(-90)"/>
      <text x="0" y="6" font-family="monospace" font-size="16" fill="#9d00ff" text-anchor="middle" font-weight="bold">70%</text>
      <text x="0" y="60" font-family="monospace" font-size="9" fill="#9d00ff" text-anchor="middle" font-weight="bold">PICOCTF</text>
      <circle cx="40" cy="-40" r="3" fill="#9d00ff" class="p1" filter="url(#g)"/>
    </g>
    <!-- OverTheWire -->
    <g transform="translate(870, 60)">
      <circle cx="0" cy="0" r="42" fill="none" stroke="#112" stroke-width="10"/>
      <circle cx="0" cy="0" r="42" fill="none" stroke="#ff6600" stroke-width="10" class="s5" stroke-linecap="round" transform="rotate(-90)"/>
      <text x="0" y="6" font-family="monospace" font-size="16" fill="#ff6600" text-anchor="middle" font-weight="bold">85%</text>
      <text x="0" y="60" font-family="monospace" font-size="9" fill="#ff6600" text-anchor="middle" font-weight="bold">OVERWIRE</text>
      <circle cx="40" cy="-40" r="3" fill="#ff6600" class="p1" filter="url(#g)"/>
    </g>
    <!-- Bandit -->
    <g transform="translate(1060, 60)">
      <circle cx="0" cy="0" r="42" fill="none" stroke="#112" stroke-width="10"/>
      <circle cx="0" cy="0" r="42" fill="none" stroke="#ffd700" stroke-width="10" class="s4" stroke-linecap="round" transform="rotate(-90)"/>
      <text x="0" y="6" font-family="monospace" font-size="16" fill="#ffd700" text-anchor="middle" font-weight="bold">70%</text>
      <text x="0" y="60" font-family="monospace" font-size="9" fill="#ffd700" text-anchor="middle" font-weight="bold">BANDIT</text>
      <circle cx="40" cy="-40" r="3" fill="#ffd700" class="p1" filter="url(#g)"/>
    </g>
  </g>

  <!-- Weekly challenges bar chart -->
  <g transform="translate(30, 160)">
    <text x="0" y="0" font-family="monospace" font-size="9" fill="#888">CHALLENGES COMPLETED / WEEK</text>
    <rect x="0" y="12" width="70" height="20" rx="3" fill="#0a0a1e"/>
    <rect x="0" y="32" width="70" height="0" rx="3" fill="#ff003c" class="r1"/>
    <rect x="80" y="12" width="70" height="35" rx="3" fill="#0a0a1e"/>
    <rect x="80" y="32" width="70" height="0" rx="3" fill="#ff6600" class="r2"/>
    <rect x="160" y="12" width="70" height="50" rx="3" fill="#0a0a1e"/>
    <rect x="160" y="32" width="70" height="0" rx="3" fill="#ffd700" class="r3"/>
    <rect x="240" y="12" width="70" height="65" rx="3" fill="#0a0a1e"/>
    <rect x="240" y="32" width="70" height="0" rx="3" fill="#00ff88" class="r4"/>
    <rect x="320" y="12" width="70" height="80" rx="3" fill="#0a0a1e"/>
    <rect x="320" y="32" width="70" height="0" rx="3" fill="#00ffff" class="r5"/>
    
    <text x="30" y="52" font-family="monospace" font-size="8" fill="#555">W1</text>
    <text x="110" y="52" font-family="monospace" font-size="8" fill="#555">W2</text>
    <text x="190" y="52" font-family="monospace" font-size="8" fill="#555">W3</text>
    <text x="270" y="52" font-family="monospace" font-size="8" fill="#555">W4</text>
    <text x="350" y="52" font-family="monospace" font-size="8" fill="#555">W5</text>
  </g>

  <!-- Right stats -->
  <g transform="translate(500, 155)">
    <rect x="0" y="0" width="330" height="65" rx="6" fill="#040416" stroke="#00ff88" stroke-width="0.5"/>
    <text x="15" y="22" font-family="monospace" font-size="10" fill="#888">TOTAL CHALLENGES</text>
    <text x="15" y="48" font-family="monospace" font-size="24" fill="#00ff88" font-weight="bold" class="p1">
      <tspan><animate attributeName="values" values="0;50;100;150;200;250;312" dur="4s" fill="freeze"/>312</tspan>
    </text>
    <circle cx="310" cy="18" r="4" fill="#00ff88" class="blk"/>
  </g>

  <g transform="translate(850, 155)">
    <rect x="0" y="0" width="310" height="65" rx="6" fill="#040416" stroke="#00ffff" stroke-width="0.5"/>
    <text x="15" y="22" font-family="monospace" font-size="10" fill="#888">CURRENT RANK</text>
    <text x="15" y="48" font-family="monospace" font-size="24" fill="#00ffff" font-weight="bold" class="br">TOP 5%</text>
    <circle cx="290" cy="18" r="4" fill="#00ffff" class="blk"/>
  </g>
</svg>