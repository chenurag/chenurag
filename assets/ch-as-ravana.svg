<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="100%" role="img" aria-labelledby="title desc">
  <title id="title">CH as Ravana</title>
  <desc id="desc">A stylized back-view character wearing a shirt marked ch as ravana.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#0b1026"/><stop offset=".55" stop-color="#241343"/><stop offset="1" stop-color="#092f46"/></linearGradient>
    <linearGradient id="shirt" x1="0" x2="1"><stop stop-color="#a51d4b"/><stop offset=".52" stop-color="#ed5b52"/><stop offset="1" stop-color="#792557"/></linearGradient>
    <linearGradient id="gold" x1="0" x2="1"><stop stop-color="#ffd66d"/><stop offset="1" stop-color="#ff8f5a"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .float{animation:f 4s ease-in-out infinite}.spark{animation:s 2.8s ease-in-out infinite}
      @keyframes f{50%{transform:translateY(-5px)}}@keyframes s{50%{opacity:.35}}
    </style>
  </defs>
  <rect width="1200" height="330" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="328" rx="16" fill="none" stroke="#ffb85c" opacity=".3"/>
