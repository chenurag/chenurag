    <text x="600" y="248" fill="#fff0b0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="26" font-weight="800" letter-spacing="3" text-anchor="middle">RAVANA</text>
    <path d="M552 268Q600 280 648 268" fill="none" stroke="#ffcf72" stroke-width="2" opacity=".8"/>
  </g>
  <g class="spark" fill="#ffd66d">
    <circle cx="334" cy="100" r="3"/><circle cx="868" cy="86" r="3"/><circle cx="270" cy="242" r="2"/><circle cx="930" cy="230" r="2"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace">
