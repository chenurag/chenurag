      <circle cx="600" cy="58" r="31"/><circle cx="543" cy="66" r="20"/><circle cx="657" cy="66" r="20"/>
      <circle cx="494" cy="86" r="14"/><circle cx="706" cy="86" r="14"/>
    </g>
    <path d="M548 86Q600 115 652 86L670 132Q600 161 530 132Z" fill="#16162b"/>
    <path d="M535 128Q600 111 665 128L699 278Q600 316 501 278Z" fill="url(#shirt)" stroke="#ff9c68" stroke-width="2"/>
    <path d="M535 128L484 159 457 237 495 250 526 194M665 128L716 159 743 237 705 250 674 194" fill="#b93250" stroke="#ff9c68" stroke-width="2"/>
    <path d="M530 130Q600 158 670 130" fill="none" stroke="#7d1d48" stroke-width="8"/>
    <path d="M600 156V285" stroke="#ffb565" stroke-width="1" opacity=".3"/>
