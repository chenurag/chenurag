<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 230" width="100%" role="img" aria-labelledby="title desc">
  <title id="title">Learning radar</title>
  <desc id="desc">A radar-style learning map for cybersecurity, AI, Linux and research.</desc>
  <defs><linearGradient id="r" x1="0" x2="1"><stop stop-color="#00ff88"/><stop offset="1" stop-color="#00cfff"/></linearGradient><style>.s{animation:spin 8s linear infinite;transform-origin:160px 115px}@keyframes spin{to{transform:rotate(360deg)}}</style></defs>
  <rect width="1200" height="230" rx="12" fill="#050914"/><rect x="1" y="1" width="1198" height="228" rx="12" fill="none" stroke="#00ff88" opacity=".25"/>
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace">
    <g transform="translate(160 115)" fill="none" stroke="#14543e">
      <circle r="90"/><circle r="62"/><circle r="34"/><path d="M-90 0h180M0-90v180"/>
      <path class="s" d="M0 0L80-40A90 90 0 0 1 45 70Z" fill="#00ff88" opacity=".15" stroke="#00ff88"/>
    </g>
    <circle cx="160" cy="115" r="4" fill="#00ff88"/>
    <text x="160" y="24" fill="#00ff88" font-size="13" text-anchor="middle" letter-spacing="3">LEARNING RADAR</text>
    <g transform="translate(340 45)">
      <g fill="#9de8c5"><text y="18" font-size="13">01 / CYBERSECURITY</text><text y="65" font-size="13">02 / ARTIFICIAL INTELLIGENCE</text><text y="112" font-size="13">03 / LINUX &amp; AUTOMATION</text><text y="159" font-size="13">04 / RESEARCH &amp; BUILD</text></g>
      <g fill="#557a72" font-size="11"><text x="270" y="18">ACTIVE</text><text x="270" y="65">EXPLORING</text><text x="270" y="112">DEEPENING</text><text x="270" y="159">ALWAYS ON</text></g>
      <g stroke="url(#r)" stroke-width="3" stroke-linecap="round"><path d="M390 14h210"/><path d="M390 61h150"/><path d="M390 108h180"/><path d="M390 155h225"/></g>
    </g>
  </g>
</svg>
