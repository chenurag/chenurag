<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 160" width="100%" height="auto">
  <defs>
    <filter id="g"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="prog" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#00ff88"/><stop offset="50%" stop-color="#00ffff"/><stop offset="100%" stop-color="#00ff88"/></linearGradient>
    <style><![CDATA[

      @keyframes p1{0%,100%{opacity:0.5;filter:drop-shadow(0 0 4px #00ff88)}50%{opacity:1;filter:drop-shadow(0 0 15px #00ff88)}}
      @keyframes p2{0%,100%{opacity:0.3}50%{opacity:0.9}}
      @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
      @keyframes breathe{0%,100%{opacity:0.4}50%{opacity:0.8}}
      @keyframes flick{0%,100%{opacity:0.96}2%{opacity:0.2}4%{opacity:0.96}8%{opacity:0.5}10%{opacity:0.96}}
      @keyframes fillBar{0%{width:0}100%{width:87%}}
      @keyframes scan{0%{transform:translateX(-1200px)}100%{transform:translateX(1200px)}}
      @keyframes glowMove{0%,100%{stop-color:#00ff88}50%{stop-color:#00ffff}}
      
      .p1{animation:p1 2s ease-in-out infinite}
      .p2{animation:p2 3s ease-in-out infinite}
      .blk{animation:blink 0.8s step-end infinite}
      .br{animation:breathe 4s ease-in-out infinite}
      .sc{animation:scan 5s linear infinite}
      .fk{animation:flick 7s infinite}
      .fb{animation:fillBar 2s ease-out 0.5s both}
    
]]></style>
  </defs>

  <rect width="1200" height="160" fill="#03030e" rx="8"/>
  <rect x="1" y="1" width="1198" height="158" rx="8" fill="none" stroke="#00ff88" stroke-width="0.5" opacity="0.1"/>
  <rect class="sc" width="1200" height="1" fill="#00ff88" opacity="0.03"/>
  <rect class="fk" width="1200" height="160" fill="#000" opacity="0.01" pointer-events="none"/>

  <text x="600" y="24" font-family="monospace" font-size="10" fill="#00ff88" text-anchor="middle" letter-spacing="2" opacity="0.6">👽 LEVEL SYSTEM — PROGRESS TRACKER</text>

  <!-- Level badges row -->
  <g transform="translate(30, 45)">
    <rect x="0" y="0" width="210" height="28" rx="4" fill="#0a0a1e" stroke="#00ff88" stroke-width="0.6"/>
    <text x="105" y="18" font-family="monospace" font-size="9" fill="#00ff88" text-anchor="middle" font-weight="bold">L01 · NEW ARRIVAL</text>

    <rect x="225" y="0" width="230" height="28" rx="4" fill="#0a0a1e" stroke="#00ffff" stroke-width="0.6"/>
    <text x="340" y="18" font-family="monospace" font-size="9" fill="#00ffff" text-anchor="middle" font-weight="bold">L40 · SECURITY RESEARCHER</text>

    <rect x="470" y="0" width="230" height="28" rx="4" fill="#0a0a1e" stroke="#ff003c" stroke-width="0.6"/>
    <text x="585" y="18" font-family="monospace" font-size="9" fill="#ff6666" text-anchor="middle" font-weight="bold">L60 · CYBER OPERATIVE</text>

    <rect x="715" y="0" width="240" height="28" rx="4" fill="#0a0a1e" stroke="#9d00ff" stroke-width="0.6"/>
    <text x="835" y="18" font-family="monospace" font-size="9" fill="#9d00ff" text-anchor="middle" font-weight="bold">L80 · CYBER ARCHITECT</text>

    <rect x="970" y="0" width="200" height="28" rx="4" fill="#0a1a0a" stroke="#00ff88" stroke-width="1"/>
    <text x="1070" y="18" font-family="monospace" font-size="9" fill="#00ff88" text-anchor="middle" font-weight="bold" class="p1">L100 · ALIEN OVERLORD</text>
  </g>

  <!-- Progress bar -->
  <g transform="translate(30, 88)">
    <text x="0" y="14" font-family="monospace" font-size="11" fill="#00ff88" font-weight="bold" class="p1">▣ CURRENT: LEVEL 87</text>
    
    <!-- Bar background -->
    <rect x="0" y="24" width="1140" height="18" rx="4" fill="#0a0a1e" stroke="#00ff88" stroke-width="0.5" opacity="0.4"/>
    
    <!-- Animated fill -->
    <rect x="0" y="24" width="0" height="18" rx="4" fill="url(#prog)" opacity="0.7" class="fb">
      <animate attributeName="width" values="0;992" dur="2s" fill="freeze"/>
    </rect>
    
    <!-- Percentage text -->
    <text x="1160" y="38" font-family="monospace" font-size="11" fill="#00ff88" text-anchor="end" class="p1">87%</text>
  </g>

  <!-- Bottom info row -->
  <g transform="translate(30, 125)">
    <text x="0" y="14" font-family="monospace" font-size="9" fill="#666">NEXT: CYBER ARCHITECT (Lv 80) → <tspan fill="#00ff88" class="p1">ALIEN OVERLORD (Lv 100)</tspan></text>
    <text x="750" y="14" font-family="monospace" font-size="8" fill="#555">XP TO NEXT: <tspan fill="#00ffff" class="br">~13%</tspan></text>
    <text x="960" y="14" font-family="monospace" font-size="8" fill="#555" class="blk">▊</text>
  </g>
</svg>