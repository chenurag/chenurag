<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="100%" height="auto">
  <defs><filter id="g"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style><![CDATA[

      @keyframes fillBar{0%{width:0}100%{width:var(--w)}}
      @keyframes pulse{0%,100%{opacity:0.5;filter:drop-shadow(0 0 4px)}50%{opacity:1;filter:drop-shadow(0 0 14px)}}
      @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
      @keyframes breathe{0%,100%{opacity:0.4}50%{opacity:0.8}}
      @keyframes scan{0%{transform:translateX(-1200px)}100%{transform:translateX(1200px)}}
      @keyframes flick{0%,100%{opacity:0.96}2%{opacity:0.2}4%{opacity:0.96}}
      .fb1{--w:240px;animation:fillBar 2s ease-out 0.2s both}.fb2{--w:200px;animation:fillBar 2s ease-out 0.4s both}
      .fb3{--w:280px;animation:fillBar 2s ease-out 0.6s both}.fb4{--w:160px;animation:fillBar 2s ease-out 0.8s both}
      .fb5{--w:310px;animation:fillBar 2s ease-out 1.0s both}.fb6{--w:180px;animation:fillBar 2s ease-out 1.2s both}
      .p1{animation:pulse 2s ease-in-out infinite}.blk{animation:blink 0.8s step-end infinite}
      .br{animation:breathe 4s ease-in-out infinite}.sc{animation:scan 4s linear infinite}.fk{animation:flick 7s infinite}
    
]]></style>
  </defs>
  <rect width="1200" height="220" fill="#02020c" rx="8"/>
  <rect x="1" y="1" width="1198" height="218" rx="8" fill="none" stroke="#00ff88" stroke-width="0.5" opacity="0.12"/>
  <rect class="sc" width="1200" height="1" fill="#00ff88" opacity="0.04"/>
  <rect class="fk" width="1200" height="220" fill="#000" opacity="0.01" pointer-events="none"/>
  <text x="600" y="22" font-family="monospace" font-size="10" fill="#00ff88" text-anchor="middle" letter-spacing="2" opacity="0.6">💾 SYSTEM RESOURCE MONITOR — REAL-TIME USAGE</text>

  <!-- Disk gauge --><g transform="translate(50, 50)">
    <path d="M0,20 L320,20" stroke="#00ff88" stroke-width="0.3" opacity="0.15"/>
    <rect x="0" y="0" width="320" height="30" rx="6" fill="#040416" stroke="#00ff88" stroke-width="0.5"/>
    <text x="15" y="19" font-family="monospace" font-size="10" fill="#888">💾 DISK</text>
    <rect x="80" y="9" width="160" height="14" rx="4" fill="#0a0a1e" stroke="#00ff88" stroke-width="0.3"/>
    <rect x="80" y="9" width="0" height="14" rx="4" fill="#00ff88" opacity="0.7" class="fb1"/>
    <text x="255" y="19" font-family="monospace" font-size="10" fill="#00ff88" class="p1">240GB</text>
    <circle cx="305" cy="15" r="3" fill="#00ff88" class="blk"/>
  </g>
  <g transform="translate(50, 90)">
    <rect x="0" y="0" width="320" height="30" rx="6" fill="#040416" stroke="#00ffff" stroke-width="0.5"/>
    <text x="15" y="19" font-family="monospace" font-size="10" fill="#888">📡 NETWORK</text>
    <rect x="80" y="9" width="160" height="14" rx="4" fill="#0a0a1e" stroke="#00ffff" stroke-width="0.3"/>
    <rect x="80" y="9" width="0" height="14" rx="4" fill="#00ffff" opacity="0.7" class="fb2"/>
    <text x="255" y="19" font-family="monospace" font-size="10" fill="#00ffff" class="br">200Mbps</text>
    <circle cx="305" cy="15" r="3" fill="#00ffff" class="blk"/>
  </g>
  <g transform="translate(50, 130)">
    <rect x="0" y="0" width="320" height="30" rx="6" fill="#040416" stroke="#ff6600" stroke-width="0.5"/>
    <text x="15" y="19" font-family="monospace" font-size="10" fill="#888">⚙️ PROCESSES</text>
    <rect x="80" y="9" width="160" height="14" rx="4" fill="#0a0a1e" stroke="#ff6600" stroke-width="0.3"/>
    <rect x="80" y="9" width="0" height="14" rx="4" fill="#ff6600" opacity="0.7" class="fb3"/>
    <text x="255" y="19" font-family="monospace" font-size="10" fill="#ff6600" class="br">342</text>
    <circle cx="305" cy="15" r="3" fill="#ff6600" class="blk"/>
  </g>
  <g transform="translate(50, 170)">
    <rect x="0" y="0" width="320" height="30" rx="6" fill="#040416" stroke="#9d00ff" stroke-width="0.5"/>
    <text x="15" y="19" font-family="monospace" font-size="10" fill="#888">🔋 BANDWIDTH</text>
    <rect x="80" y="9" width="160" height="14" rx="4" fill="#0a0a1e" stroke="#9d00ff" stroke-width="0.3"/>
    <rect x="80" y="9" width="0" height="14" rx="4" fill="#9d00ff" opacity="0.7" class="fb4"/>
    <text x="255" y="19" font-family="monospace" font-size="10" fill="#9d00ff" class="br">1.2Gbps</text>
    <circle cx="305" cy="15" r="3" fill="#9d00ff" class="blk"/>
  </g>

  <!-- Right side: resource cards -->
  <g transform="translate(430, 50)">
    <rect x="0" y="0" width="340" height="60" rx="6" fill="#040416" stroke="#00ff88" stroke-width="0.5"/>
    <text x="15" y="22" font-family="monospace" font-size="10" fill="#888">CPU LOAD</text>
    <text x="15" y="46" font-family="monospace" font-size="20" fill="#00ff88" font-weight="bold" class="p1">
      <tspan><animate attributeName="values" values="0;12;24;38;45;38" dur="3s" fill="freeze"/>38</tspan>%
    </text>
    <rect x="130" y="20" width="180" height="8" rx="4" fill="#0a0a1e" stroke="#00ff88" stroke-width="0.3"/>
    <rect x="130" y="20" width="72" height="8" rx="4" fill="url(#g)" opacity="0.7"><animate attributeName="width" values="0;72" dur="2s" fill="freeze"/></rect>
    <text x="130" y="46" font-family="monospace" font-size="9" fill="#555">CORES: 8 · THREADS: 16</text>
    <circle cx="325" cy="15" r="3" fill="#00ff88" class="blk"/>
  </g>
  <g transform="translate(430, 125)">
    <rect x="0" y="0" width="340" height="60" rx="6" fill="#040416" stroke="#00ffff" stroke-width="0.5"/>
    <text x="15" y="22" font-family="monospace" font-size="10" fill="#888">MEMORY USAGE</text>
    <text x="15" y="46" font-family="monospace" font-size="20" fill="#00ffff" font-weight="bold" class="br">
      <tspan><animate attributeName="values" values="0;2;4;6;8;6" dur="3s" fill="freeze"/>6.2</tspan>GB
    </text>
    <rect x="130" y="20" width="180" height="8" rx="4" fill="#0a0a1e" stroke="#00ffff" stroke-width="0.3"/>
    <rect x="130" y="20" width="135" height="8" rx="4" fill="#00ffff" opacity="0.6"><animate attributeName="width" values="0;135" dur="2s" fill="freeze"/></rect>
    <text x="130" y="46" font-family="monospace" font-size="9" fill="#555">TOTAL: 16GB DDR4</text>
    <circle cx="325" cy="15" r="3" fill="#00ffff" class="blk"/>
  </g>

  <!-- Right bar: uptime details -->
  <g transform="translate(830, 50)">
    <rect x="0" y="0" width="340" height="135" rx="6" fill="#040416" stroke="#00ff88" stroke-width="0.5"/>
    <text x="15" y="22" font-family="monospace" font-size="10" fill="#00ff88" font-weight="bold">SYSTEM HEALTH</text>
    <line x1="15" y1="30" x2="325" y2="30" stroke="#00ff88" stroke-width="0.3" opacity="0.1"/>
    <circle cx="20" cy="48" r="4" fill="#00ff88" class="p1" filter="url(#g)"/>
    <text x="32" y="52" font-family="monospace" font-size="9" fill="#888">CPU TEMP: <tspan fill="#00ff88">62°C</tspan></text>
    <circle cx="20" cy="68" r="4" fill="#00ffff" class="blk"/>
    <text x="32" y="72" font-family="monospace" font-size="9" fill="#888">FAN SPEED: <tspan fill="#00ffff">2400 RPM</tspan></text>
    <circle cx="20" cy="88" r="4" fill="#00ff88" class="blk"/>
    <text x="32" y="92" font-family="monospace" font-size="9" fill="#888">UPTIME: <tspan fill="#00ff88">47d 13h</tspan></text>
    <circle cx="20" cy="108" r="4" fill="#ff6600" class="p1"/>
    <text x="32" y="112" font-family="monospace" font-size="9" fill="#888">POWER: <tspan fill="#ff6600">45W · ECONOMY</tspan></text>
    <circle cx="325" cy="15" r="3" fill="#00ff88" class="blk"/>
  </g>
</svg>