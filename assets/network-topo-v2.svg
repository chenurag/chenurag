<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="auto">
  <defs><filter id="g"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#00ff88"/></marker>
    <style><![CDATA[
      @keyframes p1{0%,100%{opacity:0.5;filter:drop-shadow(0 0 4px #00ff88)}50%{opacity:1;filter:drop-shadow(0 0 14px #00ff88)}}
      @keyframes p2{0%,100%{opacity:0.3}50%{opacity:0.9}}@keyframes p3{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
      @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}@keyframes blink2{0%,100%{opacity:1}50%{opacity:0}}
      @keyframes breathe{0%,100%{opacity:0.4}50%{opacity:0.8}}@keyframes scan{0%{transform:translateX(-1200px)}100%{transform:translateX(1200px)}}
      @keyframes flick{0%,100%{opacity:0.97}2%{opacity:0.3}4%{opacity:0.97}}
      @keyframes flow1{0%{stroke-dashoffset:200}100%{stroke-dashoffset:0}}
      @keyframes flow2{0%{stroke-dashoffset:0}100%{stroke-dashoffset:200}}
      @keyframes blipMove{0%{transform:translateX(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateX(300px);opacity:0}}
      @keyframes blipY{0%{transform:translateY(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(120px);opacity:0}}
      .p1{animation:p1 2s ease-in-out infinite}.p2{animation:p2 3s ease-in-out infinite}
      .p3{animation:p3 2.5s ease-in-out infinite}.blk{animation:blink 0.8s step-end infinite}
      .blk2{animation:blink2 0.7s step-end 0.3s infinite}.br{animation:breathe 4s ease-in-out infinite}
      .sc{animation:scan 5s linear infinite}.fk{animation:flick 8s infinite}
      .df1{stroke-dasharray:60 100;animation:flow1 2s linear infinite;marker-end:url(#arrow)}
      .df2{stroke-dasharray:80 120;animation:flow2 3s linear infinite}
      .df3{stroke-dasharray:40 160;animation:flow1 4s linear infinite}
      .b1{animation:blipMove 2s linear infinite}.b2{animation:blipMove 3s linear infinite}
      .by{animation:blipY 1.8s linear infinite}
    ]]></style>
  </defs>
  <rect width="1200" height="700" fill="#03030e" rx="8"/>
  <rect x="1" y="1" width="1198" height="698" rx="8" fill="none" stroke="#00ff88" stroke-width="0.5" opacity="0.1"/>
  <rect class="sc" width="1200" height="1" fill="#00ff88" opacity="0.04"/>
  <rect class="fk" width="1200" height="700" fill="#000" opacity="0.01" pointer-events="none"/>
  <text x="600" y="28" font-family="monospace" font-size="16" fill="#00ff88" text-anchor="middle" letter-spacing="2" opacity="0.7">⚡ SHADOW LAB — NETWORK TOPOLOGY (EXPANDED VIEW)</text>

  <!-- INTERNET CLOUD -->
  <g transform="translate(600, 85)">
    <path d="M-55,25 Q-80,0 -55,-25 L55,-25 Q80,0 55,25 Z" fill="#0a0a1e" stroke="#00ffff" stroke-width="1.5"/>
    <text x="0" y="5" font-family="monospace" font-size="15" fill="#00ffff" text-anchor="middle" class="p1">☁️ INTERNET</text>
    <text x="0" y="48" font-family="monospace" font-size="13" fill="#666" text-anchor="middle">UNTRUSTED ZONE</text>
  </g>
  <line x1="600" y1="112" x2="600" y2="160" stroke="#00ff88" stroke-width="1.5" class="df1"/>
  <circle cx="600" fill="#00ffff" r="3" class="b1"><animate attributeName="cy" values="112;160" dur="1.5s" repeatCount="indefinite"/></circle>

  <!-- FIREWALL -->
  <g transform="translate(600, 180)">
    <rect x="-75" y="-30" width="150" height="60" rx="8" fill="#1a0000" stroke="#ff003c" stroke-width="2" class="p3"/>
    <rect x="-75" y="-30" width="150" height="60" rx="8" fill="none" stroke="#ff003c" stroke-width="3" class="p1"/>
    <text x="0" y="-8" font-family="monospace" font-size="15" fill="#ff003c" text-anchor="middle" font-weight="bold">🔥 FIREWALL</text>
    <text x="0" y="12" font-family="monospace" font-size="14" fill="#ff6666" text-anchor="middle">RULES: 47</text>
    <text x="0" y="26" font-family="monospace" font-size="13" fill="#ff003c" text-anchor="middle" opacity="0.6">DROP ALL  ALLOW ESTABLISHED</text>
  </g>
  <line x1="600" y1="210" x2="600" y2="260" stroke="#00ff88" stroke-width="1.5" class="df2"/>
  <circle cx="600" fill="#ff003c" r="3" class="blk"><animate attributeName="cy" values="210;260" dur="1.8s" repeatCount="indefinite"/></circle>

  <!-- ROUTER -->
  <g transform="translate(600, 280)">
    <rect x="-80" y="-30" width="160" height="60" rx="8" fill="#0a0a1e" stroke="#00ffff" stroke-width="1.5"/>
    <ellipse cx="-20" cy="0" rx="14" ry="14" fill="none" stroke="#00ffff" stroke-width="1" class="p2"/>
    <circle cx="-20" cy="0" r="3" fill="#00ffff" class="blk2"/>
    <text x="18" y="-8" font-family="monospace" font-size="15" fill="#00ffff" text-anchor="middle">🔀 ROUTER</text>
    <text x="18" y="12" font-family="monospace" font-size="14" fill="#00ffff" text-anchor="middle">192.168.1.1</text>
    <text x="18" y="26" font-family="monospace" font-size="13" fill="#666" text-anchor="middle">OSPF · NAT · DHCP</text>
  </g>
  <line x1="600" y1="310" x2="600" y2="360" stroke="#00ff88" stroke-width="1.5" class="df1"/>
  <circle cx="600" fill="#00ffff" r="3" class="blk"><animate attributeName="cy" values="310;360" dur="1.5s" repeatCount="indefinite"/></circle>

  <!-- SWITCH -->
  <g transform="translate(600, 380)">
    <rect x="-85" y="-28" width="170" height="56" rx="8" fill="#0a0a1e" stroke="#00ff88" stroke-width="1.5"/>
    <g>
      <circle cx="-60" cy="0" r="4" fill="#00ff88" class="p1"/>
      <circle cx="-40" cy="0" r="4" fill="#00ff88" class="p2"/>
      <circle cx="-20" cy="0" r="4" fill="#00ff88" class="blk"/>
      <circle cx="0" cy="0" r="4" fill="#00ff88" class="p2"/>
      <circle cx="20" cy="0" r="4" fill="#00ff88" class="blk2"/>
      <circle cx="40" cy="0" r="4" fill="#00ff88" class="p1"/>
      <circle cx="60" cy="0" r="4" fill="#00ff88" class="p2"/>
    </g>
    <text x="0" y="-36" font-family="monospace" font-size="15" fill="#00ff88" text-anchor="middle">⬡ SWITCH</text>
  </g>

  <!-- Switch to 3 branches -->
  <line x1="600" y1="408" x2="600" y2="465" stroke="#00ff88" stroke-width="1.2" class="df1"/>
  <line x1="600" y1="408" x2="220" y2="465" stroke="#00ff88" stroke-width="1" class="df3"/>
  <line x1="600" y1="408" x2="980" y2="465" stroke="#00ff88" stroke-width="1" class="df2"/>
  <circle cx="600" fill="#00ff88" r="3" class="blk"><animate attributeName="cy" values="408;465" dur="2s" repeatCount="indefinite"/></circle>
  <circle cx="0" fill="#00ffff" r="3" class="blk2"><animate attributeName="cx" values="600;220" dur="3s" repeatCount="indefinite"/><animate attributeName="cy" values="415;465" dur="3s" repeatCount="indefinite"/></circle>
  <circle cx="0" fill="#00ff88" r="3" class="blk"><animate attributeName="cx" values="600;980" dur="2.5s" repeatCount="indefinite"/><animate attributeName="cy" values="415;465" dur="2.5s" repeatCount="indefinite"/></circle>

  <!-- SERVER -->
  <g transform="translate(600, 500)">
    <rect x="-75" y="-42" width="150" height="84" rx="10" fill="#0a1a0a" stroke="#00ff88" stroke-width="2.5" class="p3"/>
    <rect x="-65" y="-34" width="130" height="24" rx="4" fill="#00ff88" opacity="0.08"/>
    <rect x="-65" y="-34" width="80" height="24" rx="4" fill="#00ff88" opacity="0.15"/>
    <text x="0" y="-18" font-family="monospace" font-size="15" fill="#00ff88" text-anchor="middle">🖥️ SERVER</text>
    <text x="0" y="4" font-family="monospace" font-size="14" fill="#00ff88" text-anchor="middle">PRESENCE · NGINX</text>
    <text x="0" y="22" font-family="monospace" font-size="13" fill="#666" text-anchor="middle">SSH · HTTP · DNS</text>
    <circle cx="62" cy="-22" r="5" fill="#00ff88" class="p1" filter="url(#g)"/>
    <circle cx="-62" cy="-22" r="3" fill="none" stroke="#00ff88" class="p2"/>
  </g>

  <!-- WORKSTATION -->
  <g transform="translate(220, 500)">
    <rect x="-65" y="-36" width="130" height="72" rx="10" fill="#0a0a1e" stroke="#00ffff" stroke-width="2"/>
    <ellipse cx="42" cy="-18" rx="20" ry="14" fill="none" stroke="#00ffff" stroke-width="0.8"/>
    <rect x="36" y="-26" width="12" height="16" rx="3" fill="#00ffff" opacity="0.25"/>
    <text x="-10" y="-14" font-family="monospace" font-size="15" fill="#00ffff" text-anchor="middle">💻 WORKSTATION</text>
    <text x="-10" y="8" font-family="monospace" font-size="14" fill="#00ffff" text-anchor="middle">KALI · DEV</text>
    <text x="-10" y="26" font-family="monospace" font-size="13" fill="#666" text-anchor="middle">192.168.1.100</text>
    <circle cx="58" cy="-22" r="4" fill="#00ffff" class="blk"/>
  </g>

  <!-- LAB VM -->
  <g transform="translate(980, 500)">
    <rect x="-65" y="-36" width="130" height="72" rx="10" fill="#0a000a" stroke="#9d00ff" stroke-width="2"/>
    <rect x="-40" y="-26" width="80" height="16" rx="3" fill="#0a0a1e" stroke="#9d00ff" stroke-width="0.8"/>
    <text x="0" y="-14" font-family="monospace" font-size="15" fill="#9d00ff" text-anchor="middle">📦 LAB VM</text>
    <text x="0" y="8" font-family="monospace" font-size="14" fill="#9d00ff" text-anchor="middle">TARGET</text>
    <text x="0" y="26" font-family="monospace" font-size="13" fill="#666" text-anchor="middle">10.0.2.15</text>
    <circle cx="58" cy="-22" r="4" fill="#9d00ff" class="blk2"/>
  </g>

  <!-- SOC -->
  <line x1="600" y1="584" x2="600" y2="630" stroke="#ff6600" stroke-width="1" stroke-dasharray="6 8" class="df1"/>
  <line x1="220" y1="572" x2="600" y2="630" stroke="#ff6600" stroke-width="0.8" stroke-dasharray="5 10" class="df2"/>
  <line x1="980" y1="572" x2="600" y2="630" stroke="#ff6600" stroke-width="0.8" stroke-dasharray="5 10" class="df3"/>

  <g transform="translate(600, 655)">
    <rect x="-110" y="-28" width="220" height="56" rx="8" fill="#0a0a0a" stroke="#ff6600" stroke-width="1.5" class="p2"/>
    <text x="0" y="-8" font-family="monospace" font-size="15" fill="#ff6600" text-anchor="middle" letter-spacing="2">📊 SECURITY OPERATIONS</text>
    <text x="0" y="12" font-family="monospace" font-size="14" fill="#ff6600" text-anchor="middle">WAZUH · GRAFANA · LOG AGGREGATION</text>
    <circle cx="-90" cy="0" r="4" fill="#ff6600" class="p1" filter="url(#g)"/>
    <circle cx="90" cy="0" r="4" fill="#ff6600" class="blk"/>
  </g>
</svg>