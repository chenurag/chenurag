<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="100%" height="auto">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#00ff88"/>
    </marker>
    <style>
      @keyframes pulse-1 { 0%, 100% { opacity: 0.4; filter: drop-shadow(0 0 3px #00ff88); } 50% { opacity: 1; filter: drop-shadow(0 0 12px #00ff88); } }
      @keyframes pulse-2 { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.9; } }
      @keyframes blink-dot { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
      @keyframes data-flow { 0% { stroke-dashoffset: 120; } 100% { stroke-dashoffset: 0; } }
      @keyframes data-flow-rev { 0% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 120; } }
      @keyframes data-flow-slow { 0% { stroke-dashoffset: 200; } 100% { stroke-dashoffset: 0; } }
      @keyframes flow-blip { 0% { transform: translateX(0); opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { transform: translateX(var(--tx, 200px)); opacity: 0; } }
      @keyframes flow-blip-y { 0% { transform: translateY(0); opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { transform: translateY(100px); opacity: 0; } }
      @keyframes glow-pulse { 0%, 100% { filter: drop-shadow(0 0 5px #00ff88); } 50% { filter: drop-shadow(0 0 20px #00ff88); } }
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      @keyframes ring-expand { 0% { r: 3; opacity: 0.5; } 100% { r: 20; opacity: 0; } }

      .p1 { animation: pulse-1 2s ease-in-out infinite; }
      .p2 { animation: pulse-2 3s ease-in-out infinite; }
      .p3 { animation: glow-pulse 2.5s ease-in-out infinite; }
      .blk { animation: blink-dot 1s step-end infinite; }
      .blk2 { animation: blink-dot 0.7s step-end 0.3s infinite; }
      .df1 { stroke-dasharray: 40 80; animation: data-flow 2s linear infinite; }
      .df2 { stroke-dasharray: 60 100; animation: data-flow-rev 3s linear infinite; }
      .df3 { stroke-dasharray: 30 170; animation: data-flow-slow 4s linear infinite; }
      .b1 { --tx: 200px; animation: flow-blip 2s linear infinite; }
      .b2 { --tx: 300px; animation: flow-blip 3s linear infinite; }
      .re1 { animation: ring-expand 2s ease-out infinite; }
      .re2 { animation: ring-expand 2.5s ease-out 0.5s infinite; }
    </style>
  </defs>

  <rect width="900" height="600" fill="#03030e" rx="8"/>
  <rect x="2" y="2" width="896" height="596" rx="8" fill="none" stroke="#00ff88" stroke-width="0.5" opacity="0.2"/>

  <text x="450" y="25" font-family="monospace" font-size="15" fill="#00ff88" text-anchor="middle" letter-spacing="3" opacity="0.6">⚡ SHADOW LAB :: LIVE NETWORK TOPOLOGY</text>
  <line x1="30" y1="32" x2="870" y2="32" stroke="#00ff88" stroke-width="0.5" opacity="0.12"/>
  <text x="870" y="25" font-family="monospace" font-size="14" fill="#555" text-anchor="end">PACKETS/S: 242</text>

  <!-- ===== INTERNET CLOUD ===== -->
  <g transform="translate(450, 72)">
    <path d="M-40,18 Q-60,-2 -40,-18 L40,-18 Q60,-2 40,18 Z" fill="#0a0a1e" stroke="#00ffff" stroke-width="1.2"/>
    <text x="0" y="4" font-family="monospace" font-size="15" fill="#00ffff" text-anchor="middle" class="p1">☁️ INTERNET</text>
    <text x="0" y="40" font-family="monospace" font-size="14" fill="#666" text-anchor="middle">UNTRUSTED ZONE</text>
  </g>

  <!-- Data flowing down from internet -->
  <line x1="450" y1="90" x2="450" y2="130" stroke="#00ff88" stroke-width="1" class="df1" marker-end="url(#arrow)"/>
  <circle cx="450" cy="0" r="2.5" fill="#00ffff" class="b1"><animate attributeName="cy" values="90;130" dur="1.5s" repeatCount="indefinite"/></circle>
  <circle cx="450" cy="0" r="1.5" fill="#00ff88" class="b2"><animate attributeName="cy" values="95;130" dur="2.2s" repeatCount="indefinite"/></circle>

  <!-- ===== FIREWALL ===== -->
  <g transform="translate(450, 145)">
    <rect x="-55" y="-22" width="110" height="44" rx="6" fill="#1a0000" stroke="#ff003c" stroke-width="1.5" class="p3"/>
    <rect x="-55" y="-22" width="110" height="44" rx="6" fill="none" stroke="#ff003c" stroke-width="3" class="p1"/>
    <text x="0" y="-6" font-family="monospace" font-size="14" fill="#ff003c" text-anchor="middle" font-weight="bold">🔥 FIREWALL</text>
    <text x="0" y="8" font-family="monospace" font-size="14" fill="#ff6666" text-anchor="middle">▣ RULES: 47</text>
    <text x="0" y="18" font-family="monospace" font-size="15" fill="#ff003c" text-anchor="middle" opacity="0.6">DROP ALL → ALLOW ESTABLISHED</text>
  </g>

  <!-- Firewall → Router data -->
  <line x1="450" y1="167" x2="450" y2="210" stroke="#00ff88" stroke-width="1" class="df2"/>
  <circle cx="450" fill="#ff003c" r="2" class="blk"><animate attributeName="cy" values="167;210" dur="1.8s" repeatCount="indefinite"/></circle>

  <!-- ===== ROUTER ===== -->
  <g transform="translate(450, 225)">
    <rect x="-60" y="-22" width="120" height="44" rx="6" fill="#0a0a1e" stroke="#00ffff" stroke-width="1.5"/>
    <ellipse cx="-15" cy="0" rx="10" ry="10" fill="none" stroke="#00ffff" stroke-width="1" class="sp1"/>
    <circle cx="-15" cy="0" r="2" fill="#00ffff" class="blk2"/>
    <text x="15" y="-6" font-family="monospace" font-size="14" fill="#00ffff" text-anchor="middle">🔀 ROUTER</text>
    <text x="15" y="8" font-family="monospace" font-size="14" fill="#00ffff" text-anchor="middle" opacity="0.6">192.168.1.1</text>
    <text x="15" y="18" font-family="monospace" font-size="15" fill="#666" text-anchor="middle">OSPF · NAT · DHCP</text>
  </g>

  <!-- Router → Switch -->
  <line x1="450" y1="247" x2="450" y2="290" stroke="#00ff88" stroke-width="1" class="df1"/>
  <circle cx="450" fill="#00ffff" r="2" class="blk"><animate attributeName="cy" values="247;290" dur="1.5s" repeatCount="indefinite"/></circle>

  <!-- ===== SWITCH ===== -->
  <g transform="translate(450, 305)">
    <rect x="-65" y="-22" width="130" height="44" rx="6" fill="#0a0a1e" stroke="#00ff88" stroke-width="1.2"/>
    <g>
      <circle cx="-50" cy="0" r="3" fill="#00ff88" class="p1"/>
      <circle cx="-35" cy="0" r="3" fill="#00ff88" class="p2"/>
      <circle cx="-20" cy="0" r="3" fill="#00ff88" class="blk"/>
      <circle cx="-5" cy="0" r="3" fill="#00ff88" class="p2"/>
      <circle cx="10" cy="0" r="3" fill="#00ff88" class="blk2"/>
      <circle cx="25" cy="0" r="3" fill="#00ff88" class="p1"/>
      <circle cx="40" cy="0" r="3" fill="#00ff88" class="p2"/>
    </g>
    <text x="0" y="-28" font-family="monospace" font-size="14" fill="#00ff88" text-anchor="middle">⬡ SWITCH</text>
  </g>

  <!-- Switch → 3 branches -->
  <line x1="450" y1="327" x2="450" y2="375" stroke="#00ff88" stroke-width="0.8" class="df1"/>
  <line x1="450" y1="327" x2="180" y2="375" stroke="#00ff88" stroke-width="0.8" class="df3"/>
  <line x1="450" y1="327" x2="720" y2="375" stroke="#00ff88" stroke-width="0.8" class="df2"/>

  <!-- Data blips on branches -->
  <circle cx="450" fill="#00ff88" r="2" class="blk"><animate attributeName="cy" values="327;375" dur="2s" repeatCount="indefinite"/></circle>
  <circle cx="0" fill="#00ffff" r="2" class="blk2"><animate attributeName="cx" values="450;180" dur="3s" repeatCount="indefinite"/><animate attributeName="cy" values="330;375" dur="3s" repeatCount="indefinite"/></circle>
  <circle cx="0" fill="#00ff88" r="2" class="blk"><animate attributeName="cx" values="450;720" dur="2.5s" repeatCount="indefinite"/><animate attributeName="cy" values="330;375" dur="2.5s" repeatCount="indefinite"/></circle>

  <!-- ===== SERVER ===== -->
  <g transform="translate(450, 400)">
    <rect x="-55" y="-35" width="110" height="70" rx="8" fill="#0a1a0a" stroke="#00ff88" stroke-width="2" class="p3"/>
    <rect x="-48" y="-28" width="96" height="20" rx="3" fill="#00ff88" opacity="0.08"/>
    <rect x="-48" y="-28" width="60" height="20" rx="3" fill="#00ff88" opacity="0.15"/>
    <text x="0" y="-16" font-family="monospace" font-size="14" fill="#00ff88" text-anchor="middle">🖥️ SERVER</text>
    <text x="0" y="0" font-family="monospace" font-size="14" fill="#00ff88" text-anchor="middle" opacity="0.6">PRESENCE · NGINX</text>
    <text x="0" y="12" font-family="monospace" font-size="14" fill="#666" text-anchor="middle">SSH · HTTP · DNS</text>
    <circle cx="44" cy="-16" r="4" fill="#00ff88" class="p1" filter="url(#glow)"/>
    <!-- Expanding ring -->
    <circle cx="-44" cy="-16" r="3" fill="none" stroke="#00ff88" class="re1"/>
    <circle cx="-44" cy="-16" r="3" fill="none" stroke="#00ffff" class="re2"/>
  </g>

  <!-- ===== WORKSTATION ===== -->
  <g transform="translate(180, 400)">
    <rect x="-50" y="-28" width="100" height="56" rx="8" fill="#0a0a1e" stroke="#00ffff" stroke-width="1.5"/>
    <ellipse cx="30" cy="-14" rx="16" ry="12" fill="none" stroke="#00ffff" stroke-width="0.5"/>
    <rect x="26" y="-20" width="8" height="12" rx="2" fill="#00ffff" opacity="0.2"/>
    <text x="-8" y="-10" font-family="monospace" font-size="14" fill="#00ffff" text-anchor="middle">💻 PC</text>
    <text x="-8" y="6" font-family="monospace" font-size="14" fill="#00ffff" text-anchor="middle" opacity="0.6">KALI · DEV</text>
    <text x="-8" y="20" font-family="monospace" font-size="15" fill="#666" text-anchor="middle">192.168.1.100</text>
    <circle cx="44" cy="-16" r="3" fill="#00ffff" class="blk"/>
  </g>

  <!-- ===== LAB VM ===== -->
  <g transform="translate(720, 400)">
    <rect x="-50" y="-28" width="100" height="56" rx="8" fill="#0a000a" stroke="#9d00ff" stroke-width="1.5"/>
    <rect x="-30" y="-20" width="60" height="14" rx="2" fill="#0a0a1e" stroke="#9d00ff" stroke-width="0.5"/>
    <text x="0" y="-10" font-family="monospace" font-size="14" fill="#9d00ff" text-anchor="middle">📦 LAB VM</text>
    <text x="0" y="6" font-family="monospace" font-size="14" fill="#9d00ff" text-anchor="middle" opacity="0.6">METASPLOITABLE</text>
    <text x="0" y="20" font-family="monospace" font-size="15" fill="#666" text-anchor="middle">10.0.2.15</text>
    <circle cx="44" cy="-16" r="3" fill="#9d00ff" class="blk2"/>
  </g>

  <!-- Data flowing from all nodes to SOC -->
  <line x1="450" y1="470" x2="450" y2="520" stroke="#ff6600" stroke-width="0.8" stroke-dasharray="5 8" class="df1"/>
  <line x1="180" y1="456" x2="450" y2="520" stroke="#ff6600" stroke-width="0.5" stroke-dasharray="4 10" class="df2"/>
  <line x1="720" y1="456" x2="450" y2="520" stroke="#ff6600" stroke-width="0.5" stroke-dasharray="4 10" class="df3"/>

  <circle cx="0" fill="#ff6600" r="2"><animate attributeName="cx" values="450;450" dur="2s" repeatCount="indefinite"/><animate attributeName="cy" values="470;520" dur="2s" repeatCount="indefinite"/></circle>

  <!-- ===== SOC ===== -->
  <g transform="translate(450, 535)">
    <rect x="-85" y="-25" width="170" height="50" rx="6" fill="#0a0a0a" stroke="#ff6600" stroke-width="1" class="p2"/>
    <text x="0" y="-8" font-family="monospace" font-size="14" fill="#ff6600" text-anchor="middle" letter-spacing="2">📊 SECURITY OPERATIONS</text>
    <text x="0" y="8" font-family="monospace" font-size="14" fill="#ff6600" text-anchor="middle" opacity="0.6">WAZUH · GRAFANA · LOG AGGREGATION</text>
    <circle cx="-70" cy="0" r="3" fill="#ff6600" class="p1" filter="url(#glow)"/>
    <circle cx="70" cy="0" r="3" fill="#ff6600" class="blk"/>
  </g>

  <!-- Legend -->
  <g transform="translate(20, 60)">
    <rect x="0" y="0" width="130" height="130" rx="4" fill="#060618" stroke="#00ff88" stroke-width="0.5" opacity="0.35"/>
    <text x="65" y="18" font-family="monospace" font-size="15" fill="#00ff88" text-anchor="middle" opacity="0.6">LEGEND</text>
    <line x1="10" y1="32" x2="40" y2="32" stroke="#ff003c" stroke-width="2"/>
    <text x="45" y="35" font-family="monospace" font-size="14" fill="#555">Firewall</text>
    <line x1="10" y1="50" x2="40" y2="50" stroke="#00ffff" stroke-width="1.5"/>
    <text x="45" y="53" font-family="monospace" font-size="14" fill="#555">Router</text>
    <line x1="10" y1="68" x2="40" y2="68" stroke="#00ff88" stroke-width="1"/>
    <text x="45" y="71" font-family="monospace" font-size="14" fill="#555">Switch</text>
    <line x1="10" y1="86" x2="40" y2="86" stroke="#9d00ff" stroke-width="1"/>
    <text x="45" y="89" font-family="monospace" font-size="14" fill="#555">VM Target</text>
    <line x1="10" y1="104" x2="40" y2="104" stroke="#ff6600" stroke-width="1"/>
    <text x="45" y="107" font-family="monospace" font-size="14" fill="#555">SOC / SIEM</text>
    <line x1="10" y1="122" x2="25" y2="122" stroke="#00ff88" stroke-width="0.8" stroke-dasharray="4 4"/>
    <text x="30" y="125" font-family="monospace" font-size="14" fill="#555">Data flow</text>
  </g>
</svg>