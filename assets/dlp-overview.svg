<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 190" width="100%" height="auto">
  <defs>
    <filter id="g"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style><![CDATA[
      @keyframes p{0%,100%{filter:drop-shadow(0 0 3px #00ffff)}50%{filter:drop-shadow(0 0 10px #00ffff)}}
      @keyframes sc{0%{transform:translateX(-1200px)}100%{transform:translateX(1200px)}}
      @keyframes fk{0%,100%{opacity:0.96}2%{opacity:0.2}4%{opacity:0.96}}
      @keyframes br{0%,100%{opacity:0.3}50%{opacity:0.7}}
      .p{animation:p 2s ease-in-out infinite}
      .sc{animation:sc 4s linear infinite}
      .fk{animation:fk 7s infinite}
      .br{animation:br 4s ease-in-out infinite}
    ]]></style>
  </defs>
  <rect width="1200" height="190" fill="#02020c" rx="6"/>
  <rect x="1" y="1" width="1198" height="188" rx="6" fill="none" stroke="#00ffff" stroke-width="0.4" opacity="0.1"/>
  <rect class="sc" width="1200" height="1" fill="#00ffff" opacity="0.04"/>
  <rect class="fk" width="1200" height="190" fill="#000" opacity="0.01" pointer-events="none"/>
  <text x="600" y="20" font-family="monospace" font-size="12" fill="#00ffff" text-anchor="middle" letter-spacing="2" opacity="0.7">DATA LOSS PREVENTION</text>
  <g transform="translate(15, 42)">
    <rect x="0" y="0" width="370" height="36" rx="4" fill="#08081a" stroke="#00ffff" stroke-width="0.3" opacity="0.4">
      <animate attributeName="opacity" from="0" to="0.4" dur="0.5s" begin="0.0s" fill="freeze"/>
    </rect>
    <text x="12" y="24" font-family="monospace" font-size="12" fill="#00ffff" opacity="0.9">Network DLP</text>
    <text x="360" y="24" font-family="monospace" font-size="13" fill="#cccccc" text-anchor="end" opacity="0.9">88</text>
  </g>
  <g transform="translate(405, 42)">
    <rect x="0" y="0" width="370" height="36" rx="4" fill="#08081a" stroke="#00ffff" stroke-width="0.3" opacity="0.4">
      <animate attributeName="opacity" from="0" to="0.4" dur="0.5s" begin="0.1s" fill="freeze"/>
    </rect>
    <text x="12" y="24" font-family="monospace" font-size="12" fill="#00ffff" opacity="0.9">Endpoint DLP</text>
    <text x="360" y="24" font-family="monospace" font-size="13" fill="#cccccc" text-anchor="end" opacity="0.9">82</text>
  </g>
  <g transform="translate(795, 42)">
    <rect x="0" y="0" width="370" height="36" rx="4" fill="#08081a" stroke="#00ffff" stroke-width="0.3" opacity="0.4">
      <animate attributeName="opacity" from="0" to="0.4" dur="0.5s" begin="0.2s" fill="freeze"/>
    </rect>
    <text x="12" y="24" font-family="monospace" font-size="12" fill="#00ffff" opacity="0.9">Storage DLP</text>
    <text x="360" y="24" font-family="monospace" font-size="13" fill="#cccccc" text-anchor="end" opacity="0.9">78</text>
  </g>
  <g transform="translate(15, 90)">
    <rect x="0" y="0" width="370" height="36" rx="4" fill="#08081a" stroke="#00ffff" stroke-width="0.3" opacity="0.4">
      <animate attributeName="opacity" from="0" to="0.4" dur="0.5s" begin="0.30000000000000004s" fill="freeze"/>
    </rect>
    <text x="12" y="24" font-family="monospace" font-size="12" fill="#00ffff" opacity="0.9">Cloud DLP</text>
    <text x="360" y="24" font-family="monospace" font-size="13" fill="#cccccc" text-anchor="end" opacity="0.9">85</text>
