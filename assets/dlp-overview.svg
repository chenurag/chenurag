      <animate attributeName="opacity" from="0" to="0.4" dur="0.5s" begin="0.4s" fill="freeze"/>
    </rect>
    <text x="12" y="24" font-family="monospace" font-size="12" fill="#00ffff" opacity="0.9">Email DLP</text>
    <text x="360" y="24" font-family="monospace" font-size="13" fill="#cccccc" text-anchor="end" opacity="0.9">80</text>
  </g></svg>