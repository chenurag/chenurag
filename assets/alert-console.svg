<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="100%" height="auto">
  <defs><filter id="g"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style><![CDATA[
      @keyframes scrollUp{0%{transform:translateY(0)}100%{transform:translateY(-350px)}}
      @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
      @keyframes pulse{0%,100%{filter:drop-shadow(0 0 3px)}50%{filter:drop-shadow(0 0 12px)}}
      @keyframes breathe{0%,100%{opacity:0.4}50%{opacity:0.8}}
      @keyframes scan{0%{transform:translateX(-1200px)}100%{transform:translateX(1200px)}}
      @keyframes flick{0%,100%{opacity:0.96}2%{opacity:0.2}4%{opacity:0.96}}
      .su{animation:scrollUp 22s linear infinite}.blk{animation:blink 0.8s step-end infinite}
      .p1{animation:pulse 2s ease-in-out infinite}.br{animation:breathe 4s ease-in-out infinite}
      .sc{animation:scan 4s linear infinite}.fk{animation:flick 7s infinite}
    ]]></style>
  </defs>
  <rect width="1200" height="200" fill="#02020c" rx="8"/>
  <rect x="1" y="1" width="1198" height="198" rx="8" fill="none" stroke="#00ff88" stroke-width="0.5" opacity="0.12"/>
  <rect class="sc" width="1200" height="1" fill="#00ff88" opacity="0.04"/>
  <rect class="fk" width="1200" height="200" fill="#000" opacity="0.01" pointer-events="none"/>
  <text x="600" y="22" font-family="monospace" font-size="10" fill="#00ff88" text-anchor="middle" letter-spacing="2" opacity="0.6">ALERT CONSOLE — NOTIFICATION FEED</text>

  <rect x="0" y="0" width="60" height="200" rx="8" fill="#04041a"/>
  <circle cx="15" cy="15" r="4" fill="#ff003c" class="blk" filter="url(#g)"/>
  <text x="6" y="38" font-family="monospace" font-size="8" fill="#ff6666" font-weight="bold" class="blk">ALERT</text>

  <g clip-path="url(#ac)">
    <defs><clipPath id="ac"><rect x="60" y="5" width="1140" height="190"/></clipPath></defs>
    <g class="su" font-family="monospace" font-size="10">
      <text x="75" y="25" fill="#00ff88">[OK] All lab environments healthy</text>
      <text x="75" y="45" fill="#888">[INFO] Weekly report generated</text>
      <text x="75" y="65" fill="#ff6600">[WARN] /tmp usage at 85% on kali-lab</text>
      <text x="75" y="85" fill="#00ff88">[OK] Wazuh agent check passed</text>
      <text x="75" y="105" fill="#ff003c">[ERR] Failed ping to 10.0.2.25 — VM offline</text>
      <text x="75" y="125" fill="#888">[INFO] Snort rule update #4129</text>
      <text x="75" y="145" fill="#00ff88">[OK] AI core heartbeat normal</text>
      <text x="75" y="165" fill="#ff6600">[WARN] SSL cert expiring: lab.shadow.io (12d)</text>
      <text x="75" y="185" fill="#00ff88">[OK] Firewall rules synced</text>
      <text x="75" y="205" fill="#888">[INFO] Fail2ban: 3 IPs banned</text>
      <text x="75" y="225" fill="#ff003c">[ERR] Docker daemon restart detected</text>
      <text x="75" y="245" fill="#00ff88">[OK] Docker healthy after restart</text>
      <text x="75" y="265" fill="#888">[INFO] Backup completed: /var/log</text>
      <text x="75" y="285" fill="#00ff88">[OK] Network scan complete — 0 threats</text>
      <text x="75" y="305" fill="#ff6600">[WARN] Swap usage at 60% on server</text>
      <text x="75" y="325" fill="#00ff88">[OK] All systems nominal</text>
    </g>
  </g>
</svg>