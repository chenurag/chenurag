<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="auto">
  <defs>
    <filter id="g"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="g2"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#00ff88"/><stop offset="50%" stop-color="#00ffff"/><stop offset="100%" stop-color="#00ff88"/></linearGradient>
    <style><![CDATA[

      @keyframes p1{0%,100%{opacity:0.4;filter:drop-shadow(0 0 4px #00ff88)}50%{opacity:1;filter:drop-shadow(0 0 20px #00ff88)}}
      @keyframes p2{0%,100%{opacity:0.3}50%{opacity:0.9}}
      @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
      @keyframes breathe{0%,100%{opacity:0.5}50%{opacity:0.2}}
      @keyframes scan{0%{transform:translateX(-1200px)}100%{transform:translateX(1200px)}}
      @keyframes flick{0%,100%{opacity:0.95}1%{opacity:0.1}3%{opacity:0.95}6%{opacity:0.5}8%{opacity:0.95}}
      @keyframes typewriter{0%{width:0}100%{width:100%}}
      @keyframes pulse-glow{0%,100%{r:4;opacity:0.8}50%{r:8;opacity:0}}
      @keyframes rotate{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
      
      .p1{animation:p1 2.5s ease-in-out infinite}
      .p2{animation:p2 3s ease-in-out infinite}
      .blk{animation:blink 0.8s step-end infinite}
      .br{animation:breathe 4s ease-in-out infinite}
      .sc{animation:scan 4s linear infinite}
      .fk{animation:flick 6s infinite}
      .fl{animation:float 4s ease-in-out infinite}
      .typing{overflow:hidden;white-space:nowrap;animation:typewriter 4s steps(50) 0.5s both}
    
]]></style>
  </defs>

  <rect width="1200" height="300" fill="#03030e" rx="8"/>
  <rect x="1" y="1" width="1198" height="298" rx="8" fill="none" stroke="#00ff88" stroke-width="0.5" opacity="0.1"/>
  
  <!-- Scan lines -->
  <rect class="sc" width="1200" height="1" fill="url(#bar)" opacity="0.05"/>
  <rect class="sc" width="1200" height="1" fill="#00ff88" opacity="0.03" style="animation-delay:1.5s"/>
  <rect class="fk" width="1200" height="300" fill="#000" opacity="0.01" pointer-events="none"/>

  <!-- Top glow divider -->
  <rect x="400" y="0" width="400" height="2" fill="url(#bar)" opacity="0.3"/>

  <!-- Main title -->
  <g filter="url(#g2)">
    <text x="600" y="55" font-family="'Orbitron','Courier New',monospace" font-size="28" font-weight="900"
          fill="url(#bar)" text-anchor="middle" letter-spacing="8" class="p1">SHADOWBEAST</text>
  </g>
  <text x="600" y="80" font-family="monospace" font-size="10" fill="#888" text-anchor="middle" letter-spacing="4" class="br">
    CYBERSECURITY · TECHNOLOGY · AI · RESEARCH
  </text>

  <!-- Status terminal block -->
  <g transform="translate(30, 100)">
    <rect x="0" y="0" width="1140" height="60" rx="6" fill="#060618" stroke="#00ff88" stroke-width="0.5" opacity="0.25"/>
    
    <text x="20" y="22" font-family="monospace" font-size="8" fill="#555">SYSTEM STATUS</text>
    <text x="220" y="22" font-family="monospace" font-size="8" fill="#555">DEFENSE MATRIX</text>
    <text x="460" y="22" font-family="monospace" font-size="8" fill="#555">AI CORE</text>
    <text x="680" y="22" font-family="monospace" font-size="8" fill="#555">SHADOW NETWORK</text>
    <text x="920" y="22" font-family="monospace" font-size="8" fill="#555">ALIEN ACCESS</text>

    <circle cx="115" cy="45" r="4" fill="#00ff88" class="p1" filter="url(#g)"/>
    <text x="125" y="48" font-family="monospace" font-size="9" fill="#00ff88" class="p1">● ONLINE</text>
    
    <circle cx="345" cy="45" r="4" fill="#00ff88" class="p2"/>
    <text x="355" y="48" font-family="monospace" font-size="9" fill="#00ff88" class="p2">● ENGAGED</text>
    
    <circle cx="590" cy="45" r="4" fill="#00ff88" class="blk"/>
    <text x="600" y="48" font-family="monospace" font-size="9" fill="#00ff88">● OPERATIONAL</text>
    
    <circle cx="840" cy="45" r="4" fill="#00ff88" class="p2"/>
    <text x="850" y="48" font-family="monospace" font-size="9" fill="#00ff88">☰ SYNCED</text>
    
    <circle cx="1085" cy="45" r="4" fill="#00ff88" class="p1" filter="url(#g)"/>
    <text x="1095" y="48" font-family="monospace" font-size="9" fill="#00ff88" class="p1">▣ GRANTED</text>
  </g>

  <!-- Quote -->
  <text x="600" y="190" font-family="monospace" font-size="9" fill="#888" text-anchor="middle" opacity="0.5" class="br">
    "SYSTEM STATUS :: ONLINE // SHADOW PROTOCOL :: ACTIVE // ALIEN ACCESS :: GRANTED"
  </text>

  <!-- Bottom badge cluster -->
  <g transform="translate(30, 205)">
    <!-- Glowing enter button -->
    <rect x="350" y="0" width="500" height="35" rx="6" fill="#0a1a0a" stroke="#00ff88" stroke-width="1.5" class="p1"/>
    <text x="600" y="22" font-family="monospace" font-size="14" fill="#00ff88" text-anchor="middle" font-weight="bold" class="p1">
      ◉ ENTER THE SHADOW NETWORK
    </text>
    <circle cx="375" cy="17" r="3" fill="#00ff88" class="blk"/>
    <circle cx="825" cy="17" r="3" fill="#00ff88" class="blk"/>
  </g>

  <!-- Footer wave -->
  <path d="M0,260 Q150,280 300,265 Q450,250 600,265 Q750,280 900,260 Q1050,240 1200,260 L1200,300 L0,300 Z" fill="#040416" opacity="0.5"/>
  <path d="M0,270 Q200,290 400,275 Q600,260 800,275 Q1000,290 1200,270 L1200,300 L0,300 Z" fill="#03030e" opacity="0.6"/>

  <!-- Terminal cursor blink at very bottom -->
  <text x="600" y="292" font-family="monospace" font-size="8" fill="#00ff88" text-anchor="middle" opacity="0.2" class="blk">_</text>
</svg>