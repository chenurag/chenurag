  <rect class="sc" width="1200" height="1" fill="#00ff88" opacity="0.04"/>
  <rect class="fk" width="1200" height="200" fill="#000" opacity="0.01" pointer-events="none"/>
  <text x="600" y="24" font-family="monospace" font-size="14" fill="#00ff88" text-anchor="middle" letter-spacing="2" opacity="0.7">PROTOCOL BADGES — OPERATIONAL ACHIEVEMENTS</text>

  <g transform="translate(50, 60)">
    <rect x="0" y="0" width="160" height="55" rx="8" fill="#0a1a0a" stroke="#00ff88" stroke-width="0.8" class="fl1"/>
