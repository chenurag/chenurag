<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="100%" height="auto">
  <defs><filter id="g"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style><![CDATA[
      @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}@keyframes pulse{0%,100%{filter:drop-shadow(0 0 4px)}50%{filter:drop-shadow(0 0 14px)}}
      @keyframes breathe{0%,100%{opacity:0.3}50%{opacity:0.7}}@keyframes scan{0%{transform:translateX(-1200px)}100%{transform:translateX(1200px)}}
      @keyframes flick{0%,100%{opacity:0.96}2%{opacity:0.2}4%{opacity:0.96}}
      @keyframes float1{0%,100%{transform:translate(0,0)}50%{transform:translate(-20px,-15px)}}
      @keyframes float2{0%,100%{transform:translate(0,0)}50%{transform:translate(15px,-20px)}}
      @keyframes float3{0%,100%{transform:translate(0,0)}50%{transform:translate(-10px,20px)}}
      @keyframes float4{0%,100%{transform:translate(0,0)}50%{transform:translate(18px,12px)}}
      @keyframes float5{0%,100%{transform:translate(0,0)}50%{transform:translate(-15px,-10px)}}
      @keyframes float6{0%,100%{transform:translate(0,0)}50%{transform:translate(12px,-18px)}}
      .fl1{animation:float1 4s ease-in-out infinite}.fl2{animation:float2 5s ease-in-out 0.5s infinite}
      .fl3{animation:float3 4.5s ease-in-out 1s infinite}.fl4{animation:float4 5.5s ease-in-out 1.5s infinite}
      .fl5{animation:float5 4s ease-in-out 0.3s infinite}.fl6{animation:float6 5s ease-in-out 0.8s infinite}
      .blk{animation:blink 0.8s step-end infinite}.p1{animation:pulse 2s ease-in-out infinite}.br{animation:breathe 4s ease-in-out infinite}.sc{animation:scan 4s linear infinite}.fk{animation:flick 7s infinite}
    ]]></style>
  </defs>
  <rect width="1200" height="200" fill="#02020c" rx="8"/>
