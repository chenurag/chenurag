    <text x="80" y="42" font-family="monospace" font-size="11" fill="#888" text-anchor="middle">CVE ANALYZED</text>
  </g>
  <g transform="translate(410, 60)">
    <rect x="0" y="0" width="160" height="55" rx="8" fill="#0a000a" stroke="#ff003c" stroke-width="0.8" class="fl3"/>
    <text x="80" y="22" font-family="monospace" font-size="15" fill="#ff6666" text-anchor="middle" class="p1">100%</text>
    <text x="80" y="42" font-family="monospace" font-size="11" fill="#888" text-anchor="middle">UPTIME</text>
  </g>
  <g transform="translate(590, 60)">
    <rect x="0" y="0" width="160" height="55" rx="8" fill="#0a0a1a" stroke="#9d00ff" stroke-width="0.8" class="fl4"/>
    <text x="80" y="22" font-family="monospace" font-size="15" fill="#9d00ff" text-anchor="middle" class="p1">47d</text>
    <text x="80" y="42" font-family="monospace" font-size="11" fill="#888" text-anchor="middle">UPTIME</text>
  </g>
  <g transform="translate(770, 60)">
    <rect x="0" y="0" width="160" height="55" rx="8" fill="#0a0a1a" stroke="#ff6600" stroke-width="0.8" class="fl5"/>
    <text x="80" y="22" font-family="monospace" font-size="15" fill="#ff9900" text-anchor="middle" class="p1">21d</text>
    <text x="80" y="42" font-family="monospace" font-size="11" fill="#888" text-anchor="middle">BEST STREAK</text>
  </g>
  <g transform="translate(950, 60)">
