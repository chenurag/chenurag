    <text x="95" y="42" font-family="monospace" font-size="11" fill="#888" text-anchor="middle">SVG ANIMATIONS</text>
  </g>

  <g transform="translate(50, 145)">
    <rect x="0" y="0" width="1100" height="36" rx="4" fill="#060618" stroke="#00ff88" stroke-width="0.4" opacity="0.3"/>
    <text x="15" y="23" font-family="monospace" font-size="12" fill="#555">BADGE PROTOCOL: <tspan fill="#00ff88" class="p1">ALL ACTIVE</tspan></text>
    <text x="350" y="23" font-family="monospace" font-size="12" fill="#555">LAST UNLOCKED: <tspan fill="#00ffff">42 SVG ANIMATIONS</tspan></text>
    <text x="750" y="23" font-family="monospace" font-size="12" fill="#555">TIER: <tspan fill="#ff6600">LEGENDARY</tspan></text>
    <circle cx="1100" cy="17" r="4" fill="#00ff88" class="blk"/>
