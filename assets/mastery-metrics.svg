<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="100%" height="auto">
  <defs><filter id="g"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style><![CDATA[
      @keyframes fillMeter{0%{width:0}100%{width:var(--w)}}
      @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}@keyframes pulse{0%,100%{filter:drop-shadow(0 0 4px)}50%{filter:drop-shadow(0 0 14px)}}
      @keyframes breathe{0%,100%{opacity:0.3}50%{opacity:0.7}}@keyframes scan{0%{transform:translateX(-1200px)}100%{transform:translateX(1200px)}}
      @keyframes flick{0%,100%{opacity:0.96}2%{opacity:0.2}4%{opacity:0.96}}
      .fm1{--w:280px;animation:fillMeter 2s ease-out 0.2s both}.fm2{--w:220px;animation:fillMeter 2s ease-out 0.4s both}
      .fm3{--w:160px;animation:fillMeter 2s ease-out 0.6s both}.fm4{--w:100px;animation:fillMeter 2s ease-out 0.8s both}
      .blk{animation:blink 0.8s step-end infinite}.p1{animation:pulse 2s ease-in-out infinite}
      .br{animation:breathe 4s ease-in-out infinite}.sc{animation:scan 4s linear infinite}.fk{animation:flick 7s infinite}
    ]]></style>
  </defs>
  <rect width="1200" height="220" fill="#02020c" rx="8"/>
  <rect x="1" y="1" width="1198" height="218" rx="8" fill="none" stroke="#00ff88" stroke-width="0.5" opacity="0.12"/>
  <rect class="sc" width="1200" height="1" fill="#00ff88" opacity="0.04"/>
  <rect class="fk" width="1200" height="220" fill="#000" opacity="0.01" pointer-events="none"/>
  <text x="600" y="24" font-family="monospace" font-size="14" fill="#00ff88" text-anchor="middle" letter-spacing="2" opacity="0.7">MASTERY METRICS — CONFIDENCE &amp; EXPERIENCE LEVELS</text>

  <g transform="translate(40, 50)">
    <text x="0" y="20" font-family="monospace" font-size="14" fill="#888">Offensive Security</text><rect x="200" y="10" width="350" height="14" rx="4" fill="#0a0a1e" stroke="#ff003c" stroke-width="0.3"/>
    <rect x="200" y="10" width="280" height="14" rx="4" fill="#ff003c" opacity="0.7" class="fm1"/><text x="570" y="23" font-family="monospace" font-size="14" fill="#ff003c">80%</text>

    <text x="0" y="50" font-family="monospace" font-size="14" fill="#888">Defensive Security</text><rect x="200" y="40" width="350" height="14" rx="4" fill="#0a0a1e" stroke="#00ff88" stroke-width="0.3"/>
    <rect x="200" y="40" width="220" height="14" rx="4" fill="#00ff88" opacity="0.7" class="fm2"/><text x="570" y="53" font-family="monospace" font-size="14" fill="#00ff88">65%</text>

    <text x="0" y="80" font-family="monospace" font-size="14" fill="#888">AI Engineering</text><rect x="200" y="70" width="350" height="14" rx="4" fill="#0a0a1e" stroke="#9d00ff" stroke-width="0.3"/>
    <rect x="200" y="70" width="160" height="14" rx="4" fill="#9d00ff" opacity="0.6" class="fm3"/><text x="570" y="83" font-family="monospace" font-size="14" fill="#9d00ff">45%</text>

    <text x="0" y="110" font-family="monospace" font-size="14" fill="#888">Cloud Security</text><rect x="200" y="100" width="350" height="14" rx="4" fill="#0a0a1e" stroke="#00ffff" stroke-width="0.3"/>
    <rect x="200" y="100" width="100" height="14" rx="4" fill="#00ffff" opacity="0.6" class="fm4"/><text x="570" y="113" font-family="monospace" font-size="14" fill="#00ffff">30%</text>
  </g>

  <g transform="translate(660, 45)">
    <rect x="0" y="0" width="500" height="80" rx="6" fill="#040416" stroke="#00ff88" stroke-width="0.5"/>
    <text x="15" y="24" font-family="monospace" font-size="14" fill="#00ff88" font-weight="bold">CERTIFICATION PROGRESS</text>
    <text x="15" y="48" font-family="monospace" font-size="14" fill="#00ffff">Security+ <tspan fill="#888">(80% Complete)</tspan></text>
    <text x="15" y="68" font-family="monospace" font-size="14" fill="#00ff88">Network+ <tspan fill="#888">(Studying)</tspan></text>
    <circle cx="480" cy="18" r="4" fill="#00ff88" class="blk"/>
  </g>
  <g transform="translate(660, 140)">
    <rect x="0" y="0" width="500" height="55" rx="6" fill="#040416" stroke="#00ffff" stroke-width="0.5"/>
    <text x="15" y="22" font-family="monospace" font-size="14" fill="#00ffff" font-weight="bold">OVERALL MASTERY SCORE</text>
    <text x="15" y="44" font-family="monospace" font-size="14" fill="#888">LEVEL: <tspan fill="#00ff88" class="p1">INTERMEDIATE</tspan></text>
    <text x="250" y="44" font-family="monospace" font-size="14" fill="#888">SCORE: <tspan fill="#00ff88">55/100</tspan></text>
    <circle cx="480" cy="18" r="4" fill="#00ffff" class="blk"/>
  </g>
</svg>