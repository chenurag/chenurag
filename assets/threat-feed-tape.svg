      <text x="95" y="85" fill="#00ff88">[INFO] Port scan from 10.0.0.1 blocked by firewall</text>
      <text x="95" y="105" fill="#ff003c">[ALERT] Failed SSH login attempt — 203.0.113.5</text>
      <text x="95" y="125" fill="#888">[INFO] Cron job: nightly log rotation completed</text>
      <text x="95" y="145" fill="#00ff88">[INFO] Wazuh agent heartbeat received — all endpoints OK</text>
      <text x="95" y="165" fill="#ff6600">[WARN] SSL certificate for lab.shadow.local expires in 14d</text>
      <text x="95" y="185" fill="#00ff88">[INFO] Snort rule set updated — 47 new signatures</text>
