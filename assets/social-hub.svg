<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 180" width="100%" height="auto">
  <defs>
    <filter id="g"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style><![CDATA[

      @keyframes pulse{0%,100%{opacity:0.5;filter:drop-shadow(0 0 8px)}50%{opacity:1;filter:drop-shadow(0 0 25px)}}
      @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
      @keyframes breathe{0%,100%{opacity:0.3}50%{opacity:0.7}}
      @keyframes scan{0%{transform:translateX(-1200px)}100%{transform:translateX(1200px)}}
      @keyframes flick{0%,100%{opacity:0.96}2%{opacity:0.2}4%{opacity:0.96}}
      @keyframes orbit{0%{transform:rotate(0deg) translateX(65px) rotate(0deg)}100%{transform:rotate(360deg) translateX(65px) rotate(-360deg)}}
      @keyframes orbitRev{0%{transform:rotate(180deg) translateX(55px) rotate(-180deg)}100%{transform:rotate(540deg) translateX(55px) rotate(-540deg)}}
      @keyframes wave{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
      
      .p1{animation:pulse 2.5s ease-in-out infinite}
      .blk{animation:blink 0.8s step-end infinite}
      .br{animation:breathe 4s ease-in-out infinite}
      .sc{animation:scan 4s linear infinite}
      .fk{animation:flick 7s infinite}
      .ob{animation:orbit 7s linear infinite}
      .obr{animation:orbitRev 9s linear infinite}
      .wv{animation:wave 3s ease-in-out infinite}
    
]]></style>
  </defs>

  <rect width="1200" height="180" fill="#02020c" rx="8"/>
  <rect x="1" y="1" width="1198" height="178" rx="8" fill="none" stroke="#00ff88" stroke-width="0.5" opacity="0.12"/>
  <rect class="sc" width="1200" height="1" fill="#00ff88" opacity="0.04"/>
  <rect class="fk" width="1200" height="180" fill="#000" opacity="0.01" pointer-events="none"/>

  <text x="600" y="22" font-family="monospace" font-size="10" fill="#00ff88" text-anchor="middle" letter-spacing="2" opacity="0.6">🔗 SOCIAL HUB — ORBITAL CONNECTIONS</text>

  <!-- Central avatar orbit -->
  <g transform="translate(100, 95)">
    <circle cx="0" cy="0" r="35" fill="none" stroke="#00ff88" stroke-width="0.5" opacity="0.3"/>
    <circle cx="0" cy="0" r="50" fill="none" stroke="#00ffff" stroke-width="0.3" opacity="0.2"/>
    <circle cx="0" cy="0" r="13" fill="#0a1a0a" stroke="#00ff88" stroke-width="1.5" class="p1"/>
    <text x="0" y="5" font-family="monospace" font-size="14" fill="#00ff88" text-anchor="middle" class="p1">👽</text>
  </g>

  <!-- Orbiting socials -->
  <g transform="translate(100, 95)">
    <!-- GitHub -->
    <g class="ob">
      <circle cx="65" cy="0" r="18" fill="#0a0a1e" stroke="#00ff88" stroke-width="1"/>
      <text x="65" y="5" font-family="monospace" font-size="12" fill="#00ff88" text-anchor="middle">◉</text>
      <a href="https://github.com/Chenura"><text x="65" y="32" font-family="monospace" font-size="7" fill="#00ff88" text-anchor="middle">GITHUB</text></a>
    </g>
    <!-- LinkedIn -->
    <g class="obr">
      <circle cx="55" cy="0" r="18" fill="#0a0a1e" stroke="#00ffff" stroke-width="1"/>
      <text x="55" y="5" font-family="monospace" font-size="12" fill="#00ffff" text-anchor="middle">◆</text>
      <text x="55" y="32" font-family="monospace" font-size="7" fill="#00ffff" text-anchor="middle">LINKEDIN</text>
    </g>
  </g>

  <!-- Card-style platform links -->
  <g transform="translate(300, 45)">
    <!-- GitHub card -->
    <rect x="0" y="0" width="270" height="46" rx="6" fill="#040416" stroke="#00ff88" stroke-width="0.6" class="pulse"/>
    <circle cx="20" cy="23" r="6" fill="#00ff88" class="blk" filter="url(#g)"/>
    <text x="35" y="20" font-family="monospace" font-size="11" fill="#00ff88" font-weight="bold">GITHUB</text>
    <text x="35" y="35" font-family="monospace" font-size="8" fill="#666">@Chenura · 4 Repos</text>
  </g>
  <g transform="translate(300, 105)">
    <rect x="0" y="0" width="270" height="46" rx="6" fill="#040416" stroke="#00ffff" stroke-width="0.6"/>
    <circle cx="20" cy="23" r="6" fill="#00ffff" class="p1"/>
    <text x="35" y="20" font-family="monospace" font-size="11" fill="#00ffff" font-weight="bold">LINKEDIN</text>
    <text x="35" y="35" font-family="monospace" font-size="8" fill="#666">Chenura Gajanayake</text>
  </g>

  <g transform="translate(620, 45)">
    <rect x="0" y="0" width="270" height="46" rx="6" fill="#040416" stroke="#ff003c" stroke-width="0.6"/>
    <circle cx="20" cy="23" r="6" fill="#ff003c" class="blk" filter="url(#g)"/>
    <text x="35" y="20" font-family="monospace" font-size="11" fill="#ff6666" font-weight="bold">YOUTUBE</text>
    <text x="35" y="35" font-family="monospace" font-size="8" fill="#666">@sbchenu · ShadowBeast</text>
  </g>
  <g transform="translate(620, 105)">
    <rect x="0" y="0" width="270" height="46" rx="6" fill="#040416" stroke="#00ff88" stroke-width="0.6"/>
    <circle cx="20" cy="23" r="6" fill="#00ff88" class="p1"/>
    <text x="35" y="20" font-family="monospace" font-size="11" fill="#00ff88" font-weight="bold">PORTFOLIO</text>
    <text x="35" y="35" font-family="monospace" font-size="8" fill="#666">chenura.github.io</text>
  </g>

  <!-- Right side: subscriber / status -->
  <g transform="translate(940, 45)">
    <rect x="0" y="0" width="230" height="106" rx="6" fill="#040416" stroke="#00ff88" stroke-width="0.5"/>
    <text x="15" y="22" font-family="monospace" font-size="10" fill="#00ff88" font-weight="bold">NETWORK STATUS</text>
    <circle cx="15" cy="38" r="3" fill="#00ff88" class="p1"/>
    <text x="25" y="41" font-family="monospace" font-size="9" fill="#888">CONNECTED</text>
    <circle cx="15" cy="55" r="3" fill="#00ff88" class="blk"/>
    <text x="25" y="58" font-family="monospace" font-size="9" fill="#888">SIGNAL: STRONG</text>
    <circle cx="15" cy="72" r="3" fill="#00ffff" class="blk"/>
    <text x="25" y="75" font-family="monospace" font-size="9" fill="#888">NODES: 4 ACTIVE</text>
    <circle cx="210" cy="18" r="4" fill="#00ff88" class="blk"/>
  </g>
</svg>