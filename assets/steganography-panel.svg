<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 190" width="100%" height="auto">
  <defs>
    <filter id="g"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style><![CDATA[
      @keyframes p{0%,100%{filter:drop-shadow(0 0 3px #9d00ff)}50%{filter:drop-shadow(0 0 10px #9d00ff)}}
      @keyframes sc{0%{transform:translateX(-1200px)}100%{transform:translateX(1200px)}}
      @keyframes fk{0%,100%{opacity:0.96}2%{opacity:0.2}4%{opacity:0.96}}
      @keyframes br{0%,100%{opacity:0.3}50%{opacity:0.7}}
      .p{animation:p 2s ease-in-out infinite}
      .sc{animation:sc 4s linear infinite}
      .fk{animation:fk 7s infinite}
      .br{animation:br 4s ease-in-out infinite}
    ]]></style>
  </defs>
  <rect width="1200" height="190" fill="#02020c" rx="6"/>
  <rect x="1" y="1" width="1198" height="188" rx="6" fill="none" stroke="#9d00ff" stroke-width="0.4" opacity="0.1"/>
  <rect class="sc" width="1200" height="1" fill="#9d00ff" opacity="0.04"/>
  <rect class="fk" width="1200" height="190" fill="#000" opacity="0.01" pointer-events="none"/>
  <text x="600" y="20" font-family="monospace" font-size="12" fill="#9d00ff" text-anchor="middle" letter-spacing="2" opacity="0.7">STEGANOGRAPHY TECHNIQUES</text>
  <text x="20" y="32" font-family="monospace" font-size="11" fill="#9d00ff" opacity="0"><animate attributeName="opacity" from="0" to="0.9" dur="0.2s" begin="0.3s" fill="freeze"/></text>
  <text x="20" y="32" font-family="monospace" font-size="11" fill="#9d00ff">$ LSB Image</text>
  <text x="350" y="32" font-family="monospace" font-size="11" fill="#ccc" text-anchor="end">85</text>  <text x="20" y="52" font-family="monospace" font-size="11" fill="#9d00ff" opacity="0"><animate attributeName="opacity" from="0" to="0.9" dur="0.2s" begin="0.35s" fill="freeze"/></text>
  <text x="20" y="52" font-family="monospace" font-size="11" fill="#9d00ff">$ Audio</text>
  <text x="350" y="52" font-family="monospace" font-size="11" fill="#ccc" text-anchor="end">78</text>  <text x="20" y="72" font-family="monospace" font-size="11" fill="#9d00ff" opacity="0"><animate attributeName="opacity" from="0" to="0.9" dur="0.2s" begin="0.4s" fill="freeze"/></text>
  <text x="20" y="72" font-family="monospace" font-size="11" fill="#9d00ff">$ Video</text>
  <text x="350" y="72" font-family="monospace" font-size="11" fill="#ccc" text-anchor="end">72</text>  <text x="20" y="92" font-family="monospace" font-size="11" fill="#9d00ff" opacity="0"><animate attributeName="opacity" from="0" to="0.9" dur="0.2s" begin="0.45s" fill="freeze"/></text>
  <text x="20" y="92" font-family="monospace" font-size="11" fill="#9d00ff">$ Text</text>
  <text x="350" y="92" font-family="monospace" font-size="11" fill="#ccc" text-anchor="end">70</text>  <text x="20" y="112" font-family="monospace" font-size="11" fill="#9d00ff" opacity="0"><animate attributeName="opacity" from="0" to="0.9" dur="0.2s" begin="0.5s" fill="freeze"/></text>
  <text x="20" y="112" font-family="monospace" font-size="11" fill="#9d00ff">$ Network</text>
  <text x="350" y="112" font-family="monospace" font-size="11" fill="#ccc" text-anchor="end">65</text></svg>