    <circle cx="1090" cy="17" r="4" fill="#00ffff" class="blk"/>
  </g>
  <g transform="translate(40, 140)">
    <rect x="0" y="0" width="1120" height="35" rx="6" fill="#040416" stroke="#9d00ff" stroke-width="0.5"/>
    <text x="15" y="23" font-family="monospace" font-size="14" fill="#9d00ff" font-weight="bold">NETWORK RIG</text>
    <text x="180" y="23" font-family="monospace" font-size="14" fill="#888">Dual Router Setup · pfSense · OpenVPN · Pi-Hole · VLAN Segmentation</text>
    <circle cx="1090" cy="17" r="4" fill="#9d00ff" class="blk"/>
  </g>
  <g transform="translate(40, 185)">
    <rect x="0" y="0" width="1120" height="28" rx="4" fill="#060618" stroke="#00ff88" stroke-width="0.4" opacity="0.3"/>
    <text x="15" y="18" font-family="monospace" font-size="13" fill="#555">HARDWARE STATUS: <tspan fill="#00ff88" class="p1">ALL OPERATIONAL</tspan></text>
    <text x="500" y="18" font-family="monospace" font-size="13" fill="#555">LAB ACCESS: <tspan fill="#00ffff" class="br">REMOTE ENABLED</tspan></text>
  </g>
</svg>