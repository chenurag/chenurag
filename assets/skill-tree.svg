<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="100%" height="auto">
  <defs><filter id="g"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style><![CDATA[
      @keyframes drawBranch{0%{stroke-dashoffset:500}100%{stroke-dashoffset:0}}
      @keyframes nodeGlow{0%,100%{r:4;opacity:0.6}50%{r:7;opacity:1}}
      @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
      @keyframes pulse{0%,100%{filter:drop-shadow(0 0 3px)}50%{filter:drop-shadow(0 0 12px)}}
      @keyframes breathe{0%,100%{opacity:0.4}50%{opacity:0.8}}
      @keyframes scan{0%{transform:translateX(-1200px)}100%{transform:translateX(1200px)}}
      @keyframes flick{0%,100%{opacity:0.96}2%{opacity:0.2}4%{opacity:0.96}}
      .db{stroke-dasharray:500;stroke-dashoffset:500;animation:drawBranch 2s ease-out 0.3s both}
      .db2{stroke-dasharray:500;stroke-dashoffset:500;animation:drawBranch 2s ease-out 0.6s both}
      .ng{animation:nodeGlow 2s ease-in-out infinite;transform-origin:0 0}
      .blk{animation:blink 0.8s step-end infinite}.p1{animation:pulse 2s ease-in-out infinite}
      .br{animation:breathe 4s ease-in-out infinite}.sc{animation:scan 4s linear infinite}.fk{animation:flick 7s infinite}
    ]]></style>
  </defs>
  <rect width="1200" height="220" fill="#02020c" rx="8"/>
  <rect x="1" y="1" width="1198" height="218" rx="8" fill="none" stroke="#00ff88" stroke-width="0.5" opacity="0.12"/>
  <rect class="sc" width="1200" height="1" fill="#00ff88" opacity="0.04"/>
  <rect class="fk" width="1200" height="220" fill="#000" opacity="0.01" pointer-events="none"/>
  <text x="600" y="22" font-family="monospace" font-size="10" fill="#00ff88" text-anchor="middle" letter-spacing="2" opacity="0.6">SKILL TREE — BRANCHING PROFICIENCY</text>

  <g transform="translate(600, 130)">
    <!-- Root node -->
    <circle cx="0" cy="0" r="12" fill="#0a1a0a" stroke="#00ff88" stroke-width="2" class="p1"/>
    <text x="0" y="4" font-family="monospace" font-size="10" fill="#00ff88" text-anchor="middle">SH</text>
    
    <!-- Branches -->
    <line x1="0" y1="0" x2="-200" y2="-70" stroke="#00ff88" stroke-width="1.5" class="db" opacity="0.5"/>
    <line x1="0" y1="0" x2="-120" y2="70" stroke="#00ff88" stroke-width="1.5" class="db" opacity="0.5"/>
    <line x1="0" y1="0" x2="150" y2="-80" stroke="#00ffff" stroke-width="1.5" class="db2" opacity="0.5"/>
    <line x1="0" y1="0" x2="180" y2="60" stroke="#00ffff" stroke-width="1.5" class="db2" opacity="0.5"/>
    
    <!-- Branch nodes -->
    <g transform="translate(-200,-70)">
      <circle cx="0" cy="0" r="4" fill="#00ff88" class="ng"/><text x="-40" y="-8" font-family="monospace" font-size="8" fill="#00ff88">Linux</text>
      <line x1="0" y1="0" x2="-50" y2="-30" stroke="#00ff88" stroke-width="0.8" class="db" opacity="0.3"/>
      <circle cx="-50" cy="-30" r="3" fill="#00ff88"/><text x="-85" y="-35" font-family="monospace" font-size="7" fill="#888">Kali</text>
      <line x1="0" y1="0" x2="-40" y2="30" stroke="#00ff88" stroke-width="0.8" class="db" opacity="0.3"/>
      <circle cx="-40" cy="30" r="3" fill="#00ff88"/><text x="-75" y="28" font-family="monospace" font-size="7" fill="#888">Ubuntu</text>
    </g>
    <g transform="translate(-120,70)">
      <circle cx="0" cy="0" r="4" fill="#00ff88" class="ng"/><text x="-50" y="-8" font-family="monospace" font-size="8" fill="#00ff88">Network</text>
      <line x1="0" y1="0" x2="-40" y2="30" stroke="#00ff88" stroke-width="0.8" class="db" opacity="0.3"/>
      <circle cx="-40" cy="30" r="3" fill="#00ff88"/><text x="-75" y="28" font-family="monospace" font-size="7" fill="#888">TCP/IP</text>
    </g>
    <g transform="translate(150,-80)">
      <circle cx="0" cy="0" r="4" fill="#00ffff" class="ng"/><text x="15" y="-8" font-family="monospace" font-size="8" fill="#00ffff">Python</text>
      <line x1="0" y1="0" x2="40" y2="-30" stroke="#00ffff" stroke-width="0.8" class="db2" opacity="0.3"/>
      <circle cx="40" cy="-30" r="3" fill="#00ffff"/><text x="15" y="-35" font-family="monospace" font-size="7" fill="#888">Auto</text>
    </g>
    <g transform="translate(180,60)">
      <circle cx="0" cy="0" r="4" fill="#00ffff" class="ng"/><text x="15" y="-8" font-family="monospace" font-size="8" fill="#00ffff">Security</text>
      <line x1="0" y1="0" x2="40" y2="30" stroke="#00ffff" stroke-width="0.8" class="db2" opacity="0.3"/>
      <circle cx="40" cy="30" r="3" fill="#00ffff"/><text x="15" y="28" font-family="monospace" font-size="7" fill="#888">Pentest</text>
    </g>
  </g>

  <!-- Legend -->
  <g transform="translate(30, 185)">
    <rect x="0" y="0" width="1140" height="26" rx="4" fill="#060618" stroke="#00ff88" stroke-width="0.4" opacity="0.3"/>
    <text x="15" y="17" font-family="monospace" font-size="9" fill="#555">NODES: <tspan fill="#00ff88" class="p1">10 ACTIVE</tspan></text>
    <text x="250" y="17" font-family="monospace" font-size="9" fill="#555">DEPTH: <tspan fill="#00ffff">3 LEVELS</tspan></text>
    <text x="500" y="17" font-family="monospace" font-size="9" fill="#555">ROOT: <tspan fill="#00ff88">SHADOWBEAST CORE</tspan></text>
    <text x="800" y="17" font-family="monospace" font-size="9" fill="#555">LAST GROWTH: <tspan fill="#00ffff">AI BRANCH</tspan></text>
    <circle cx="1105" cy="12" r="3" fill="#00ff88" class="blk"/>
  </g>
</svg>