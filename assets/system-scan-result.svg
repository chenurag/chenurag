<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="100%" height="auto">
  <defs><filter id="g"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style><![CDATA[
      @keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
      @keyframes fillBar{0%{width:0}100%{width:var(--w)}}
      @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}@keyframes pulse{0%,100%{filter:drop-shadow(0 0 4px)}50%{filter:drop-shadow(0 0 14px)}}
      @keyframes breathe{0%,100%{opacity:0.3}50%{opacity:0.7}}@keyframes scan{0%{transform:translateX(-1200px)}100%{transform:translateX(1200px)}}
      .sp{animation:spin 3s linear infinite;transform-origin:50px 50px}
      .fb1{--w:320px;animation:fillBar 2s ease-out 0.2s both}.fb2{--w:260px;animation:fillBar 2s ease-out 0.4s both}
      .fb3{--w:200px;animation:fillBar 2s ease-out 0.6s both}.fb4{--w:140px;animation:fillBar 2s ease-out 0.8s both}
      .blk{animation:blink 0.8s step-end infinite}.p1{animation:pulse 2s ease-in-out infinite}
      .br{animation:breathe 4s ease-in-out infinite}.sc{animation:scan 4s linear infinite}
    ]]></style>
  </defs>
  <rect width="1200" height="240" fill="#02020c" rx="8"/>
  <rect x="1" y="1" width="1198" height="238" rx="8" fill="none" stroke="#00ff88" stroke-width="0.5" opacity="0.12"/>
  <rect class="sc" width="1200" height="1" fill="#00ff88" opacity="0.04"/>
  <text x="600" y="26" font-family="monospace" font-size="15" fill="#00ff88" text-anchor="middle" letter-spacing="2" opacity="0.7">SYSTEM SCAN RESULT — COMPREHENSIVE HEALTH CHECK</text>

  <g transform="translate(100, 140)">
    <g class="sp"><circle cx="50" cy="50" r="45" fill="none" stroke="#00ff88" stroke-width="0.5" opacity="0.15"/></g>
    <circle cx="50" cy="50" r="35" fill="#0a1a0a" stroke="#00ff88" stroke-width="2" class="p1"/>
    <text x="50" y="48" font-family="monospace" font-size="16" fill="#00ff88" text-anchor="middle" class="p1">⚡</text>
    <text x="50" y="68" font-family="monospace" font-size="13" fill="#888" text-anchor="middle">SCAN</text>
  </g>

  <g transform="translate(220, 45)">
    <text x="0" y="18" font-family="monospace" font-size="14" fill="#888">Services Check</text>
    <rect x="160" y="8" width="350" height="14" rx="5" fill="#0a0a1e" stroke="#00ff88" stroke-width="0.3"/>
    <rect x="160" y="8" width="320" height="14" rx="5" fill="#00ff88" opacity="0.7" class="fb1"/>
    <text x="530" y="18" font-family="monospace" font-size="14" fill="#00ff88">32/32 ACTIVE</text>

    <text x="0" y="50" font-family="monospace" font-size="14" fill="#888">Port Scan</text>
    <rect x="160" y="40" width="350" height="14" rx="5" fill="#0a0a1e" stroke="#00ffff" stroke-width="0.3"/>
    <rect x="160" y="40" width="260" height="14" rx="5" fill="#00ffff" opacity="0.6" class="fb2"/>
    <text x="530" y="50" font-family="monospace" font-size="14" fill="#00ffff">65535 PORTS</text>

    <text x="0" y="82" font-family="monospace" font-size="14" fill="#888">Vulnerability Scan</text>
    <rect x="160" y="72" width="350" height="14" rx="5" fill="#0a0a1e" stroke="#ff6600" stroke-width="0.3"/>
    <rect x="160" y="72" width="200" height="14" rx="5" fill="#ff6600" opacity="0.6" class="fb3"/>
    <text x="530" y="82" font-family="monospace" font-size="14" fill="#ff6600">0 CRITICAL</text>

    <text x="0" y="114" font-family="monospace" font-size="14" fill="#888">Outdated Software</text>
    <rect x="160" y="104" width="350" height="14" rx="5" fill="#0a0a1e" stroke="#9d00ff" stroke-width="0.3"/>
    <rect x="160" y="104" width="140" height="14" rx="5" fill="#9d00ff" opacity="0.6" class="fb4"/>
    <text x="530" y="114" font-family="monospace" font-size="14" fill="#9d00ff">2 UPDATES</text>
  </g>

  <g transform="translate(720, 42)">
    <rect x="0" y="0" width="440" height="60" rx="6" fill="#0a1a0a" stroke="#00ff88" stroke-width="1.5" class="p1"/>
    <text x="15" y="24" font-family="monospace" font-size="16" fill="#00ff88" font-weight="bold" class="p1">● ALL SYSTEMS NOMINAL</text>
    <text x="15" y="48" font-family="monospace" font-size="14" fill="#888">SECURITY POSTURE: <tspan fill="#00ff88">STRONG</tspan></text>
    <circle cx="420" cy="18" r="4" fill="#00ff88" class="blk"/>
  </g>
  <g transform="translate(720, 116)">
    <rect x="0" y="0" width="440" height="60" rx="6" fill="#040416" stroke="#00ffff" stroke-width="0.5"/>
    <text x="15" y="24" font-family="monospace" font-size="14" fill="#00ffff" font-weight="bold">LAST FULL SCAN</text>
    <text x="15" y="48" font-family="monospace" font-size="14" fill="#888">TODAY 02:00 — DURATION: 4m 32s</text>
    <circle cx="420" cy="18" r="4" fill="#00ffff" class="blk"/>
  </g>
  <g transform="translate(720, 190)">
    <rect x="0" y="0" width="440" height="36" rx="6" fill="#040416" stroke="#9d00ff" stroke-width="0.5"/>
    <text x="15" y="24" font-family="monospace" font-size="14" fill="#9d00ff">NEXT AUTO-SCAN: <tspan fill="#00ff88">02:00 TOMORROW</tspan></text>
    <circle cx="420" cy="18" r="4" fill="#9d00ff" class="blk"/>
  </g>
</svg>