<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="100%" height="auto">
  <defs><filter id="g"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style><![CDATA[
      @keyframes growPie{0%{stroke-dasharray:0 283}100%{stroke-dasharray:var(--d) 283}}
      @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
      @keyframes pulse{0%,100%{filter:drop-shadow(0 0 3px)}50%{filter:drop-shadow(0 0 12px)}}
      @keyframes breathe{0%,100%{opacity:0.4}50%{opacity:0.8}}
      @keyframes scan{0%{transform:translateX(-1200px)}100%{transform:translateX(1200px)}}
      @keyframes flick{0%,100%{opacity:0.96}2%{opacity:0.2}4%{opacity:0.96}}
      .gp1{--d:130;stroke-dasharray:283;stroke-dashoffset:283;animation:growPie 2s ease-out 0.2s forwards}
      .gp2{--d:90;stroke-dasharray:283;stroke-dashoffset:283;animation:growPie 2s ease-out 0.4s forwards}
      .gp3{--d:40;stroke-dasharray:283;stroke-dashoffset:283;animation:growPie 2s ease-out 0.6s forwards}
      .blk{animation:blink 0.8s step-end infinite}.p1{animation:pulse 2s ease-in-out infinite}
      .br{animation:breathe 4s ease-in-out infinite}.sc{animation:scan 4s linear infinite}.fk{animation:flick 7s infinite}
    ]]></style>
  </defs>
  <rect width="1200" height="200" fill="#02020c" rx="8"/>
  <rect x="1" y="1" width="1198" height="198" rx="8" fill="none" stroke="#00ff88" stroke-width="0.5" opacity="0.12"/>
  <rect class="sc" width="1200" height="1" fill="#00ff88" opacity="0.04"/>
  <rect class="fk" width="1200" height="200" fill="#000" opacity="0.01" pointer-events="none"/>
  <text x="600" y="22" font-family="monospace" font-size="10" fill="#00ff88" text-anchor="middle" letter-spacing="2" opacity="0.6">OS USAGE DISTRIBUTION — PLATFORM BREAKDOWN</text>

  <g transform="translate(130, 105)">
    <circle cx="0" cy="0" r="45" fill="none" stroke="#112" stroke-width="18"/>
    <circle cx="0" cy="0" r="45" fill="none" stroke="#00ff88" stroke-width="18" class="gp1" stroke-linecap="round" transform="rotate(-90)"/>
    <circle cx="0" cy="0" r="45" fill="none" stroke="#00ffff" stroke-width="18" class="gp2" stroke-linecap="round" transform="rotate(-90)" stroke-dashoffset="-130"/>
    <circle cx="0" cy="0" r="45" fill="none" stroke="#ff6600" stroke-width="18" class="gp3" stroke-linecap="round" transform="rotate(-90)" stroke-dashoffset="-220"/>
    <text x="0" y="5" font-family="monospace" font-size="14" fill="#00ff88" text-anchor="middle" font-weight="bold">5</text>
    <text x="0" y="75" font-family="monospace" font-size="8" fill="#888" text-anchor="middle">PLATFORMS</text>
  </g>

  <g transform="translate(280, 45)">
    <rect x="0" y="0" width="12" height="12" rx="3" fill="#00ff88"/><text x="18" y="10" font-family="monospace" font-size="9" fill="#00ff88">Kali Linux 46%</text>
    <rect x="200" y="0" width="12" height="12" rx="3" fill="#00ffff"/><text x="218" y="10" font-family="monospace" font-size="9" fill="#00ffff">Ubuntu 32%</text>
    <rect x="0" y="22" width="12" height="12" rx="3" fill="#ff6600"/><text x="18" y="32" font-family="monospace" font-size="9" fill="#ff6600">Arch 14%</text>
    <rect x="200" y="22" width="12" height="12" rx="3" fill="#9d00ff"/><text x="218" y="32" font-family="monospace" font-size="9" fill="#9d00ff">Debian 5%</text>
    <rect x="0" y="44" width="12" height="12" rx="3" fill="#ff003c"/><text x="18" y="54" font-family="monospace" font-size="9" fill="#ff003c">Windows 3%</text>
  </g>

  <!-- Bars -->
  <g transform="translate(280, 80)">
    <text x="0" y="12" font-family="monospace" font-size="8" fill="#888">Kali</text>
    <rect x="50" y="2" width="400" height="10" rx="3" fill="#0a0a1e" stroke="#00ff88" stroke-width="0.3"/>
    <rect x="50" y="2" width="184" height="10" rx="3" fill="#00ff88" opacity="0.7" class="p1"><animate attributeName="width" values="0;184" dur="2s" fill="freeze"/></rect>
    <text x="460" y="12" font-family="monospace" font-size="9" fill="#00ff88">46%</text>
    
    <text x="0" y="30" font-family="monospace" font-size="8" fill="#888">Ubuntu</text>
    <rect x="50" y="20" width="400" height="10" rx="3" fill="#0a0a1e" stroke="#00ffff" stroke-width="0.3"/>
    <rect x="50" y="20" width="128" height="10" rx="3" fill="#00ffff" opacity="0.6"><animate attributeName="width" values="0;128" dur="2s" fill="freeze"/></rect>
    <text x="460" y="30" font-family="monospace" font-size="9" fill="#00ffff">32%</text>

    <text x="0" y="48" font-family="monospace" font-size="8" fill="#888">Arch</text>
    <rect x="50" y="38" width="400" height="10" rx="3" fill="#0a0a1e" stroke="#ff6600" stroke-width="0.3"/>
    <rect x="50" y="38" width="56" height="10" rx="3" fill="#ff6600" opacity="0.6"><animate attributeName="width" values="0;56" dur="2s" fill="freeze"/></rect>
    <text x="460" y="48" font-family="monospace" font-size="9" fill="#ff6600">14%</text>
  </g>

  <!-- Right stats -->
  <g transform="translate(850, 45)">
    <rect x="0" y="0" width="320" height="50" rx="6" fill="#040416" stroke="#00ff88" stroke-width="0.5"/>
    <text x="15" y="20" font-family="monospace" font-size="10" fill="#888">PRIMARY OS</text>
    <text x="15" y="42" font-family="monospace" font-size="16" fill="#00ff88" class="p1">Kali Linux 2026</text>
    <circle cx="305" cy="15" r="3" fill="#00ff88" class="blk"/>
  </g>
  <g transform="translate(850, 105)">
    <rect x="0" y="0" width="320" height="50" rx="6" fill="#040416" stroke="#00ffff" stroke-width="0.5"/>
    <text x="15" y="20" font-family="monospace" font-size="10" fill="#888">AVG DAILY USAGE</text>
    <text x="15" y="42" font-family="monospace" font-size="16" fill="#00ffff" class="br">12h 34m</text>
    <circle cx="305" cy="15" r="3" fill="#00ffff" class="blk"/>
  </g>
</svg>