<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="auto">
  <defs>
    <filter id="g"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      @keyframes p1{0%,100%{opacity:0.5;filter:drop-shadow(0 0 4px var(--c))}50%{opacity:1;filter:drop-shadow(0 0 15px var(--c))}}
      @keyframes p2{0%,100%{opacity:0.3}50%{opacity:0.9}}
      @keyframes p3{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
      @keyframes p4{0%,100%{opacity:0.4}50%{opacity:0.8}}
      @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
      @keyframes breathe{0%,100%{opacity:0.3}50%{opacity:0.7}}
      @keyframes scan{0%{transform:translateX(-1200px)}100%{transform:translateX(1200px)}}
      @keyframes flick{0%,100%{opacity:0.97}2%{opacity:0.2}4%{opacity:0.97}8%{opacity:0.5}10%{opacity:0.97}}
      @keyframes grow{0%{height:0}100%{height:100%}}
      @keyframes glow{0%,100%{stop-color:#00ff88}50%{stop-color:#00ffff}}
      
      .p1{animation:p1 2s ease-in-out infinite}
      .p2{animation:p2 3s ease-in-out infinite}
      .p3{animation:p3 3s ease-in-out infinite}
      .p4{animation:p4 2.5s ease-in-out infinite}
      .blk{animation:blink 0.8s step-end infinite}
      .br{animation:breathe 4s ease-in-out infinite}
      .sc{animation:scan 4s linear infinite}
      .fk{animation:flick 6s infinite}
    </style>
  </defs>

  <rect width="1200" height="420" fill="#03030e" rx="8"/>
