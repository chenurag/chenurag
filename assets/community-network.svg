    <a href="https://chenura.github.io/"><g transform="translate(120,60)"><rect x="-50" y="-22" width="100" height="44" rx="6" fill="#0a0a1e" stroke="#00ff88" stroke-width="0.8"/><text x="0" y="0" font-family="monospace" font-size="14" fill="#00ff88" text-anchor="middle" class="p1">◈ WEB</text><text x="0" y="16" font-family="monospace" font-size="11" fill="#888" text-anchor="middle">Portfolio</text><circle cx="40" cy="-10" r="3" fill="#00ff88" class="blk"/></g></a>
  </g>

  <g transform="translate(60, 200)">
    <rect x="0" y="0" width="500" height="36" rx="4" fill="#060618" stroke="#00ff88" stroke-width="0.4" opacity="0.3"/>
    <text x="15" y="23" font-family="monospace" font-size="14" fill="#555">NODES: <tspan fill="#00ff88" class="p1">4 ACTIVE</tspan></text>
    <text x="200" y="23" font-family="monospace" font-size="14" fill="#555">NETWORK: <tspan fill="#00ffff">MESH</tspan></text>
    <text x="400" y="23" font-family="monospace" font-size="14" fill="#555">SIGNAL: <tspan fill="#00ff88" class="blk">FULL</tspan></text>
