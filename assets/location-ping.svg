<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="100%" height="auto">
  <defs>
    <filter id="g"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style><![CDATA[

      @keyframes ping{0%{r:5;opacity:0.9}100%{r:60;opacity:0}}
      @keyframes ping2{0%{r:5;opacity:0.7}100%{r:80;opacity:0}}
      @keyframes pulse{0%,100%{opacity:0.5;filter:drop-shadow(0 0 4px #00ff88)}50%{opacity:1;filter:drop-shadow(0 0 14px #00ff88)}}
      @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
      @keyframes breathe{0%,100%{opacity:0.4}50%{opacity:0.8}}
      @keyframes scan{0%{transform:translateX(-1200px)}100%{transform:translateX(1200px)}}
      @keyframes flick{0%,100%{opacity:0.96}2%{opacity:0.2}4%{opacity:0.96}}
      @keyframes wave{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
      
      .pg{animation:ping 2.5s ease-out infinite}
      .pg2{animation:ping2 3.5s ease-out 1s infinite}
      .p1{animation:pulse 2s ease-in-out infinite}
      .blk{animation:blink 0.8s step-end infinite}
      .br{animation:breathe 4s ease-in-out infinite}
      .sc{animation:scan 4s linear infinite}
      .fk{animation:flick 7s infinite}
      .wv{animation:wave 3s ease-in-out infinite}
    
]]></style>
  </defs>

  <rect width="1200" height="200" fill="#02020c" rx="8"/>
  <rect x="1" y="1" width="1198" height="198" rx="8" fill="none" stroke="#00ff88" stroke-width="0.5" opacity="0.12"/>
  <rect class="sc" width="1200" height="1" fill="#00ff88" opacity="0.04"/>
  <rect class="fk" width="1200" height="200" fill="#000" opacity="0.01" pointer-events="none"/>

  <text x="600" y="22" font-family="monospace" font-size="10" fill="#00ff88" text-anchor="middle" letter-spacing="2" opacity="0.6">📍 OPERATIONS BASE — LOCATION PING</text>

  <!-- Map grid -->
  <g transform="translate(30, 40)">
    <!-- Grid lines -->
    <g stroke="#00ff88" stroke-width="0.15" opacity="0.06">
      <line x1="0" y1="30" x2="600" y2="30"/><line x1="0" y1="60" x2="600" y2="60"/>
      <line x1="0" y1="90" x2="600" y2="90"/><line x1="0" y1="120" x2="600" y2="120"/>
      <line x1="100" y1="0" x2="100" y2="150"/><line x1="200" y1="0" x2="200" y2="150"/>
      <line x1="300" y1="0" x2="300" y2="150"/><line x1="400" y1="0" x2="400" y2="150"/>
      <line x1="500" y1="0" x2="500" y2="150"/>
    </g>

    <!-- Rough Sri Lanka outline -->
    <path d="M320,20 Q350,15 370,28 Q390,42 385,60 Q380,80 360,95 Q340,105 320,110 Q300,105 290,90 Q280,70 285,50 Q290,30 320,20 Z"
          fill="#0a3a1e" fill-opacity="0.4" stroke="#00ff88" stroke-width="1.5" class="p1"/>

    <!-- Ping location -->
    <circle cx="340" cy="65" r="60" fill="none" stroke="#00ff88" class="pg" stroke-width="1.5"/>
    <circle cx="340" cy="65" r="80" fill="none" stroke="#00ffff" class="pg2" stroke-width="1"/>
    <circle cx="340" cy="65" r="6" fill="#ff003c" class="p1" filter="url(#g)"/>

    <!-- Coordinates -->
    <text x="340" y="135" font-family="monospace" font-size="9" fill="#00ff88" text-anchor="middle" class="br">7.8731° N, 80.7718° E</text>
    <text x="340" y="150" font-family="monospace" font-size="9" fill="#00ffff" text-anchor="middle" class="br">SRI LANKA</text>
  </g>

  <!-- Timezone + status cards -->
  <g transform="translate(680, 45)">
    <rect x="0" y="0" width="230" height="55" rx="6" fill="#040416" stroke="#00ff88" stroke-width="0.5"/>
    <text x="15" y="20" font-family="monospace" font-size="8" fill="#888">LOCAL TIME (IST +5:30)</text>
    <text x="15" y="42" font-family="monospace" font-size="16" fill="#00ff88" class="p1">
      <tspan><animate attributeName="values" values="00:00;06:00;12:00;18:00;23:59" dur="10s" repeatCount="indefinite"/>14:32</tspan>
    </text>
    <circle cx="210" cy="18" r="4" fill="#00ff88" class="blk"/>
  </g>

  <g transform="translate(680, 115)">
    <rect x="0" y="0" width="230" height="55" rx="6" fill="#040416" stroke="#00ffff" stroke-width="0.5"/>
    <text x="15" y="20" font-family="monospace" font-size="8" fill="#888">ACTIVE HOURS</text>
    <text x="15" y="42" font-family="monospace" font-size="16" fill="#00ffff" class="br">22:00 — 06:00</text>
    <circle cx="210" cy="18" r="4" fill="#00ffff" class="blk"/>
  </g>

  <g transform="translate(940, 45)">
    <rect x="0" y="0" width="230" height="55" rx="6" fill="#040416" stroke="#9d00ff" stroke-width="0.5"/>
    <text x="15" y="20" font-family="monospace" font-size="8" fill="#888">OPERATING TIMEZONE</text>
    <text x="15" y="42" font-family="monospace" font-size="16" fill="#9d00ff" class="p1">UTC+5:30</text>
    <circle cx="210" cy="18" r="4" fill="#9d00ff" class="blk"/>
  </g>

  <g transform="translate(940, 115)">
    <rect x="0" y="0" width="230" height="55" rx="6" fill="#040416" stroke="#ff6600" stroke-width="0.5"/>
    <text x="15" y="20" font-family="monospace" font-size="8" fill="#888">STATUS</text>
    <text x="15" y="42" font-family="monospace" font-size="16" fill="#ff6600" class="blk">● ONLINE</text>
    <circle cx="210" cy="18" r="4" fill="#ff6600" class="blk"/>
  </g>

  <!-- Bottom note -->
  <text x="600" y="180" font-family="monospace" font-size="8" fill="#444" text-anchor="middle" class="br">BASE OF OPERATIONS :: SECURING FROM THE INDIAN OCEAN</text>
</svg>