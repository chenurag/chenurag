<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="100%" height="auto">
  <defs>
    <filter id="g"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style><![CDATA[

      @keyframes drawLine{0%{stroke-dashoffset:1000}100%{stroke-dashoffset:0}}
      @keyframes pulse{0%,100%{opacity:0.5;filter:drop-shadow(0 0 4px)}50%{opacity:1;filter:drop-shadow(0 0 14px)}}
      @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
      @keyframes breathe{0%,100%{opacity:0.3}50%{opacity:0.7}}
      @keyframes scan{0%{transform:translateX(-1200px)}100%{transform:translateX(1200px)}}
      @keyframes flick{0%,100%{opacity:0.96}2%{opacity:0.2}4%{opacity:0.96}}
      @keyframes radar{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
      @keyframes fillGauge{0%{stroke-dasharray:0 283}100%{stroke-dasharray:255 283}}
      @keyframes fillGauge2{0%{stroke-dasharray:0 283}100%{stroke-dasharray:226 283}}
      @keyframes fillGauge3{0%{stroke-dasharray:0 283}100%{stroke-dasharray:198 283}}
      @keyframes fillGauge4{0%{stroke-dasharray:0 283}100%{stroke-dasharray:170 283}}
      @keyframes fillGauge5{0%{stroke-dasharray:0 283}100%{stroke-dasharray:141 283}}

      .dl{stroke-dasharray:1000;stroke-dashoffset:1000;animation:drawLine 3s ease-out 0.5s both}
      .p1{animation:pulse 2s ease-in-out infinite}
      .blk{animation:blink 0.8s step-end infinite}
      .br{animation:breathe 4s ease-in-out infinite}
      .sc{animation:scan 4s linear infinite}
      .fk{animation:flick 7s infinite}
      .rd{animation:radar 5s linear infinite;transform-origin:200px 200px}
      .fg1{stroke-dasharray:283;stroke-dashoffset:283;animation:fillGauge 2s ease-out 0.3s forwards}
      .fg2{stroke-dasharray:283;stroke-dashoffset:283;animation:fillGauge2 2s ease-out 0.5s forwards}
      .fg3{stroke-dasharray:283;stroke-dashoffset:283;animation:fillGauge3 2s ease-out 0.7s forwards}
      .fg4{stroke-dasharray:283;stroke-dashoffset:283;animation:fillGauge4 2s ease-out 0.9s forwards}
      .fg5{stroke-dasharray:283;stroke-dashoffset:283;animation:fillGauge5 2s ease-out 1.1s forwards}
    
]]></style>
  </defs>

  <rect width="1200" height="260" fill="#02020c" rx="8"/>
  <rect x="1" y="1" width="1198" height="258" rx="8" fill="none" stroke="#00ff88" stroke-width="0.5" opacity="0.12"/>
  <rect class="sc" width="1200" height="1" fill="#00ff88" opacity="0.04"/>
  <rect class="fk" width="1200" height="260" fill="#000" opacity="0.01" pointer-events="none"/>

  <text x="600" y="22" font-family="monospace" font-size="10" fill="#00ff88" text-anchor="middle" letter-spacing="2" opacity="0.6">🎯 SKILL RADAR — SELF-DRAWING PROFICIENCY CHART</text>

  <!-- Radar / Spider Chart -->
  <g transform="translate(350, 135)">
    <!-- Background hex -->
    <polygon points="0,-120 104,-60 104,60 0,120 -104,60 -104,-60" fill="#060618" stroke="#00ff88" stroke-width="0.3" opacity="0.2"/>
    <!-- Inner ring -->
    <polygon points="0,-60 52,-30 52,30 0,60 -52,30 -52,-30" fill="none" stroke="#00ff88" stroke-width="0.3" opacity="0.15"/>
    <!-- Axes -->
    <line x1="0" y1="0" x2="0" y2="-120" stroke="#00ff88" stroke-width="0.5" opacity="0.3"/>
    <line x1="0" y1="0" x2="104" y2="-60" stroke="#00ff88" stroke-width="0.5" opacity="0.3"/>
    <line x1="0" y1="0" x2="104" y2="60" stroke="#00ff88" stroke-width="0.5" opacity="0.3"/>
    <line x1="0" y1="0" x2="0" y2="120" stroke="#00ff88" stroke-width="0.5" opacity="0.3"/>
    <line x1="0" y1="0" x2="-104" y2="60" stroke="#00ff88" stroke-width="0.5" opacity="0.3"/>
    <line x1="0" y1="0" x2="-104" y2="-60" stroke="#00ff88" stroke-width="0.5" opacity="0.3"/>
    
    <!-- Data polygon (draws itself) -->
    <polygon points="0,-110 93,-50 100,50 0,105 -93,55 -100,-50" fill="#00ff88" fill-opacity="0.08" stroke="#00ff88" stroke-width="1.5" class="dl"/>
    
    <!-- Data points -->
    <circle cx="0" cy="-110" r="4" fill="#00ff88" class="p1" filter="url(#g)"/>
    <circle cx="93" cy="-50" r="4" fill="#00ffff" class="p1"/>
    <circle cx="100" cy="50" r="4" fill="#ff6600" class="p1"/>
    <circle cx="0" cy="105" r="4" fill="#9d00ff" class="p1"/>
    <circle cx="-93" cy="55" r="4" fill="#ff003c" class="p1"/>
    <circle cx="-100" cy="-50" r="4" fill="#00ff88" class="p1"/>

    <!-- Labels -->
    <text x="0" y="-135" font-family="monospace" font-size="9" fill="#00ff88" text-anchor="middle">🐧 LINUX 90%</text>
    <text x="130" y="-55" font-family="monospace" font-size="9" fill="#00ffff" text-anchor="middle">🌐 NETWORK 85%</text>
    <text x="135" y="60" font-family="monospace" font-size="9" fill="#ff6600" text-anchor="middle">🔐 SECURITY 70%</text>
    <text x="0" y="140" font-family="monospace" font-size="9" fill="#9d00ff" text-anchor="middle">🤖 AI 60%</text>
    <text x="-130" y="65" font-family="monospace" font-size="9" fill="#ff003c" text-anchor="middle">☁️ CLOUD 55%</text>
    <text x="-135" y="-55" font-family="monospace" font-size="9" fill="#00ff88" text-anchor="middle">🐍 PYTHON 85%</text>
  </g>

  <!-- Side stats -->
  <g transform="translate(30, 50)">
    <text x="0" y="18" font-family="monospace" font-size="10" fill="#888">OVERALL PROFICIENCY</text>
    <rect x="0" y="28" width="200" height="14" rx="4" fill="#0a0a1e" stroke="#00ff88" stroke-width="0.3"/>
    <rect x="0" y="28" width="160" height="14" rx="4" fill="url(#g)" opacity="0.7">
      <animate attributeName="width" values="0;160" dur="2s" fill="freeze"/>
    </rect>
    <text x="210" y="40" font-family="monospace" font-size="11" fill="#00ff88" font-weight="bold">74%</text>

    <text x="0" y="72" font-family="monospace" font-size="10" fill="#888">SKILL VERIFICATION</text>
    <rect x="0" y="82" width="200" height="14" rx="4" fill="#0a0a1e" stroke="#00ff88" stroke-width="0.3"/>
    <rect x="0" y="82" width="140" height="14" rx="4" fill="#00ffff" opacity="0.6">
      <animate attributeName="width" values="0;140" dur="2s" fill="freeze"/>
    </rect>
    <text x="210" y="94" font-family="monospace" font-size="11" fill="#00ffff" font-weight="bold">64%</text>

    <text x="0" y="128" font-family="monospace" font-size="10" fill="#888">REAL-WORLD APPLIED</text>
    <rect x="0" y="138" width="200" height="14" rx="4" fill="#0a0a1e" stroke="#00ff88" stroke-width="0.3"/>
    <rect x="0" y="138" width="120" height="14" rx="4" fill="#ff6600" opacity="0.6">
      <animate attributeName="width" values="0;120" dur="2s" fill="freeze"/>
    </rect>
    <text x="210" y="150" font-family="monospace" font-size="11" fill="#ff6600" font-weight="bold">55%</text>

    <!-- Separator -->
    <line x1="0" y1="175" x2="280" y2="175" stroke="#00ff88" stroke-width="0.3" opacity="0.1"/>

    <text x="0" y="195" font-family="monospace" font-size="9" fill="#555">CORE FOCUS AREA</text>
    <text x="0" y="215" font-family="monospace" font-size="9" fill="#00ff88" class="br">DEFENSIVE SECURITY</text>
  </g>

  <!-- Right side gauge rings -->
  <g transform="translate(850, 50)">
    <text x="60" y="0" font-family="monospace" font-size="9" fill="#888" text-anchor="middle">SKILL DISTRIBUTION</text>
    
    <!-- Ring gauges -->
    <g transform="translate(30, 30)">
      <circle cx="0" cy="0" r="30" fill="none" stroke="#112" stroke-width="8"/>
      <circle cx="0" cy="0" r="30" fill="none" stroke="#00ff88" stroke-width="8" class="fg1" stroke-linecap="round" transform="rotate(-90)"/>
      <text x="0" y="5" font-family="monospace" font-size="12" fill="#00ff88" text-anchor="middle" font-weight="bold">90%</text>
      <text x="0" y="45" font-family="monospace" font-size="8" fill="#888" text-anchor="middle">Linux</text>
    </g>
    <g transform="translate(160, 30)">
      <circle cx="0" cy="0" r="30" fill="none" stroke="#112" stroke-width="8"/>
      <circle cx="0" cy="0" r="30" fill="none" stroke="#00ffff" stroke-width="8" class="fg2" stroke-linecap="round" transform="rotate(-90)"/>
      <text x="0" y="5" font-family="monospace" font-size="12" fill="#00ffff" text-anchor="middle" font-weight="bold">80%</text>
      <text x="0" y="45" font-family="monospace" font-size="8" fill="#888" text-anchor="middle">Network</text>
    </g>
    <g transform="translate(290, 30)">
      <circle cx="0" cy="0" r="30" fill="none" stroke="#112" stroke-width="8"/>
      <circle cx="0" cy="0" r="30" fill="none" stroke="#ff6600" stroke-width="8" class="fg3" stroke-linecap="round" transform="rotate(-90)"/>
      <text x="0" y="5" font-family="monospace" font-size="12" fill="#ff6600" text-anchor="middle" font-weight="bold">70%</text>
      <text x="0" y="45" font-family="monospace" font-size="8" fill="#888" text-anchor="middle">Security</text>
    </g>
    <g transform="translate(30, 120)">
      <circle cx="0" cy="0" r="30" fill="none" stroke="#112" stroke-width="8"/>
      <circle cx="0" cy="0" r="30" fill="none" stroke="#9d00ff" stroke-width="8" class="fg4" stroke-linecap="round" transform="rotate(-90)"/>
      <text x="0" y="5" font-family="monospace" font-size="12" fill="#9d00ff" text-anchor="middle" font-weight="bold">60%</text>
      <text x="0" y="45" font-family="monospace" font-size="8" fill="#888" text-anchor="middle">AI/ML</text>
    </g>
    <g transform="translate(160, 120)">
      <circle cx="0" cy="0" r="30" fill="none" stroke="#112" stroke-width="8"/>
      <circle cx="0" cy="0" r="30" fill="none" stroke="#ff9900" stroke-width="8" class="fg5" stroke-linecap="round" transform="rotate(-90)"/>
      <text x="0" y="5" font-family="monospace" font-size="12" fill="#ff9900" text-anchor="middle" font-weight="bold">50%</text>
      <text x="0" y="45" font-family="monospace" font-size="8" fill="#888" text-anchor="middle">Cloud</text>
    </g>
  </g>
</svg>