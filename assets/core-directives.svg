<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 140" width="100%" height="auto">
  <defs>
    <filter id="g"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#00ff88"/><stop offset="50%" stop-color="#00ffff"/><stop offset="100%" stop-color="#00ff88"/></linearGradient>
    <style>
      @keyframes p1{0%,100%{opacity:0.5;filter:drop-shadow(0 0 4px #00ff88)}50%{opacity:1;filter:drop-shadow(0 0 15px #00ff88)}}
      @keyframes p2{0%,100%{opacity:0.3}50%{opacity:0.9}}
      @keyframes p3{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
      @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
      @keyframes breathe{0%,100%{opacity:0.4}50%{opacity:0.8}}
      @keyframes scan{0%{transform:translateX(-1200px)}100%{transform:translateX(1200px)}}
      @keyframes flick{0%,100%{opacity:0.96}2%{opacity:0.2}4%{opacity:0.96}8%{opacity:0.6}10%{opacity:0.96}}
      @keyframes dash{0%{stroke-dashoffset:2000}100%{stroke-dashoffset:0}}
      @keyframes blip{0%{transform:translateX(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateX(180px);opacity:0}}
      
      .p1{animation:p1 2s ease-in-out infinite}
      .p2{animation:p2 3s ease-in-out infinite}
      .p3{animation:p3 2.5s ease-in-out infinite}
      .blk{animation:blink 0.8s step-end infinite}
      .br{animation:breathe 4s ease-in-out infinite}
      .sc{animation:scan 4.5s linear infinite}
      .fk{animation:flick 7s infinite}
      .dash{stroke-dasharray:2000;stroke-dashoffset:2000;animation:dash 2.5s ease-out 0.3s both}
      .bp{animation:blip 2.5s linear infinite}
    </style>
  </defs>

  <rect width="1200" height="140" fill="#03030e" rx="8"/>
  <rect x="1" y="1" width="1198" height="138" rx="8" fill="none" stroke="#00ff88" stroke-width="0.5" opacity="0.1"/>
  <rect class="sc" width="1200" height="1" fill="url(#flow)" opacity="0.05"/>
  <rect class="fk" width="1200" height="140" fill="#000" opacity="0.01" pointer-events="none"/>

  <text x="600" y="22" font-family="monospace" font-size="10" fill="#00ff88" text-anchor="middle" letter-spacing="2" opacity="0.6">⚡ OPERATIONAL DIRECTIVES — CORE PROTOCOLS</text>

  <!-- 6 directive chips -->
  <g transform="translate(20, 38)">
    <!-- LEARN -->
    <rect x="0" y="0" width="175" height="42" rx="5" fill="#0a0a1e" stroke="#00ff88" stroke-width="0.8"/>
    <circle cx="15" cy="21" r="4" fill="#00ff88" class="p1" filter="url(#g)"/>
    <text x="28" y="18" font-family="monospace" font-size="10" fill="#00ff88" font-weight="bold">LEARN</text>
    <text x="28" y="33" font-family="monospace" font-size="7" fill="#666">understand the system</text>

    <!-- connector 1 -->
    <line x1="182" y1="21" x2="197" y2="21" stroke="#00ff88" stroke-width="1" class="dash"/>
    <circle cx="190" cy="21" r="2.5" fill="#00ffff" class="bp"/>

    <!-- BUILD -->
    <rect x="200" y="0" width="175" height="42" rx="5" fill="#0a0a1e" stroke="#00ffff" stroke-width="0.8"/>
    <circle cx="215" cy="21" r="4" fill="#00ffff" class="p2"/>
    <text x="228" y="18" font-family="monospace" font-size="10" fill="#00ffff" font-weight="bold">BUILD</text>
    <text x="228" y="33" font-family="monospace" font-size="7" fill="#666">create the tools</text>

    <line x1="382" y1="21" x2="397" y2="21" stroke="#00ffff" stroke-width="1" class="dash"/>
    <circle cx="390" cy="21" r="2.5" fill="#00ff88" class="bp"/>

    <!-- TEST -->
    <rect x="400" y="0" width="175" height="42" rx="5" fill="#0a0a1e" stroke="#ff003c" stroke-width="0.8"/>
    <circle cx="415" cy="21" r="4" fill="#ff003c" class="p1" filter="url(#g)"/>
    <text x="428" y="18" font-family="monospace" font-size="10" fill="#ff6666" font-weight="bold">TEST</text>
    <text x="428" y="33" font-family="monospace" font-size="7" fill="#666">break the assumptions</text>

    <line x1="582" y1="21" x2="597" y2="21" stroke="#ff003c" stroke-width="1" class="dash"/>
    <circle cx="590" cy="21" r="2.5" fill="#00ffff" class="bp"/>

    <!-- UNDERSTAND -->
    <rect x="600" y="0" width="175" height="42" rx="5" fill="#0a0a1e" stroke="#9d00ff" stroke-width="0.8"/>
    <circle cx="615" cy="21" r="4" fill="#9d00ff" class="p2"/>
    <text x="628" y="18" font-family="monospace" font-size="10" fill="#9d00ff" font-weight="bold">UNDERSTAND</text>
    <text x="628" y="33" font-family="monospace" font-size="7" fill="#666">map every layer</text>

    <line x1="782" y1="21" x2="797" y2="21" stroke="#9d00ff" stroke-width="1" class="dash"/>
    <circle cx="790" cy="21" r="2.5" fill="#ff003c" class="bp"/>

    <!-- DEFEND -->
    <rect x="800" y="0" width="175" height="42" rx="5" fill="#0a0a1e" stroke="#00ff88" stroke-width="0.8"/>
    <circle cx="815" cy="21" r="4" fill="#00ff88" class="p1" filter="url(#g)"/>
    <text x="828" y="18" font-family="monospace" font-size="10" fill="#00ff88" font-weight="bold">DEFEND</text>
    <text x="828" y="33" font-family="monospace" font-size="7" fill="#666">harden &amp; secure</text>

    <line x1="982" y1="21" x2="997" y2="21" stroke="#00ff88" stroke-width="1" class="dash"/>
    <circle cx="990" cy="21" r="2.5" fill="#9d00ff" class="bp"/>

    <!-- AUTOMATE -->
    <rect x="1000" y="0" width="175" height="42" rx="5" fill="#0a1a0a" stroke="#00ff88" stroke-width="1.5" class="p3"/>
    <circle cx="1015" cy="21" r="5" fill="#00ff88" class="p1" filter="url(#g)"/>
    <text x="1028" y="18" font-family="monospace" font-size="10" fill="#00ff88" font-weight="bold">AUTOMATE</text>
    <text x="1028" y="33" font-family="monospace" font-size="7" fill="#888">repeat flawlessly</text>
  </g>

  <!-- Secondary directive line -->
  <g transform="translate(20, 95)">
    <text x="0" y="12" font-family="monospace" font-size="8" fill="#555">SECONDARY:</text>
    <text x="100" y="12" font-family="monospace" font-size="8" fill="#00ff88" class="br">DISCOVER → ENUMERATE → ANALYZE → EXPLOIT → PATCH → HARDEN</text>
    <text x="700" y="12" font-family="monospace" font-size="8" fill="#555">TERTIARY:</text>
    <text x="770" y="12" font-family="monospace" font-size="8" fill="#00ffff" class="br">RESEARCH → DEVELOP → DEPLOY → MONITOR → ITERATE → EVOLVE</text>
  </g>
</svg>