<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="100%" height="auto">
  <defs><filter id="g"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#00ff88"/><stop offset="50%" stop-color="#00ffff"/><stop offset="100%" stop-color="#00ff88"/></linearGradient>
    <style><![CDATA[
      @keyframes p1{0%,100%{opacity:0.5;filter:drop-shadow(0 0 4px #00ff88)}50%{opacity:1;filter:drop-shadow(0 0 15px #00ff88)}}
      @keyframes p2{0%,100%{opacity:0.3}50%{opacity:0.9}}
      @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}@keyframes breathe{0%,100%{opacity:0.4}50%{opacity:0.8}}
      @keyframes scan{0%{transform:translateX(-1200px)}100%{transform:translateX(1200px)}}
      @keyframes flick{0%,100%{opacity:0.96}2%{opacity:0.2}4%{opacity:0.96}}
      @keyframes dash{0%{stroke-dashoffset:2000}100%{stroke-dashoffset:0}}
      @keyframes blip{0%{transform:translateX(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateX(180px);opacity:0}}
      .p1{animation:p1 2s ease-in-out infinite}.p2{animation:p2 3s ease-in-out infinite}.blk{animation:blink 0.8s step-end infinite}
      .br{animation:breathe 4s ease-in-out infinite}.sc{animation:scan 4.5s linear infinite}.fk{animation:flick 7s infinite}
      .dash{stroke-dasharray:2000;stroke-dashoffset:2000;animation:dash 2.5s ease-out 0.3s both}.bp{animation:blip 2.5s linear infinite}
    ]]></style>
  </defs>
  <rect width="1200" height="220" fill="#03030e" rx="8"/>
  <rect x="1" y="1" width="1198" height="218" rx="8" fill="none" stroke="#00ff88" stroke-width="0.5" opacity="0.1"/>
  <rect class="sc" width="1200" height="1" fill="url(#flow)" opacity="0.05"/>
  <rect class="fk" width="1200" height="220" fill="#000" opacity="0.01" pointer-events="none"/>
  <text x="600" y="24" font-family="monospace" font-size="15" fill="#00ff88" text-anchor="middle" letter-spacing="2" opacity="0.7">⚡ OPERATIONAL DIRECTIVES — CORE PROTOCOLS</text>

  <g transform="translate(16, 45)">
    <rect x="0" y="0" width="185" height="50" rx="5" fill="#0a0a1e" stroke="#00ff88" stroke-width="0.8"/>
    <circle cx="16" cy="25" r="5" fill="#00ff88" class="p1" filter="url(#g)"/>
    <text x="30" y="23" font-family="monospace" font-size="15" fill="#00ff88" font-weight="bold">LEARN</text>
    <text x="30" y="42" font-family="monospace" font-size="13" fill="#888">understand the system</text>
    <line x1="192" y1="25" x2="212" y2="25" stroke="#00ff88" stroke-width="1.5" class="dash"/>
    <circle cx="202" cy="25" r="3" fill="#00ffff" class="bp"/>

    <rect x="215" y="0" width="185" height="50" rx="5" fill="#0a0a1e" stroke="#00ffff" stroke-width="0.8"/>
    <circle cx="231" cy="25" r="5" fill="#00ffff" class="p2"/>
    <text x="245" y="23" font-family="monospace" font-size="15" fill="#00ffff" font-weight="bold">BUILD</text>
    <text x="245" y="42" font-family="monospace" font-size="13" fill="#888">create the tools</text>
    <line x1="407" y1="25" x2="427" y2="25" stroke="#00ffff" stroke-width="1.5" class="dash"/>
    <circle cx="417" cy="25" r="3" fill="#00ff88" class="bp"/>

    <rect x="430" y="0" width="185" height="50" rx="5" fill="#0a0a1e" stroke="#ff003c" stroke-width="0.8"/>
    <circle cx="446" cy="25" r="5" fill="#ff003c" class="p1" filter="url(#g)"/>
    <text x="460" y="23" font-family="monospace" font-size="15" fill="#ff6666" font-weight="bold">TEST</text>
    <text x="460" y="42" font-family="monospace" font-size="13" fill="#888">break assumptions</text>
    <line x1="622" y1="25" x2="642" y2="25" stroke="#ff003c" stroke-width="1.5" class="dash"/>
    <circle cx="632" cy="25" r="3" fill="#00ffff" class="bp"/>

    <rect x="645" y="0" width="185" height="50" rx="5" fill="#0a0a1e" stroke="#9d00ff" stroke-width="0.8"/>
    <circle cx="661" cy="25" r="5" fill="#9d00ff" class="p2"/>
    <text x="675" y="23" font-family="monospace" font-size="15" fill="#9d00ff" font-weight="bold">UNDERSTAND</text>
    <text x="675" y="42" font-family="monospace" font-size="13" fill="#888">map every layer</text>
    <line x1="837" y1="25" x2="857" y2="25" stroke="#9d00ff" stroke-width="1.5" class="dash"/>
    <circle cx="847" cy="25" r="3" fill="#ff003c" class="bp"/>

    <rect x="860" y="0" width="160" height="50" rx="5" fill="#0a0a1e" stroke="#00ff88" stroke-width="0.8"/>
    <circle cx="876" cy="25" r="5" fill="#00ff88" class="p1" filter="url(#g)"/>
    <text x="890" y="23" font-family="monospace" font-size="15" fill="#00ff88" font-weight="bold">DEFEND</text>
    <text x="890" y="42" font-family="monospace" font-size="13" fill="#888">harden</text>
  </g>

  <g transform="translate(16, 112)">
    <rect x="0" y="0" width="185" height="50" rx="5" fill="#0a1a0a" stroke="#00ff88" stroke-width="1.5" class="p2"/>
    <circle cx="16" cy="25" r="6" fill="#00ff88" class="p1" filter="url(#g)"/>
    <text x="30" y="23" font-family="monospace" font-size="15" fill="#00ff88" font-weight="bold">AUTOMATE</text>
    <text x="30" y="42" font-family="monospace" font-size="13" fill="#888">repeat flawlessly</text>
    <line x1="192" y1="25" x2="227" y2="25" stroke="#00ff88" stroke-width="1.5" class="dash"/>
    <circle cx="210" cy="25" r="3" fill="#00ff88" class="bp"/>
  </g>

  <g transform="translate(240, 112)">
    <text x="0" y="18" font-family="monospace" font-size="14" fill="#555">SECONDARY:</text>
    <text x="130" y="18" font-family="monospace" font-size="14" fill="#00ff88" class="br">DISCOVER → ENUMERATE → ANALYZE → EXPLOIT → PATCH → HARDEN</text>
    <text x="0" y="42" font-family="monospace" font-size="14" fill="#555">TERTIARY:</text>
    <text x="130" y="42" font-family="monospace" font-size="14" fill="#00ffff" class="br">RESEARCH → DEVELOP → DEPLOY → MONITOR → ITERATE → EVOLVE</text>
  </g>

  <g transform="translate(16, 180)">
    <rect x="0" y="0" width="1170" height="26" rx="4" fill="#060618" stroke="#00ff88" stroke-width="0.4" opacity="0.3"/>
    <text x="15" y="17" font-family="monospace" font-size="13" fill="#555">PROTOCOL V4.7: <tspan fill="#00ff88" class="blk">ALL SYSTEMS OPERATIONAL</tspan></text>
    <text x="600" y="17" font-family="monospace" font-size="13" fill="#555">CORE DIRECTIVE: <tspan fill="#00ffff">LEARN → BUILD → TEST → UNDERSTAND → DEFEND → AUTOMATE</tspan></text>
  </g>
</svg>