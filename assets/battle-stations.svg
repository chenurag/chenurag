<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="100%" height="auto">
  <defs><filter id="g"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style><![CDATA[
      @keyframes flick{0%,100%{opacity:0.96}2%{opacity:0.15}4%{opacity:0.96}7%{opacity:0.4}9%{opacity:0.96}}
      @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}@keyframes pulse{0%,100%{filter:drop-shadow(0 0 5px)}50%{filter:drop-shadow(0 0 18px)}}
      @keyframes breathe{0%,100%{opacity:0.3}50%{opacity:0.7}}@keyframes scan{0%{transform:translateY(-280px)}100%{transform:translateY(280px)}}
      .blk{animation:blink 0.8s step-end infinite}.p1{animation:pulse 2s ease-in-out infinite}
      .br{animation:breathe 4s ease-in-out infinite}.sc{animation:scan 5s linear infinite}.fk{animation:flick 5s infinite}
    ]]></style>
  </defs>
  <rect width="1200" height="280" fill="#02020c" rx="8"/>
  <rect x="1" y="1" width="1198" height="278" rx="8" fill="none" stroke="#00ff88" stroke-width="0.5" opacity="0.12"/>
  <rect class="sc" width="1200" height="1" fill="#00ff88" opacity="0.03"/>
  <rect class="fk" width="1200" height="280" fill="#000" opacity="0.01" pointer-events="none"/>
  <text x="600" y="24" font-family="monospace" font-size="15" fill="#00ff88" text-anchor="middle" letter-spacing="2" opacity="0.7">⚔️ BATTLE STATIONS — CYBER WAR ROOM</text>

  <!-- Dials row -->
  <g transform="translate(60, 55)">
    <circle cx="0" cy="0" r="32" fill="none" stroke="#112" stroke-width="8"/>
    <circle cx="0" cy="0" r="32" fill="none" stroke="#ff003c" stroke-width="8" stroke-linecap="round" stroke-dasharray="201" stroke-dashoffset="60" transform="rotate(-90)"/>
    <text x="0" y="6" font-family="monospace" font-size="15" fill="#ff003c" text-anchor="middle" font-weight="bold">92%</text>
    <text x="0" y="48" font-family="monospace" font-size="13" fill="#888" text-anchor="middle">READINESS</text>
  </g>
  <g transform="translate(200, 55)">
    <circle cx="0" cy="0" r="32" fill="none" stroke="#112" stroke-width="8"/>
    <circle cx="0" cy="0" r="32" fill="none" stroke="#00ff88" stroke-width="8" stroke-linecap="round" stroke-dasharray="201" stroke-dashoffset="56" transform="rotate(-90)"/>
    <text x="0" y="6" font-family="monospace" font-size="15" fill="#00ff88" text-anchor="middle" font-weight="bold">95%</text>
    <text x="0" y="48" font-family="monospace" font-size="13" fill="#888" text-anchor="middle">MORALE</text>
  </g>
  <g transform="translate(340, 55)">
    <circle cx="0" cy="0" r="32" fill="none" stroke="#112" stroke-width="8"/>
    <circle cx="0" cy="0" r="32" fill="none" stroke="#00ffff" stroke-width="8" stroke-linecap="round" stroke-dasharray="201" stroke-dashoffset="70" transform="rotate(-90)"/>
    <text x="0" y="6" font-family="monospace" font-size="15" fill="#00ffff" text-anchor="middle" font-weight="bold">88%</text>
    <text x="0" y="48" font-family="monospace" font-size="13" fill="#888" text-anchor="middle">EFFICIENCY</text>
  </g>
  <g transform="translate(480, 55)">
    <circle cx="0" cy="0" r="32" fill="none" stroke="#112" stroke-width="8"/>
    <circle cx="0" cy="0" r="32" fill="none" stroke="#9d00ff" stroke-width="8" stroke-linecap="round" stroke-dasharray="201" stroke-dashoffset="90" transform="rotate(-90)"/>
    <text x="0" y="6" font-family="monospace" font-size="15" fill="#9d00ff" text-anchor="middle" font-weight="bold">78%</text>
    <text x="0" y="48" font-family="monospace" font-size="13" fill="#888" text-anchor="middle">ACCURACY</text>
  </g>

  <!-- Central command display -->
  <g transform="translate(630, 45)">
    <rect x="-15" y="-5" width="550" height="150" rx="8" fill="#03030e" stroke="#00ff88" stroke-width="0.8" opacity="0.5"/>
    <path d="M-5,5 L25,5" fill="none" stroke="#00ff88" stroke-width="2"/>
    <path d="M-5,5 L-5,30" fill="none" stroke="#00ff88" stroke-width="2"/>
    <path d="M535,5 L505,5" fill="none" stroke="#00ff88" stroke-width="2"/>
    <path d="M535,5 L535,30" fill="none" stroke="#00ff88" stroke-width="2"/>
    <path d="M-5,135 L25,135" fill="none" stroke="#00ff88" stroke-width="2"/>
    <path d="M-5,135 L-5,110" fill="none" stroke="#00ff88" stroke-width="2"/>
    <path d="M535,135 L505,135" fill="none" stroke="#00ff88" stroke-width="2"/>
    <path d="M535,135 L535,110" fill="none" stroke="#00ff88" stroke-width="2"/>

    <text x="260" y="28" font-family="monospace" font-size="14" fill="#00ff88" text-anchor="middle" letter-spacing="3" class="br">CYBER COMMAND</text>
    <text x="260" y="46" font-family="monospace" font-size="12" fill="#888" text-anchor="middle">SHADOWBEAST OPERATIONS CENTER</text>

    <g transform="translate(15, 58)">
      <circle cx="0" cy="5" r="4" fill="#ff003c" class="blk"/><text x="12" y="10" font-family="monospace" font-size="13" fill="#888">THREAT: <tspan fill="#ff003c" class="blk">LOW</tspan></text>
      <circle cx="0" cy="25" r="4" fill="#00ff88" class="p1"/><text x="12" y="30" font-family="monospace" font-size="13" fill="#888">DEFENSE: <tspan fill="#00ff88">ACTIVE</tspan></text>
      <circle cx="0" cy="45" r="4" fill="#00ffff" class="blk"/><text x="12" y="50" font-family="monospace" font-size="13" fill="#888">SIGNAL: <tspan fill="#00ffff">STRONG</tspan></text>
    </g>
    <g transform="translate(270, 58)">
      <text x="0" y="10" font-family="monospace" font-size="13" fill="#888">COMMS: <tspan fill="#00ff88" class="p1">SECURE</tspan></text>
      <text x="0" y="30" font-family="monospace" font-size="13" fill="#888">NODES: <tspan fill="#00ffff">7 ONLINE</tspan></text>
      <text x="0" y="50" font-family="monospace" font-size="13" fill="#888">POWER: <tspan fill="#00ff88">100%</tspan></text>
    </g>
  </g>

  <g transform="translate(16, 200)">
    <rect x="0" y="0" width="1170" height="60" rx="6" fill="#040416" stroke="#00ff88" stroke-width="0.5"/>
    <text x="15" y="22" font-family="monospace" font-size="14" fill="#00ff88" font-weight="bold">WAR ROOM STATUS</text>
    <text x="15" y="44" font-family="monospace" font-size="14" fill="#888">ALL SECTORS NOMINAL · DEFENSE POSTURE: <tspan fill="#00ff88" class="p1">STRONG</tspan> · READY FOR DEPLOYMENT</text>
    <circle cx="1150" cy="18" r="4" fill="#00ff88" class="blk"/>
  </g>
</svg>