<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="100%" height="auto">
  <defs>
    <filter id="g"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      @keyframes growBar{0%{width:0}100%{width:var(--w)}}
      @keyframes pulse{0%,100%{opacity:0.5;filter:drop-shadow(0 0 4px)}50%{opacity:1;filter:drop-shadow(0 0 14px)}}
      @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
      @keyframes breathe{0%,100%{opacity:0.4}50%{opacity:0.8}}
      @keyframes scan{0%{transform:translateX(-1200px)}100%{transform:translateX(1200px)}}
      @keyframes flick{0%,100%{opacity:0.96}2%{opacity:0.2}4%{opacity:0.96}}
      
      .gb1{--w:320px;animation:growBar 2s ease-out 0.2s both}
      .gb2{--w:280px;animation:growBar 2s ease-out 0.4s both}
      .gb3{--w:250px;animation:growBar 2s ease-out 0.6s both}
      .gb4{--w:200px;animation:growBar 2s ease-out 0.8s both}
      .gb5{--w:150px;animation:growBar 2s ease-out 1.0s both}
      .gb6{--w:110px;animation:growBar 2s ease-out 1.2s both}
      .p1{animation:pulse 2s ease-in-out infinite}
      .blk{animation:blink 0.8s step-end infinite}
      .br{animation:breathe 4s ease-in-out infinite}
      .sc{animation:scan 4s linear infinite}
      .fk{animation:flick 7s infinite}
    </style>
  </defs>

  <rect width="1200" height="260" fill="#02020c" rx="8"/>
  <rect x="1" y="1" width="1198" height="258" rx="8" fill="none" stroke="#00ff88" stroke-width="0.5" opacity="0.12"/>
  <rect class="sc" width="1200" height="1" fill="#00ff88" opacity="0.04"/>
  <rect class="fk" width="1200" height="260" fill="#000" opacity="0.01" pointer-events="none"/>

  <text x="600" y="22" font-family="monospace" font-size="10" fill="#00ff88" text-anchor="middle" letter-spacing="2" opacity="0.6">🎓 CERTIFICATION TRACKER — CREDENTIAL ROADMAP</text>

  <!-- Cert cards -->
  <g transform="translate(30, 42)">
    <!-- Security+ -->
    <text x="0" y="20" font-family="monospace" font-size="11" fill="#00ff88" font-weight="bold">🛡️ Security+</text>
    <text x="150" y="20" font-family="monospace" font-size="8" fill="#888">COMPTIA</text>
    <rect x="250" y="10" width="320" height="12" rx="4" fill="#0a0a1e" stroke="#00ff88" stroke-width="0.3"/>
    <rect x="250" y="10" width="0" height="12" rx="4" fill="#00ff88" opacity="0.7" class="gb1"/>
    <text x="590" y="20" font-family="monospace" font-size="10" fill="#00ff88" class="p1">80%</text>
    <circle cx="630" cy="15" r="4" fill="#00ff88" class="blk"/>

    <!-- Network+ -->
    <text x="0" y="50" font-family="monospace" font-size="11" fill="#00ffff" font-weight="bold">🌐 Network+</text>
    <text x="150" y="50" font-family="monospace" font-size="8" fill="#888">COMPTIA</text>
    <rect x="250" y="40" width="320" height="12" rx="4" fill="#0a0a1e" stroke="#00ffff" stroke-width="0.3"/>
    <rect x="250" y="40" width="0" height="12" rx="4" fill="#00ffff" opacity="0.7" class="gb2"/>
    <text x="590" y="50" font-family="monospace" font-size="10" fill="#00ffff" class="br">70%</text>
    <circle cx="630" cy="45" r="4" fill="#00ffff" class="p1"/>

    <!-- CEH -->
    <text x="0" y="80" font-family="monospace" font-size="11" fill="#ff6600" font-weight="bold">☠️ CEH — Certified Ethical Hacker</text>
    <text x="150" y="80" font-family="monospace" font-size="8" fill="#888">EC-COUNCIL</text>
    <rect x="250" y="70" width="320" height="12" rx="4" fill="#0a0a1e" stroke="#ff6600" stroke-width="0.3"/>
    <rect x="250" y="70" width="0" height="12" rx="4" fill="#ff6600" opacity="0.7" class="gb3"/>
    <text x="590" y="80" font-family="monospace" font-size="10" fill="#ff6600" class="p1">62%</text>
    <circle cx="630" cy="75" r="4" fill="#ff6600" class="blk"/>

    <!-- OSCP -->
    <text x="0" y="110" font-family="monospace" font-size="11" fill="#ff003c" font-weight="bold">⚔️ OSCP — Offensive Security</text>
    <text x="150" y="110" font-family="monospace" font-size="8" fill="#888">OSCP</text>
    <rect x="250" y="100" width="320" height="12" rx="4" fill="#0a0a1e" stroke="#ff003c" stroke-width="0.3"/>
    <rect x="250" y="100" width="0" height="12" rx="4" fill="#ff003c" opacity="0.7" class="gb4"/>
    <text x="590" y="110" font-family="monospace" font-size="10" fill="#ff003c" class="br">50%</text>
    <circle cx="630" cy="105" r="4" fill="#ff003c" class="p1"/>

    <!-- Security Blue Team -->
    <text x="0" y="140" font-family="monospace" font-size="11" fill="#00ff88" font-weight="bold">🔵 Security Blue Team</text>
    <text x="150" y="140" font-family="monospace" font-size="8" fill="#888">SBT</text>
    <rect x="250" y="130" width="320" height="12" rx="4" fill="#0a0a1e" stroke="#00ff88" stroke-width="0.3"/>
    <rect x="250" y="130" width="0" height="12" rx="4" fill="#00ff88" opacity="0.7" class="gb5"/>
    <text x="590" y="140" font-family="monospace" font-size="10" fill="#00ff88" class="p1">40%</text>
    <circle cx="630" cy="135" r="4" fill="#00ff88" class="blk"/>

    <!-- CISSP (future) -->
    <text x="0" y="170" font-family="monospace" font-size="11" fill="#9d00ff" font-weight="bold">👑 CISSP — Future Target</text>
    <text x="150" y="170" font-family="monospace" font-size="8" fill="#888">ISC2</text>
    <rect x="250" y="160" width="320" height="12" rx="4" fill="#0a0a1e" stroke="#9d00ff" stroke-width="0.3"/>
    <rect x="250" y="160" width="0" height="12" rx="4" fill="#9d00ff" opacity="0.7" class="gb6"/>
    <text x="590" y="170" font-family="monospace" font-size="10" fill="#9d00ff" class="br">10%</text>
    <circle cx="630" cy="165" r="4" fill="#9d00ff" class="p1"/>
  </g>

  <!-- Right side: cert stats -->
  <g transform="translate(700, 45)">
    <rect x="0" y="0" width="460" height="90" rx="6" fill="#040416" stroke="#00ff88" stroke-width="0.5"/>
    <text x="20" y="25" font-family="monospace" font-size="10" fill="#888">ACTIVE CERTIFICATIONS</text>
    <text x="20" y="55" font-family="monospace" font-size="28" fill="#00ff88" font-weight="bold" class="p1">02</text>
    <text x="110" y="40" font-family="monospace" font-size="9" fill="#555">ACHIEVED</text>
    <text x="110" y="55" font-family="monospace" font-size="9" fill="#555">IN PROGRESS: <tspan fill="#00ffff">04</tspan></text>
    <text x="110" y="70" font-family="monospace" font-size="9" fill="#555">TARGETED BY 2030: <tspan fill="#ff6600">08</tspan></text>
    <circle cx="440" cy="20" r="4" fill="#00ff88" class="blk"/>
  </g>

  <g transform="translate(700, 150)">
    <rect x="0" y="0" width="460" height="80" rx="6" fill="#040416" stroke="#00ffff" stroke-width="0.5"/>
    <text x="20" y="22" font-family="monospace" font-size="10" fill="#888">CURRENT STUDY FOCUS</text>
    <text x="20" y="45" font-family="monospace" font-size="12" fill="#00ffff" class="br">▶ OSCP PEN-200 LABS</text>
    <text x="20" y="63" font-family="monospace" font-size="9" fill="#555">60% THROUGH 60 LAB MACHINES</text>
    <circle cx="440" cy="18" r="4" fill="#00ffff" class="blk"/>
  </g>
</svg>