<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="100%" height="auto">
  <defs><filter id="g"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style><![CDATA[
      @keyframes fillBar{0%{width:0}100%{width:var(--w)}}
      @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}@keyframes pulse{0%,100%{filter:drop-shadow(0 0 4px)}50%{filter:drop-shadow(0 0 14px)}}
      @keyframes breathe{0%,100%{opacity:0.3}50%{opacity:0.7}}@keyframes scan{0%{transform:translateX(-1200px)}100%{transform:translateX(1200px)}}
      @keyframes flick{0%,100%{opacity:0.96}2%{opacity:0.2}4%{opacity:0.96}}
      .fb1{--w:500px;animation:fillBar 2s ease-out 0.2s both}.fb2{--w:430px;animation:fillBar 2s ease-out 0.4s both}
      .fb3{--w:360px;animation:fillBar 2s ease-out 0.6s both}.fb4{--w:290px;animation:fillBar 2s ease-out 0.8s both}
      .fb5{--w:220px;animation:fillBar 2s ease-out 1s both}.fb6{--w:150px;animation:fillBar 2s ease-out 1.2s both}
      .blk{animation:blink 0.8s step-end infinite}.p1{animation:pulse 2s ease-in-out infinite}
      .br{animation:breathe 4s ease-in-out infinite}.sc{animation:scan 4s linear infinite}.fk{animation:flick 7s infinite}
    ]]></style>
  </defs>
  <rect width="1200" height="260" fill="#02020c" rx="8"/>
  <rect x="1" y="1" width="1198" height="258" rx="8" fill="none" stroke="#00ff88" stroke-width="0.5" opacity="0.12"/>
  <rect class="sc" width="1200" height="1" fill="#00ff88" opacity="0.04"/>
  <rect class="fk" width="1200" height="260" fill="#000" opacity="0.01" pointer-events="none"/>
  <text x="600" y="26" font-family="monospace" font-size="15" fill="#00ff88" text-anchor="middle" letter-spacing="2" opacity="0.7">TOOL COMPARISON — SPEED / RELIABILITY RATINGS</text>

  <g transform="translate(40, 55)" font-family="monospace">
    <text x="0" y="16" font-size="15" fill="#00ff88" font-weight="bold">Nmap</text>
    <rect x="100" y="6" width="550" height="14" rx="5" fill="#0a0a1e" stroke="#00ff88" stroke-width="0.3"/>
    <rect x="100" y="6" width="500" height="14" rx="5" fill="#00ff88" opacity="0.7" class="fb1"/>
    <text x="670" y="16" font-size="14" fill="#00ff88" class="p1">SPEED: 9/10</text>

    <text x="0" y="50" font-size="15" fill="#00ffff" font-weight="bold">Wireshark</text>
    <rect x="100" y="40" width="550" height="14" rx="5" fill="#0a0a1e" stroke="#00ffff" stroke-width="0.3"/>
    <rect x="100" y="40" width="430" height="14" rx="5" fill="#00ffff" opacity="0.6" class="fb2"/>
    <text x="670" y="50" font-size="14" fill="#00ffff" class="br">RELIABILITY: 8/10</text>

    <text x="0" y="84" font-size="15" fill="#ff6600" font-weight="bold">Metasploit</text>
    <rect x="100" y="74" width="550" height="14" rx="5" fill="#0a0a1e" stroke="#ff6600" stroke-width="0.3"/>
    <rect x="100" y="74" width="360" height="14" rx="5" fill="#ff6600" opacity="0.6" class="fb3"/>
    <text x="670" y="84" font-size="14" fill="#ff6600">COVERAGE: 7/10</text>

    <text x="0" y="118" font-size="15" fill="#9d00ff" font-weight="bold">Burp Suite</text>
    <rect x="100" y="108" width="550" height="14" rx="5" fill="#0a0a1e" stroke="#9d00ff" stroke-width="0.3"/>
    <rect x="100" y="108" width="290" height="14" rx="5" fill="#9d00ff" opacity="0.6" class="fb4"/>
    <text x="670" y="118" font-size="14" fill="#9d00ff">ACCURACY: 6/10</text>

    <text x="0" y="152" font-size="15" fill="#ff003c" font-weight="bold">Hashcat</text>
    <rect x="100" y="142" width="550" height="14" rx="5" fill="#0a0a1e" stroke="#ff003c" stroke-width="0.3"/>
    <rect x="100" y="142" width="220" height="14" rx="5" fill="#ff003c" opacity="0.6" class="fb5"/>
    <text x="670" y="152" font-size="14" fill="#ff003c">THROUGHPUT: 5/10</text>

    <text x="0" y="186" font-size="15" fill="#00ff88" font-weight="bold">Wazuh</text>
    <rect x="100" y="176" width="550" height="14" rx="5" fill="#0a0a1e" stroke="#00ff88" stroke-width="0.3"/>
    <rect x="100" y="176" width="150" height="14" rx="5" fill="#00ff88" opacity="0.6" class="fb6"/>
    <text x="670" y="186" font-size="14" fill="#00ff88">MATURITY: 4/10</text>
  </g>

  <g transform="translate(740, 55)">
    <rect x="0" y="0" width="420" height="80" rx="6" fill="#040416" stroke="#00ff88" stroke-width="0.5"/>
    <text x="15" y="24" font-family="monospace" font-size="15" fill="#00ff88" font-weight="bold">TOP PERFORMER</text>
    <text x="15" y="50" font-family="monospace" font-size="15" fill="#00ffff" class="p1">Nmap — Speed: 9/10</text>
    <text x="15" y="72" font-family="monospace" font-size="13" fill="#888">Fastest in class for network mapping</text>
    <circle cx="400" cy="18" r="4" fill="#00ff88" class="blk"/>
  </g>
  <g transform="translate(740, 150)">
    <rect x="0" y="0" width="420" height="80" rx="6" fill="#040416" stroke="#00ffff" stroke-width="0.5"/>
    <text x="15" y="24" font-family="monospace" font-size="15" fill="#00ffff" font-weight="bold">BEST VALUE</text>
    <text x="15" y="50" font-family="monospace" font-size="15" fill="#00ff88">Wazuh — Open Source SIEM</text>
    <text x="15" y="72" font-family="monospace" font-size="13" fill="#888">Enterprise grade at zero cost</text>
    <circle cx="400" cy="18" r="4" fill="#00ffff" class="blk"/>
  </g>
</svg>