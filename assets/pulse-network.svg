<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="100%" height="auto">
  <defs><filter id="g"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      @keyframes pulse{0%,100%{opacity:0.4;filter:drop-shadow(0 0 4px)}50%{opacity:1;filter:drop-shadow(0 0 15px)}}
      @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
      @keyframes breathe{0%,100%{opacity:0.3}50%{opacity:0.7}}
      @keyframes scan{0%{transform:translateX(-1200px)}100%{transform:translateX(1200px)}}
      @keyframes flick{0%,100%{opacity:0.96}2%{opacity:0.2}4%{opacity:0.96}}
      @keyframes dataPulse{0%{stroke-dashoffset:200}100%{stroke-dashoffset:0}}
      @keyframes blip{0%{opacity:0;transform:translate(0,0)}10%{opacity:1}90%{opacity:1}100%{opacity:0;transform:translate(60px,-60px)}}
      @keyframes glowRing{0%{r:4;opacity:0.7}100%{r:25;opacity:0}}
      @keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
      .p1{animation:pulse 2s ease-in-out infinite}.blk{animation:blink 0.8s step-end infinite}
      .br{animation:breathe 4s ease-in-out infinite}.sc{animation:scan 4s linear infinite}
      .fk{animation:flick 7s infinite}.dp{stroke-dasharray:200;stroke-dashoffset:200;animation:dataPulse 2s linear infinite}
      .gr{animation:glowRing 2.5s ease-out infinite;transform-origin:0 0}
      .fl{animation:float 3s ease-in-out infinite}.sp{animation:spin 8s linear infinite;transform-origin:0 0}
    </style>
  </defs>
  <rect width="1200" height="260" fill="#02020c" rx="8"/>
  <rect x="1" y="1" width="1198" height="258" rx="8" fill="none" stroke="#00ff88" stroke-width="0.5" opacity="0.12"/>
  <rect class="sc" width="1200" height="1" fill="#00ff88" opacity="0.04"/>
  <rect class="fk" width="1200" height="260" fill="#000" opacity="0.01" pointer-events="none"/>
  <text x="600" y="22" font-family="monospace" font-size="10" fill="#00ff88" text-anchor="middle" letter-spacing="2" opacity="0.6">🧠 NEURAL PULSE NETWORK — OPERATIONAL NODES</text>

  <!-- Center node --><g transform="translate(600, 140)">
    <circle cx="0" cy="0" r="18" fill="#0a1a0a" stroke="#00ff88" stroke-width="2" class="p1" filter="url(#g)"/>
    <text x="0" y="5" font-family="monospace" font-size="18" fill="#00ff88" text-anchor="middle" class="p1">⚡</text>
    <circle cx="0" cy="0" r="4" fill="none" stroke="#00ff88" class="gr"/><circle cx="0" cy="0" r="4" fill="none" stroke="#00ffff" class="gr" style="animation-delay:1s"/>
  </g>

  <!-- Orbital rings -->
  <g transform="translate(600, 140)">
    <ellipse cx="0" cy="0" rx="140" ry="100" fill="none" stroke="#00ff88" stroke-width="0.3" opacity="0.12" class="sp"/>
    <ellipse cx="0" cy="0" rx="180" ry="80" fill="none" stroke="#00ffff" stroke-width="0.3" opacity="0.08" class="sp" style="animation-direction:reverse"/>
    <ellipse cx="0" cy="0" rx="220" ry="60" fill="none" stroke="#9d00ff" stroke-width="0.3" opacity="0.05" class="sp"/>
  </g>

  <!-- Satellite nodes with connections -->
  <g transform="translate(600, 140)">
    <!-- Node 1: Recon --><g transform="translate(-220,-80)" class="fl"><rect x="-22" y="-12" width="44" height="24" rx="4" fill="#0a0a1e" stroke="#00ffff" stroke-width="0.8"/><text x="0" y="4" font-family="monospace" font-size="8" fill="#00ffff" text-anchor="middle">RECON</text><circle cx="0" cy="-18" r="3" fill="#00ffff" class="p1" filter="url(#g)"/></g>
    <line x1="-220" y1="-80" x2="0" y2="0" stroke="#00ffff" stroke-width="0.8" class="dp" opacity="0.3"/>
    <circle cx="0" cy="0" r="2" fill="#00ffff"><animate attributeName="cx" values="-220;0" dur="2s" repeatCount="indefinite"/><animate attributeName="cy" values="-80;0" dur="2s" repeatCount="indefinite"/></circle>

    <!-- Node 2: Scan --><g transform="translate(220,-70)" class="fl"><rect x="-22" y="-12" width="44" height="24" rx="4" fill="#0a0a1e" stroke="#00ff88" stroke-width="0.8"/><text x="0" y="4" font-family="monospace" font-size="8" fill="#00ff88" text-anchor="middle">SCAN</text><circle cx="0" cy="-18" r="3" fill="#00ff88" class="p1" filter="url(#g)"/></g>
    <line x1="220" y1="-70" x2="0" y2="0" stroke="#00ff88" stroke-width="0.8" class="dp" opacity="0.3" style="animation-delay:0.5s"/>
    <circle cx="0" cy="0" r="2" fill="#00ff88"><animate attributeName="cx" values="220;0" dur="2.5s" repeatCount="indefinite"/><animate attributeName="cy" values="-70;0" dur="2.5s" repeatCount="indefinite"/></circle>

    <!-- Node 3: Exploit --><g transform="translate(-200,90)" class="fl"><rect x="-30" y="-12" width="60" height="24" rx="4" fill="#0a0a1e" stroke="#ff003c" stroke-width="0.8"/><text x="0" y="4" font-family="monospace" font-size="8" fill="#ff6666" text-anchor="middle">EXPLOIT</text><circle cx="0" cy="-18" r="3" fill="#ff003c" class="p1" filter="url(#g)"/></g>
    <line x1="-200" y1="90" x2="0" y2="0" stroke="#ff003c" stroke-width="0.8" class="dp" opacity="0.3" style="animation-delay:1s"/>
    <circle cx="0" cy="0" r="2" fill="#ff003c"><animate attributeName="cx" values="-200;0" dur="1.8s" repeatCount="indefinite"/><animate attributeName="cy" values="90;0" dur="1.8s" repeatCount="indefinite"/></circle>

    <!-- Node 4: Persist --><g transform="translate(190,100)" class="fl"><rect x="-30" y="-12" width="60" height="24" rx="4" fill="#0a0a1e" stroke="#9d00ff" stroke-width="0.8"/><text x="0" y="4" font-family="monospace" font-size="8" fill="#9d00ff" text-anchor="middle">PERSIST</text><circle cx="0" cy="-18" r="3" fill="#9d00ff" class="p1" filter="url(#g)"/></g>
    <line x1="190" y1="100" x2="0" y2="0" stroke="#9d00ff" stroke-width="0.8" class="dp" opacity="0.3" style="animation-delay:1.5s"/>

    <!-- Node 5: Exfil --><g transform="translate(-140,-140)" class="fl"><rect x="-25" y="-12" width="50" height="24" rx="4" fill="#0a0a1e" stroke="#ff6600" stroke-width="0.8"/><text x="0" y="4" font-family="monospace" font-size="8" fill="#ff6600" text-anchor="middle">EXFIL</text><circle cx="0" cy="-18" r="3" fill="#ff6600" class="p1" filter="url(#g)"/></g>
    <line x1="-140" y1="-140" x2="0" y2="0" stroke="#ff6600" stroke-width="0.8" class="dp" opacity="0.3" style="animation-delay:0.3s"/>

    <!-- Node 6: Cover --><g transform="translate(150,-140)" class="fl"><rect x="-25" y="-12" width="50" height="24" rx="4" fill="#0a0a1e" stroke="#ffd700" stroke-width="0.8"/><text x="0" y="4" font-family="monospace" font-size="8" fill="#ffd700" text-anchor="middle">COVER</text><circle cx="0" cy="-18" r="3" fill="#ffd700" class="p1" filter="url(#g)"/></g>
    <line x1="150" y1="-140" x2="0" y2="0" stroke="#ffd700" stroke-width="0.8" class="dp" opacity="0.3" style="animation-delay:0.7s"/>
  </g>

  <!-- Bottom stats -->
  <g transform="translate(30, 220)">
    <rect x="0" y="0" width="1140" height="28" rx="4" fill="#060618" stroke="#00ff88" stroke-width="0.4" opacity="0.3"/>
    <text x="15" y="18" font-family="monospace" font-size="9" fill="#555">NODES ONLINE: <tspan fill="#00ff88" class="p1">6</tspan></text>
    <text x="250" y="18" font-family="monospace" font-size="9" fill="#555">SIGNAL: <tspan fill="#00ffff" class="br">FULL DUPLEX</tspan></text>
    <text x="500" y="18" font-family="monospace" font-size="9" fill="#555">AVG LATENCY: <tspan fill="#00ff88">2.4ms</tspan></text>
    <text x="750" y="18" font-family="monospace" font-size="9" fill="#555">NETWORK TOPO: <tspan fill="#00ffff">MESH</tspan></text>
    <circle cx="1105" cy="13" r="3" fill="#00ff88" class="blk"/>
  </g>
</svg>