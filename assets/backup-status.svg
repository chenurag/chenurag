<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="100%" height="auto">
  <defs><filter id="g"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style><![CDATA[
      @keyframes growBar{0%{width:0}100%{width:var(--w)}}
      @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}@keyframes p1{0%,100%{filter:drop-shadow(0 0 4px)}50%{filter:drop-shadow(0 0 14px)}}
      @keyframes br{0%,100%{opacity:0.3}50%{opacity:0.7}}@keyframes scan{0%{transform:translateX(-1200px)}100%{transform:translateX(1200px)}}
      @keyframes flick{0%,100%{opacity:0.96}2%{opacity:0.2}4%{opacity:0.96}}
      .gb1{--w:380px;animation:growBar 2s ease-out 0.2s both}.gb2{--w:320px;animation:growBar 2s ease-out 0.4s both}
      .gb3{--w:260px;animation:growBar 2s ease-out 0.6s both}.gb4{--w:200px;animation:growBar 2s ease-out 0.8s both}
      .gb5{--w:140px;animation:growBar 2s ease-out 1s both}
      .blk{animation:blink 0.8s step-end infinite}.p1{animation:p1 2s ease-in-out infinite}
      .br{animation:br 4s ease-in-out infinite}.sc{animation:scan 4s linear infinite}.fk{animation:flick 7s infinite}
    ]]></style>
  </defs>
  <rect width="1200" height="260" fill="#02020c" rx="8"/>
  <rect x="1" y="1" width="1198" height="258" rx="8" fill="none" stroke="#00ff88" stroke-width="0.5" opacity="0.12"/>
  <rect class="sc" width="1200" height="1" fill="#00ff88" opacity="0.04"/>
  <rect class="fk" width="1200" height="260" fill="#000" opacity="0.01" pointer-events="none"/>
  <text x="600" y="26" font-family="monospace" font-size="15" fill="#00ff88" text-anchor="middle" letter-spacing="2" opacity="0.7">DATA BACKUP STATUS — DISASTER RECOVERY READINESS</text>

  <g transform="translate(60, 55)">
    <text x="0" y="18" font-family="monospace" font-size="15" fill="#00ff88" font-weight="bold">SYSTEM BACKUP</text>
    <rect x="180" y="8" width="450" height="14" rx="5" fill="#0a0a1e" stroke="#00ff88" stroke-width="0.3"/>
    <rect x="180" y="8" width="380" height="14" rx="5" fill="#00ff88" opacity="0.7" class="gb1"/>
    <text x="650" y="18" font-family="monospace" font-size="14" fill="#00ff88" class="p1">DAILY</text>
  </g>
  <g transform="translate(60, 92)">
    <text x="0" y="18" font-family="monospace" font-size="15" fill="#00ffff" font-weight="bold">DATABASE BACKUP</text>
    <rect x="180" y="8" width="450" height="14" rx="5" fill="#0a0a1e" stroke="#00ffff" stroke-width="0.3"/>
    <rect x="180" y="8" width="320" height="14" rx="5" fill="#00ffff" opacity="0.6" class="gb2"/>
    <text x="650" y="18" font-family="monospace" font-size="14" fill="#00ffff" class="br">HOURLY</text>
  </g>
  <g transform="translate(60, 129)">
    <text x="0" y="18" font-family="monospace" font-size="15" fill="#ff6600" font-weight="bold">SNAPSHOTS</text>
    <rect x="180" y="8" width="450" height="14" rx="5" fill="#0a0a1e" stroke="#ff6600" stroke-width="0.3"/>
    <rect x="180" y="8" width="260" height="14" rx="5" fill="#ff6600" opacity="0.6" class="gb3"/>
    <text x="650" y="18" font-family="monospace" font-size="14" fill="#ff6600">WEEKLY</text>
  </g>
  <g transform="translate(60, 166)">
    <text x="0" y="18" font-family="monospace" font-size="15" fill="#9d00ff" font-weight="bold">OFFSITE REPLICATION</text>
    <rect x="180" y="8" width="450" height="14" rx="5" fill="#0a0a1e" stroke="#9d00ff" stroke-width="0.3"/>
    <rect x="180" y="8" width="200" height="14" rx="5" fill="#9d00ff" opacity="0.6" class="gb4"/>
    <text x="650" y="18" font-family="monospace" font-size="14" fill="#9d00ff">DAILY</text>
  </g>
  <g transform="translate(60, 203)">
    <text x="0" y="18" font-family="monospace" font-size="15" fill="#ff003c" font-weight="bold">COLD STORAGE</text>
    <rect x="180" y="8" width="450" height="14" rx="5" fill="#0a0a1e" stroke="#ff003c" stroke-width="0.3"/>
    <rect x="180" y="8" width="140" height="14" rx="5" fill="#ff003c" opacity="0.5" class="gb5"/>
    <text x="650" y="18" font-family="monospace" font-size="14" fill="#ff003c">MONTHLY</text>
  </g>

  <g transform="translate(690, 55)">
    <rect x="0" y="0" width="470" height="70" rx="6" fill="#040416" stroke="#00ff88" stroke-width="0.8"/>
    <text x="15" y="22" font-family="monospace" font-size="15" fill="#00ff88" font-weight="bold">RECOVERY TIME OBJECTIVE</text>
    <text x="15" y="50" font-family="monospace" font-size="14" fill="#00ff88" class="p1">RTO: 4 HOURS</text>
    <text x="250" y="50" font-family="monospace" font-size="14" fill="#888">RPO: <tspan fill="#00ffff">1 HOUR</tspan></text>
    <circle cx="450" cy="18" r="4" fill="#00ff88" class="blk"/>
  </g>
  <g transform="translate(690, 140)">
    <rect x="0" y="0" width="470" height="70" rx="6" fill="#040416" stroke="#00ffff" stroke-width="0.5"/>
    <text x="15" y="22" font-family="monospace" font-size="15" fill="#00ffff" font-weight="bold">BACKUP SUCCESS RATE</text>
    <rect x="15" y="36" width="320" height="14" rx="5" fill="#0a0a1e" stroke="#00ff88" stroke-width="0.3"/>
    <rect x="15" y="36" width="290" height="14" rx="5" fill="#00ff88" opacity="0.7"><animate attributeName="width" values="0;290" dur="2s" fill="freeze"/></rect>
    <text x="350" y="48" font-family="monospace" font-size="14" fill="#00ff88" class="p1">99.7%</text>
    <circle cx="450" cy="18" r="4" fill="#00ffff" class="blk"/>
  </g>
  <g transform="translate(690, 225)">
    <rect x="0" y="0" width="470" height="28" rx="4" fill="#060618" stroke="#00ff88" stroke-width="0.4" opacity="0.3"/>
    <text x="15" y="19" font-family="monospace" font-size="13" fill="#555">LAST BACKUP: <tspan fill="#00ff88">TODAY 03:00</tspan> · NEXT: <tspan fill="#00ffff">TOMORROW 03:00</tspan></text>
  </g>
</svg>