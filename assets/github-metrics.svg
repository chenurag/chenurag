<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="100%" height="auto">
  <defs><filter id="g"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style><![CDATA[
      @keyframes countUp{from{opacity:0}to{opacity:1}}
      @keyframes fillMeter{0%{width:0}100%{width:var(--w)}}
      @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
      @keyframes pulse{0%,100%{filter:drop-shadow(0 0 3px)}50%{filter:drop-shadow(0 0 12px)}}
      @keyframes breathe{0%,100%{opacity:0.3}50%{opacity:0.7}}
      @keyframes scan{0%{transform:translateX(-1200px)}100%{transform:translateX(1200px)}}
      @keyframes flick{0%,100%{opacity:0.96}2%{opacity:0.2}4%{opacity:0.96}}
      @keyframes ringGrow{0%{stroke-dashoffset:100}100%{stroke-dashoffset:var(--s)}}
      .fm1{--w:260px;animation:fillMeter 2s ease-out 0.2s both}.fm2{--w:200px;animation:fillMeter 2s ease-out 0.4s both}
      .rg1{--s:25;stroke-dasharray:100;stroke-dashoffset:100;animation:ringGrow 2s ease-out 0.3s forwards}
      .rg2{--s:40;stroke-dasharray:100;stroke-dashoffset:100;animation:ringGrow 2s ease-out 0.5s forwards}
      .rg3{--s:55;stroke-dasharray:100;stroke-dashoffset:100;animation:ringGrow 2s ease-out 0.7s forwards}
      .blk{animation:blink 0.8s step-end infinite}.p1{animation:pulse 2s ease-in-out infinite}
      .br{animation:breathe 4s ease-in-out infinite}.sc{animation:scan 4s linear infinite}.fk{animation:flick 7s infinite}
    ]]></style>
  </defs>
  <rect width="1200" height="220" fill="#02020c" rx="8"/>
  <rect x="1" y="1" width="1198" height="218" rx="8" fill="none" stroke="#00ff88" stroke-width="0.5" opacity="0.12"/>
  <rect class="sc" width="1200" height="1" fill="#00ff88" opacity="0.04"/>
  <rect class="fk" width="1200" height="220" fill="#000" opacity="0.01" pointer-events="none"/>
  <text x="600" y="22" font-family="monospace" font-size="10" fill="#00ff88" text-anchor="middle" letter-spacing="2" opacity="0.6">GITHUB METRICS — LIVE PROJECT ANALYTICS</text>

  <g transform="translate(50, 45)">
    <circle cx="0" cy="0" r="22" fill="none" stroke="#112" stroke-width="6"/>
    <circle cx="0" cy="0" r="22" fill="none" stroke="#00ff88" stroke-width="6" class="rg1" stroke-linecap="round" transform="rotate(-90)"/>
    <text x="0" y="5" font-family="monospace" font-size="14" fill="#00ff88" text-anchor="middle" font-weight="bold" class="p1">75</text>
    <text x="0" y="38" font-family="monospace" font-size="7" fill="#888" text-anchor="middle">CODE SCORE</text>
  </g>
  <g transform="translate(130, 45)">
    <circle cx="0" cy="0" r="22" fill="none" stroke="#112" stroke-width="6"/>
    <circle cx="0" cy="0" r="22" fill="none" stroke="#00ffff" stroke-width="6" class="rg2" stroke-linecap="round" transform="rotate(-90)"/>
    <text x="0" y="5" font-family="monospace" font-size="14" fill="#00ffff" text-anchor="middle" font-weight="bold" class="br">60</text>
    <text x="0" y="38" font-family="monospace" font-size="7" fill="#888" text-anchor="middle">QUALITY</text>
  </g>
  <g transform="translate(210, 45)">
    <circle cx="0" cy="0" r="22" fill="none" stroke="#112" stroke-width="6"/>
    <circle cx="0" cy="0" r="22" fill="none" stroke="#ff6600" stroke-width="6" class="rg3" stroke-linecap="round" transform="rotate(-90)"/>
    <text x="0" y="5" font-family="monospace" font-size="14" fill="#ff6600" text-anchor="middle" font-weight="bold">45</text>
    <text x="0" y="38" font-family="monospace" font-size="7" fill="#888" text-anchor="middle">IMPACT</text>
  </g>

  <g transform="translate(300, 45)">
    <text x="0" y="16" font-family="monospace" font-size="10" fill="#888">REPO ACTIVITY</text>
    <rect x="0" y="22" width="350" height="10" rx="3" fill="#0a0a1e" stroke="#00ff88" stroke-width="0.3"/>
    <rect x="0" y="22" width="0" height="10" rx="3" fill="#00ff88" opacity="0.7" class="fm1"/>
    <text x="360" y="30" font-family="monospace" font-size="9" fill="#00ff88">65%</text>
    
    <text x="0" y="54" font-family="monospace" font-size="10" fill="#888">OPEN SOURCE</text>
    <rect x="0" y="60" width="350" height="10" rx="3" fill="#0a0a1e" stroke="#00ffff" stroke-width="0.3"/>
    <rect x="0" y="60" width="0" height="10" rx="3" fill="#00ffff" opacity="0.6" class="fm2"/>
    <text x="360" y="68" font-family="monospace" font-size="9" fill="#00ffff">50%</text>
  </g>

  <g transform="translate(300, 90)">
    <text x="0" y="14" font-family="monospace" font-size="9" fill="#888">REPOS</text><text x="60" y="14" font-family="monospace" font-size="9" fill="#00ff88" class="p1">04</text>
    <text x="130" y="14" font-family="monospace" font-size="9" fill="#888">FORKS</text><text x="180" y="14" font-family="monospace" font-size="9" fill="#00ffff" class="br">00</text>
    <text x="230" y="14" font-family="monospace" font-size="9" fill="#888">STARS</text><text x="280" y="14" font-family="monospace" font-size="9" fill="#00ff88">00</text>
    <text x="330" y="14" font-family="monospace" font-size="9" fill="#888">CONTRIB</text><text x="390" y="14" font-family="monospace" font-size="9" fill="#00ffff">02</text>
  </g>

  <g transform="translate(690, 45)">
    <rect x="0" y="0" width="470" height="60" rx="6" fill="#040416" stroke="#00ff88" stroke-width="0.5"/>
    <text x="15" y="22" font-family="monospace" font-size="10" fill="#00ff88" font-weight="bold">MOST ACTIVE REPO</text>
    <text x="15" y="42" font-family="monospace" font-size="11" fill="#00ffff" class="p1">chenurag/chenurag</text>
    <text x="350" y="22" font-family="monospace" font-size="9" fill="#888">PUSHES <tspan fill="#00ff88">41</tspan></text>
    <text x="350" y="42" font-family="monospace" font-size="9" fill="#888">TODAY</text>
    <circle cx="450" cy="15" r="3" fill="#00ff88" class="blk"/>
  </g>

  <g transform="translate(690, 120)">
    <rect x="0" y="0" width="470" height="55" rx="6" fill="#040416" stroke="#00ffff" stroke-width="0.5"/>
    <text x="15" y="22" font-family="monospace" font-size="10" fill="#00ffff" font-weight="bold">GH ACTIVITY STREAK</text>
    <text x="15" y="44" font-family="monospace" font-size="16" fill="#00ffff" class="br">7 DAYS</text>
    <text x="180" y="44" font-family="monospace" font-size="9" fill="#888">BEST: <tspan fill="#00ff88">21 days</tspan></text>
    <text x="350" y="44" font-family="monospace" font-size="9" fill="#888">STATUS: <tspan fill="#00ff88" class="blk">ACTIVE</tspan></text>
    <circle cx="450" cy="15" r="3" fill="#00ffff" class="blk"/>
  </g>
</svg>