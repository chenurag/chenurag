<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="100%" height="auto">
  <defs><filter id="g"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style><![CDATA[
      @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
      @keyframes pulse{0%,100%{filter:drop-shadow(0 0 3px)}50%{filter:drop-shadow(0 0 12px)}}
      @keyframes breathe{0%,100%{opacity:0.3}50%{opacity:0.7}}
      @keyframes scan{0%{transform:translateX(-1200px)}100%{transform:translateX(1200px)}}
      @keyframes flick{0%,100%{opacity:0.96}2%{opacity:0.2}4%{opacity:0.96}}
      @keyframes scrollUp{0%{transform:translateY(0)}100%{transform:translateY(-400px)}}
      @keyframes barGrow{0%{height:0}100%{height:var(--h)}}
      .blk{animation:blink 0.8s step-end infinite}.p1{animation:pulse 2s ease-in-out infinite}
      .br{animation:breathe 4s ease-in-out infinite}.sc{animation:scan 4s linear infinite}.fk{animation:flick 7s infinite}
      .su{animation:scrollUp 18s linear infinite}
      .bg1{--h:30px;animation:barGrow 1.5s ease-out 0.2s both}.bg2{--h:50px;animation:barGrow 1.5s ease-out 0.4s both}
      .bg3{--h:70px;animation:barGrow 1.5s ease-out 0.6s both}.bg4{--h:90px;animation:barGrow 1.5s ease-out 0.8s both}
      .bg5{--h:110px;animation:barGrow 1.5s ease-out 1s both}.bg6{--h:60px;animation:barGrow 1.5s ease-out 1.2s both}
    ]]></style>
  </defs>
  <rect width="1200" height="220" fill="#02020c" rx="8"/>
  <rect x="1" y="1" width="1198" height="218" rx="8" fill="none" stroke="#00ff88" stroke-width="0.5" opacity="0.12"/>
  <rect class="sc" width="1200" height="1" fill="#00ff88" opacity="0.04"/>
  <rect class="fk" width="1200" height="220" fill="#000" opacity="0.01" pointer-events="none"/>
  <text x="600" y="24" font-family="monospace" font-size="14" fill="#00ff88" text-anchor="middle" letter-spacing="2" opacity="0.7">PROJECT TIMELINE — COMMIT FREQUENCY BY PROJECT</text>

  <g transform="translate(80, 60)">
    <rect x="30" y="110" width="40" height="0" rx="4" fill="#00ff88" opacity="0.8" class="bg1"/>
    <rect x="100" y="110" width="40" height="0" rx="4" fill="#00ffff" opacity="0.7" class="bg2"/>
    <rect x="170" y="110" width="40" height="0" rx="4" fill="#ff6600" opacity="0.7" class="bg3"/>
    <rect x="240" y="110" width="40" height="0" rx="4" fill="#ff003c" opacity="0.7" class="bg4"/>
    <rect x="310" y="110" width="40" height="0" rx="4" fill="#9d00ff" opacity="0.7" class="bg5"/>
    <rect x="380" y="110" width="40" height="0" rx="4" fill="#00ff88" opacity="0.8" class="bg6"/>
    <line x1="0" y1="110" x2="450" y2="110" stroke="#00ff88" stroke-width="0.5" opacity="0.2"/>
    
    <text x="50" y="140" font-family="monospace" font-size="11" fill="#888" text-anchor="middle">SITE</text>
    <text x="120" y="140" font-family="monospace" font-size="11" fill="#888" text-anchor="middle">PROF</text>
    <text x="190" y="140" font-family="monospace" font-size="11" fill="#888" text-anchor="middle">LABS</text>
    <text x="260" y="140" font-family="monospace" font-size="11" fill="#888" text-anchor="middle">TOOL</text>
    <text x="330" y="140" font-family="monospace" font-size="11" fill="#888" text-anchor="middle">AI</text>
    <text x="400" y="140" font-family="monospace" font-size="11" fill="#888" text-anchor="middle">DOC</text>
  </g>

  <g transform="translate(600, 45)">
    <rect x="0" y="0" width="560" height="60" rx="6" fill="#040416" stroke="#00ff88" stroke-width="0.5"/>
    <text x="15" y="24" font-family="monospace" font-size="13" fill="#00ff88" font-weight="bold">BUSIEST PROJECT</text>
    <text x="15" y="46" font-family="monospace" font-size="13" fill="#00ffff">CHENURAG/CHENURAG — 42 COMMITS TODAY</text>
    <circle cx="540" cy="18" r="4" fill="#00ff88" class="blk"/>
  </g>

  <g transform="translate(600, 118)">
    <rect x="0" y="0" width="560" height="60" rx="6" fill="#040416" stroke="#00ffff" stroke-width="0.5"/>
    <text x="15" y="24" font-family="monospace" font-size="13" fill="#00ffff" font-weight="bold">AVG COMMITS PER PROJECT</text>
    <text x="15" y="46" font-family="monospace" font-size="13" fill="#00ff88">LAST 30 DAYS: 14 / PROJECT</text>
    <circle cx="540" cy="18" r="4" fill="#00ffff" class="blk"/>
  </g>
</svg>