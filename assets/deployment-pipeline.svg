    <circle cx="20" cy="25" r="5" fill="#00ff88" class="p1"/>
    <text x="35" y="22" font-family="monospace" font-size="14" fill="#00ff88" font-weight="bold">BUILD</text>
    <text x="35" y="40" font-family="monospace" font-size="13" fill="#888">PASSED</text>
    <line x1="185" y1="25" x2="205" y2="25" stroke="#00ff88" stroke-width="1.5" class="dl"/>
    <circle cx="195" cy="25" r="4" fill="#00ff88" class="bp"/>
  </g>
  <g transform="translate(220, 55)">
    <rect x="0" y="0" width="180" height="50" rx="6" fill="#0a0a1a" stroke="#00ffff" stroke-width="0.8"/>
    <circle cx="20" cy="25" r="5" fill="#00ffff" class="blk"/>
    <text x="35" y="22" font-family="monospace" font-size="14" fill="#00ffff" font-weight="bold">TEST</text>
    <text x="35" y="40" font-family="monospace" font-size="13" fill="#888">PASSED</text>
    <line x1="185" y1="25" x2="205" y2="25" stroke="#00ffff" stroke-width="1.5" class="dl"/>
    <circle cx="195" cy="25" r="4" fill="#00ffff" class="bp2"/>
  </g>
  <g transform="translate(390, 55)">
    <rect x="0" y="0" width="180" height="50" rx="6" fill="#0a0a1a" stroke="#9d00ff" stroke-width="0.8"/>
    <circle cx="20" cy="25" r="5" fill="#9d00ff" class="p1"/>
    <text x="35" y="22" font-family="monospace" font-size="14" fill="#9d00ff" font-weight="bold">DEPLOY</text>
    <text x="35" y="40" font-family="monospace" font-size="13" fill="#888">COMPLETE</text>
    <line x1="185" y1="25" x2="205" y2="25" stroke="#9d00ff" stroke-width="1.5" class="dl"/>
    <circle cx="195" cy="25" r="4" fill="#9d00ff" class="bp3"/>
  </g>
  <g transform="translate(560, 55)">
    <rect x="0" y="0" width="180" height="50" rx="6" fill="#0a1a0a" stroke="#00ff88" stroke-width="1.2"/>
    <circle cx="20" cy="25" r="5" fill="#00ff88" class="p1"/>
    <text x="35" y="22" font-family="monospace" font-size="14" fill="#00ff88" font-weight="bold">MONITOR</text>
    <text x="35" y="40" font-family="monospace" font-size="13" fill="#888">ACTIVE</text>
    <line x1="185" y1="25" x2="205" y2="25" stroke="#00ff88" stroke-width="1.5" class="dl"/>
    <circle cx="195" cy="25" r="4" fill="#00ff88" class="bp"/>
  </g>

  <g transform="translate(50, 125)">
    <rect x="0" y="0" width="350" height="55" rx="6" fill="#040416" stroke="#00ff88" stroke-width="0.5"/>
    <text x="15" y="22" font-family="monospace" font-size="14" fill="#00ff88" font-weight="bold">LAST DEPLOYMENT</text>
    <text x="15" y="42" font-family="monospace" font-size="14" fill="#888">v4.6 · 2 min ago · <tspan fill="#00ff88" class="p1">SUCCESS</tspan></text>
    <circle cx="330" cy="18" r="4" fill="#00ff88" class="blk"/>
  </g>
  <g transform="translate(420, 125)">
    <rect x="0" y="0" width="350" height="55" rx="6" fill="#040416" stroke="#00ffff" stroke-width="0.5"/>
    <text x="15" y="22" font-family="monospace" font-size="14" fill="#00ffff" font-weight="bold">PIPELINE HEALTH</text>
    <text x="15" y="42" font-family="monospace" font-size="14" fill="#888">UPTIME: <tspan fill="#00ff88">99.9%</tspan> · FAILURES: <tspan fill="#ff003c">0</tspan></text>
    <circle cx="330" cy="18" r="4" fill="#00ffff" class="blk"/>
  </g>
  <g transform="translate(790, 125)">
    <rect x="0" y="0" width="360" height="55" rx="6" fill="#040416" stroke="#9d00ff" stroke-width="0.5"/>
    <text x="15" y="22" font-family="monospace" font-size="14" fill="#9d00ff" font-weight="bold">AUTO-DEPLOY</text>
    <text x="15" y="42" font-family="monospace" font-size="14" fill="#888">Git Push → Auto Deploy → <tspan fill="#00ff88">ENABLED</tspan></text>
    <circle cx="340" cy="18" r="4" fill="#9d00ff" class="blk"/>
