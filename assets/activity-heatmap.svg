<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="100%" height="auto">
  <defs>
    <style>
      @keyframes cellIn{0%{opacity:0}100%{opacity:1}}
      @keyframes pulse{0%,100%{opacity:0.5;filter:drop-shadow(0 0 2px #00ff88)}50%{opacity:1;filter:drop-shadow(0 0 10px #00ff88)}}
      @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
      @keyframes breathe{0%,100%{opacity:0.4}50%{opacity:0.8}}
      @keyframes scan{0%{transform:translateY(-260px)}100%{transform:translateY(260px)}}
      @keyframes flick{0%,100%{opacity:0.96}2%{opacity:0.2}4%{opacity:0.96}}

      .c1{animation:cellIn 0.3s ease-out 0.05s both}.c2{animation:cellIn 0.3s ease-out 0.1s both}
      .c3{animation:cellIn 0.3s ease-out 0.15s both}.c4{animation:cellIn 0.3s ease-out 0.2s both}
      .c5{animation:cellIn 0.3s ease-out 0.25s both}.c6{animation:cellIn 0.3s ease-out 0.3s both}
      .c7{animation:cellIn 0.3s ease-out 0.35s both}.c8{animation:cellIn 0.3s ease-out 0.4s both}
      .c9{animation:cellIn 0.3s ease-out 0.45s both}.c10{animation:cellIn 0.3s ease-out 0.5s both}
      .c11{animation:cellIn 0.3s ease-out 0.55s both}.c12{animation:cellIn 0.3s ease-out 0.6s both}
      .p1{animation:pulse 2s ease-in-out infinite}
      .blk{animation:blink 0.8s step-end infinite}
      .br{animation:breathe 4s ease-in-out infinite}
      .sc{animation:scan 6s linear infinite}
      .fk{animation:flick 7s infinite}
    </style>
  </defs>

  <rect width="1200" height="260" fill="#02020c" rx="8"/>
  <rect x="1" y="1" width="1198" height="258" rx="8" fill="none" stroke="#00ff88" stroke-width="0.5" opacity="0.12"/>
  <rect class="sc" width="1200" height="1" fill="#00ff88" opacity="0.04"/>
  <rect class="fk" width="1200" height="260" fill="#000" opacity="0.01" pointer-events="none"/>

