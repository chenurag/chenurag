<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="100%" height="auto">
  <defs><filter id="g"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style><![CDATA[
      @keyframes fillArc{0%{stroke-dashoffset:283}100%{stroke-dashoffset:var(--s)}}
      @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}@keyframes p1{0%,100%{filter:drop-shadow(0 0 4px)}50%{filter:drop-shadow(0 0 14px)}}
      @keyframes br{0%,100%{opacity:0.3}50%{opacity:0.7}}@keyframes scan{0%{transform:translateX(-1200px)}100%{transform:translateX(1200px)}}
      .fa1{--s:28;stroke-dasharray:283;stroke-dashoffset:283;animation:fillArc 2s ease-out 0.2s forwards}
      .fa2{--s:85;stroke-dasharray:283;stroke-dashoffset:283;animation:fillArc 2s ease-out 0.4s forwards}
      .fa3{--s:142;stroke-dasharray:283;stroke-dashoffset:283;animation:fillArc 2s ease-out 0.6s forwards}
      .blk{animation:blink 0.8s step-end infinite}.p1{animation:p1 2s ease-in-out infinite}
      .br{animation:br 4s ease-in-out infinite}.sc{animation:scan 4s linear infinite}
    ]]></style>
  </defs>
  <rect width="1200" height="240" fill="#02020c" rx="8"/>
  <rect x="1" y="1" width="1198" height="238" rx="8" fill="none" stroke="#00ff88" stroke-width="0.5" opacity="0.12"/>
  <rect class="sc" width="1200" height="1" fill="#00ff88" opacity="0.04"/>
  <text x="600" y="26" font-family="monospace" font-size="15" fill="#00ff88" text-anchor="middle" letter-spacing="2" opacity="0.7">CODE QUALITY METRICS — AUTOMATED ANALYSIS</text>

  <g transform="translate(130, 130)">
    <circle cx="0" cy="0" r="45" fill="none" stroke="#112" stroke-width="16"/>
    <circle cx="0" cy="0" r="45" fill="none" stroke="#00ff88" stroke-width="16" class="fa1" stroke-linecap="round" transform="rotate(-90)"/>
    <circle cx="0" cy="0" r="45" fill="none" stroke="#ffd700" stroke-width="16" class="fa2" stroke-linecap="round" transform="rotate(-90)" stroke-dashoffset="-28"/>
    <circle cx="0" cy="0" r="45" fill="none" stroke="#ff003c" stroke-width="16" class="fa3" stroke-linecap="round" transform="rotate(-90)" stroke-dashoffset="-113"/>
    <text x="0" y="5" font-family="monospace" font-size="15" fill="#00ff88" text-anchor="middle" font-weight="bold" class="p1">B+</text>
    <text x="0" y="75" font-family="monospace" font-size="13" fill="#888" text-anchor="middle">QUALITY</text>
  </g>

  <g transform="translate(320, 50)">
    <rect x="0" y="0" width="18" height="18" rx="4" fill="#00ff88"/><text x="25" y="15" font-family="monospace" font-size="14" fill="#00ff88">MAINTAINABLE: 90%</text>
    <rect x="250" y="0" width="18" height="18" rx="4" fill="#ffd700"/><text x="275" y="15" font-family="monospace" font-size="14" fill="#ffd700">TEST COVERAGE: 70%</text>
    <rect x="0" y="30" width="18" height="18" rx="4" fill="#ff003c"/><text x="25" y="45" font-family="monospace" font-size="14" fill="#ff6666">ISSUES: 12</text>
    <rect x="250" y="30" width="18" height="18" rx="4" fill="#00ffff"/><text x="275" y="45" font-family="monospace" font-size="14" fill="#00ffff">FILES ANALYZED: 47</text>
  </g>

  <g transform="translate(320, 95)">
    <text x="0" y="16" font-family="monospace" font-size="14" fill="#888">LINT PASS RATE:</text>
    <rect x="160" y="6" width="300" height="14" rx="5" fill="#0a0a1e" stroke="#00ff88" stroke-width="0.3"/>
    <rect x="160" y="6" width="255" height="14" rx="5" fill="#00ff88" opacity="0.7"><animate attributeName="width" values="0;255" dur="2s" fill="freeze"/></rect>
    <text x="480" y="16" font-family="monospace" font-size="14" fill="#00ff88" class="p1">85%</text>
  </g>
  <g transform="translate(320, 130)">
    <text x="0" y="16" font-family="monospace" font-size="14" fill="#888">DUPLICATION:</text>
    <rect x="160" y="6" width="300" height="14" rx="5" fill="#0a0a1e" stroke="#ff6600" stroke-width="0.3"/>
    <rect x="160" y="6" width="60" height="14" rx="5" fill="#ff6600" opacity="0.6"><animate attributeName="width" values="0;60" dur="2s" fill="freeze"/></rect>
    <text x="480" y="16" font-family="monospace" font-size="14" fill="#ff6600">5%</text>
  </g>
  <g transform="translate(320, 165)">
    <text x="0" y="16" font-family="monospace" font-size="14" fill="#888">COMPLEXITY:</text>
    <rect x="160" y="6" width="300" height="14" rx="5" fill="#0a0a1e" stroke="#00ffff" stroke-width="0.3"/>
    <rect x="160" y="6" width="210" height="14" rx="5" fill="#00ffff" opacity="0.6"><animate attributeName="width" values="0;210" dur="2s" fill="freeze"/></rect>
    <text x="480" y="16" font-family="monospace" font-size="14" fill="#00ffff">AVG: 4.2</text>
  </g>

  <g transform="translate(750, 50)">
    <rect x="0" y="0" width="410" height="70" rx="6" fill="#040416" stroke="#00ff88" stroke-width="0.5"/>
    <text x="15" y="22" font-family="monospace" font-size="15" fill="#00ff88" font-weight="bold">TECH DEBT</text>
    <text x="15" y="48" font-family="monospace" font-size="14" fill="#888">ESTIMATED: <tspan fill="#ff6600" class="p1">3.2 hours</tspan></text>
    <text x="250" y="48" font-family="monospace" font-size="14" fill="#888">TREND: <tspan fill="#00ff88">DECREASING</tspan></text>
    <circle cx="390" cy="18" r="4" fill="#00ff88" class="blk"/>
  </g>
  <g transform="translate(750, 135)">
    <rect x="0" y="0" width="410" height="55" rx="6" fill="#040416" stroke="#00ffff" stroke-width="0.5"/>
    <text x="15" y="22" font-family="monospace" font-size="14" fill="#00ffff" font-weight="bold">TOP CONCERN</text>
    <text x="15" y="44" font-family="monospace" font-size="14" fill="#888">Unhandled exceptions in error handling</text>
    <circle cx="390" cy="18" r="4" fill="#00ffff" class="blk"/>
  </g>
  <g transform="translate(750, 205)">
    <rect x="0" y="0" width="410" height="28" rx="4" fill="#060618" stroke="#00ff88" stroke-width="0.4" opacity="0.3"/>
    <text x="15" y="19" font-family="monospace" font-size="13" fill="#555">LAST ANALYSIS: <tspan fill="#00ff88">TODAY 04:00</tspan></text>
  </g>
</svg>