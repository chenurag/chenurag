  <rect class="fk" width="1200" height="190" fill="#000" opacity="0.01" pointer-events="none"/>
  <text x="600" y="20" font-family="monospace" font-size="12" fill="#00ffff" text-anchor="middle" letter-spacing="2" opacity="0.7">SHIFT HANDOVER LOG</text>  <g transform="translate(15,30)">
