    @keyframes fk{0%,100%{opacity:0.96}2%{opacity:0.2}4%{opacity:0.96}}
    .p{animation:p 2s ease-in-out infinite}.sc{animation:sc 4s linear infinite}.fk{animation:fk 7s infinite}
  ]]></style></defs>
  <rect width="1200" height="190" fill="#02020c" rx="6"/>
