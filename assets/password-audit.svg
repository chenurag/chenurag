<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="100%" height="auto">
  <defs><filter id="g"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style><![CDATA[
      @keyframes fillBar{0%{width:0}100%{width:var(--w)}}
      @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}@keyframes p1{0%,100%{filter:drop-shadow(0 0 4px)}50%{filter:drop-shadow(0 0 14px)}}
      @keyframes br{0%,100%{opacity:0.3}50%{opacity:0.7}}@keyframes scan{0%{transform:translateX(-1200px)}100%{transform:translateX(1200px)}}
      @keyframes flick{0%,100%{opacity:0.96}2%{opacity:0.2}4%{opacity:0.96}}@keyframes wave{0%,100%{d:path('')}50%{d:path('')}}
      .fb1{--w:80px;animation:fillBar 2s ease-out 0.2s both}.fb2{--w:140px;animation:fillBar 2s ease-out 0.4s both}
      .fb3{--w:200px;animation:fillBar 2s ease-out 0.6s both}.fb4{--w:280px;animation:fillBar 2s ease-out 0.8s both}
      .fb5{--w:350px;animation:fillBar 2s ease-out 1s both}.fb6{--w:420px;animation:fillBar 2s ease-out 1.2s both}
      .blk{animation:blink 0.8s step-end infinite}.p1{animation:p1 2s ease-in-out infinite}
      .br{animation:br 4s ease-in-out infinite}.sc{animation:scan 4s linear infinite}.fk{animation:flick 7s infinite}
    ]]></style>
  </defs>
  <rect width="1200" height="260" fill="#02020c" rx="8"/>
  <rect x="1" y="1" width="1198" height="258" rx="8" fill="none" stroke="#00ff88" stroke-width="0.5" opacity="0.12"/>
  <rect class="sc" width="1200" height="1" fill="#00ff88" opacity="0.04"/>
  <rect class="fk" width="1200" height="260" fill="#000" opacity="0.01" pointer-events="none"/>
  <text x="600" y="26" font-family="monospace" font-size="16" fill="#00ff88" text-anchor="middle" letter-spacing="2" opacity="0.7">PASSWORD SECURITY AUDIT — STRENGTH ANALYSIS</text>

  <g transform="translate(80, 55)">
    <rect x="0" y="0" width="500" height="16" rx="5" fill="#0a0a1e" stroke="#ff003c" stroke-width="0.3"/>
    <rect x="0" y="0" width="80" height="16" rx="5" fill="#ff003c" opacity="0.7" class="fb1"/>
    <text x="520" y="13" font-family="monospace" font-size="14" fill="#ff003c">WEAK: 4</text>
  </g>
  <g transform="translate(80, 90)">
    <rect x="0" y="0" width="500" height="16" rx="5" fill="#0a0a1e" stroke="#ff6600" stroke-width="0.3"/>
    <rect x="0" y="0" width="140" height="16" rx="5" fill="#ff6600" opacity="0.6" class="fb2"/>
    <text x="520" y="13" font-family="monospace" font-size="14" fill="#ff6600">FAIR: 7</text>
  </g>
  <g transform="translate(80, 125)">
    <rect x="0" y="0" width="500" height="16" rx="5" fill="#0a0a1e" stroke="#ffd700" stroke-width="0.3"/>
    <rect x="0" y="0" width="200" height="16" rx="5" fill="#ffd700" opacity="0.6" class="fb3"/>
    <text x="520" y="13" font-family="monospace" font-size="14" fill="#ffd700">GOOD: 10</text>
  </g>
  <g transform="translate(80, 160)">
    <rect x="0" y="0" width="500" height="16" rx="5" fill="#0a0a1e" stroke="#00ff88" stroke-width="0.3"/>
    <rect x="0" y="0" width="280" height="16" rx="5" fill="#00ff88" opacity="0.6" class="fb4"/>
    <text x="520" y="13" font-family="monospace" font-size="14" fill="#00ff88">STRONG: 14</text>
  </g>
  <g transform="translate(80, 195)">
    <rect x="0" y="0" width="500" height="16" rx="5" fill="#0a0a1e" stroke="#00ffff" stroke-width="0.3"/>
    <rect x="0" y="0" width="350" height="16" rx="5" fill="#00ffff" opacity="0.6" class="fb5"/>
    <text x="520" y="13" font-family="monospace" font-size="14" fill="#00ffff">VERY STRONG: 18</text>
  </g>
  <g transform="translate(80, 230)">
    <rect x="0" y="0" width="500" height="16" rx="5" fill="#0a0a1e" stroke="#9d00ff" stroke-width="0.3"/>
    <rect x="0" y="0" width="420" height="16" rx="5" fill="#9d00ff" opacity="0.6" class="fb6"/>
    <text x="520" y="13" font-family="monospace" font-size="14" fill="#9d00ff">MASTER: 21</text>
  </g>

  <g transform="translate(660, 55)">
    <rect x="0" y="0" width="490" height="70" rx="6" fill="#040416" stroke="#00ff88" stroke-width="0.8"/>
    <text x="15" y="22" font-family="monospace" font-size="15" fill="#00ff88" font-weight="bold">PASSWORD HEALTH SCORE</text>
    <text x="15" y="50" font-family="monospace" font-size="18" fill="#00ff88" class="p1">
      <tspan><animate attributeName="values" values="0;20;40;60;74" dur="3s" fill="freeze"/>74</tspan>/100
    </text>
    <text x="160" y="50" font-family="monospace" font-size="14" fill="#888">74 PASSWORDS AUDITED</text>
    <circle cx="470" cy="18" r="4" fill="#00ff88" class="blk"/>
  </g>

  <g transform="translate(660, 140)">
    <rect x="0" y="0" width="490" height="55" rx="6" fill="#040416" stroke="#00ffff" stroke-width="0.5"/>
    <text x="15" y="22" font-family="monospace" font-size="14" fill="#00ffff" font-weight="bold">MOST USED PATTERN</text>
    <text x="15" y="44" font-family="monospace" font-size="14" fill="#888">Password1212 — 8 char alpha-numeric</text>
    <circle cx="470" cy="18" r="4" fill="#00ffff" class="blk"/>
  </g>

  <g transform="translate(660, 210)">
    <rect x="0" y="0" width="490" height="30" rx="4" fill="#060618" stroke="#00ff88" stroke-width="0.4" opacity="0.3"/>
    <text x="15" y="20" font-family="monospace" font-size="13" fill="#555">RECOMMENDATION: <tspan fill="#00ff88">ENABLE 2FA ON ALL ACCOUNTS</tspan></text>
  </g>
</svg>