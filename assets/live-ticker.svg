<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 70" width="100%" height="auto">
  <defs>
    <filter id="g"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style><![CDATA[

      @keyframes marquee{0%{transform:translateX(1200px)}100%{transform:translateX(-100%)}}
      @keyframes blk{0%,100%{opacity:1}50%{opacity:0}}
      @keyframes br{0%,100%{opacity:0.4}50%{opacity:0.9}}
      @keyframes flick{0%,100%{opacity:0.97}3%{opacity:0.2}6%{opacity:0.97}}
      
      .mq{animation:marquee 25s linear infinite}
      .blk{animation:blk 0.8s step-end infinite}
      .br{animation:br 3s ease-in-out infinite}
      .fk{animation:flick 6s infinite}
    
]]></style>
  </defs>

  <rect width="1200" height="70" fill="#02020c" rx="8"/>
  <rect x="1" y="1" width="1198" height="68" rx="8" fill="none" stroke="#00ff88" stroke-width="0.5" opacity="0.12"/>
  <rect class="fk" width="1200" height="70" fill="#000" opacity="0.01" pointer-events="none"/>

  <!-- Label -->
  <rect x="0" y="0" width="130" height="70" rx="8" fill="#04041a"/>
  <circle cx="20" cy="18" r="4" fill="#ff003c" class="blk" filter="url(#g)"/>
  <text x="16" y="38" font-family="monospace" font-size="15" fill="#ff6666" font-weight="bold">LIVE</text>
  <text x="16" y="54" font-family="monospace" font-size="14" fill="#666">FEED</text>

  <!-- Ticker content -->
  <g clip-path="url(#clipTicker)">
    <defs>
      <clipPath id="clipTicker"><rect x="135" y="8" width="1055" height="54" rx="4"/></clipPath>
    </defs>
    <g class="mq" font-family="monospace" font-size="13">
      <!-- Repeated messages -->
      <text x="0" y="28" fill="#00ff88">▸ LEARNING: Penetration Testing Methodology ▸</text>
      <text x="330" y="28" fill="#00ffff">BUILDING: ShadowAssistant v0.5 ▸</text>
      <text x="660" y="28" fill="#ff003c">WATCHING: CVE-2026-XXXX analysis ▸</text>
      <text x="990" y="28" fill="#9d00ff">EXPLORING: AI-assisted malware triage ▸</text>
      <text x="0" y="50" fill="#00ffff">▸ STATUS: ALL SYSTEMS OPERATIONAL ▸</text>
      <text x="330" y="50" fill="#00ff88">MISSION: SECURE THE DIGITAL GALAXY ▸</text>
      <text x="660" y="50" fill="#ff6600">NEXT: OSCP-STYLE LAB CHALLENGE ▸</text>
      <text x="990" y="50" fill="#00ffff">SYSTEM INTEGRITY: 100% ▸</text>
    </g>
  </g>

  <!-- Right edge fade -->
  <rect x="1100" y="0" width="100" height="70" fill="url(#edgeFade)"/>
  <defs>
    <linearGradient id="edgeFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#02020c" stop-opacity="0"/><stop offset="100%" stop-color="#02020c" stop-opacity="1"/>
    </linearGradient>
  </defs>
</svg>