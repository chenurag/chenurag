name: 🐍 Contribution Snake

on:
  schedule:
    - cron: "0 */12 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    name: 🐍 Generate Contribution Snake
    runs-on: ubuntu-latest

    steps:
      - name: 🐍 Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: chenurag
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=00ff9d

      - name: 🚀 Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
          build_branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
